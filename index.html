<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>EngPro App — Sign In</title>
  <link rel="stylesheet" href="css/main.css" />
  <link rel="icon" href="/favicon.png" type="image/png" />
</head>
<body class="login-page">

  <div class="login-card">
    <div class="login-logo">
      <div class="login-logo-icon">
        <img src="/icons/logo.png" alt="Logo">
      </div>
      <div>
        <div class="login-appname">EngPro App</div>
        <div class="login-tagline">Track. Manage. Deliver.</div>
      </div>
    </div>

    <div class="form-group">
      <label for="username">Username</label>
      <input type="text" id="username" placeholder="username" autocomplete="username" />
    </div>

    <div class="form-group">
      <label for="password">Password</label>
      <input type="password" id="password" placeholder="••••••••" autocomplete="current-password" />
    </div>

    <div class="login-options">
      <label class="checkbox-label">
        <input type="checkbox" id="remember" /> Remember me
      </label>
      <!-- FIX [L1]: button disabled during async call to prevent double-sends -->
      <a href="#" class="forgot-link" id="forgot-link" onclick="handleForgotPassword()">Forgot password?</a>
    </div>

    <button class="btn btn-primary login-btn" id="login-btn" onclick="handleLogin()">Sign In</button>

    <p class="login-footer">Engineering Activity &amp; Manhour Monitoring System</p>
  </div>

  <!-- Toast container (used instead of alert()) -->
  <div id="toast-container"></div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="js/supabase.js"></script>
  <script src="js/utils.js"></script>
  <script>
    // Auto-redirect if already logged in
    db.auth.getSession().then(({ data: { session } }) => {
      if (session?.user) window.location.href = 'pages/dashboard.html';
    });

    document.getElementById('password').addEventListener('keydown', e => {
      if (e.key === 'Enter') handleLogin();
    });
	
	document.getElementById('username').addEventListener('keydown', e => {
      if (e.key === 'Enter') handleLogin();
    });

    async function handleLogin() {
      const username = document.getElementById('username').value.trim();
      const password = document.getElementById('password').value;
      const btn      = document.getElementById('login-btn');

      if (!username || !password) { toast('Please enter your username and password.', 'error'); return; }

      btn.textContent = 'Signing in…';
      btn.disabled    = true;

      try {
	    const remember = document.getElementById('remember').checked;
        setRememberPreference(remember);
        await signIn(username, password);
        window.location.href = 'pages/dashboard.html';
      } catch (err) {
        toast(err.message || 'Invalid credentials. Please try again.', 'error');
        btn.textContent = 'Sign In';
        btn.disabled    = false;
      }
    }

    async function handleForgotPassword() {
      const username = document.getElementById('username').value.trim();
      const link      = document.getElementById('forgot-link');

      if (!username) { toast('Enter your username first.', 'error'); return; }

      // FIX [L1]: Disable link during async call to prevent multiple reset emails
      link.style.pointerEvents = 'none';
      link.style.opacity       = '0.5';

      try {
        // Resolve username -> email first; resetPasswordForEmail() needs an email.
        const email = await getEmailForUsername(username);
        await db.auth.resetPasswordForEmail(email, { redirectTo: window.location.origin + '/pages/reset-password.html' });
        // FIX [H1]: Use toast() instead of native alert()
        toast('If that username exists, a reset link has been sent.', 'info');
      } catch (err) {
        // Same generic message whether the username exists or not, and
        // whether the failure was the lookup or the email send —
        // don't leak which usernames are registered.
        toast('If that username exists, a reset link has been sent.', 'info');
      } finally {
        link.style.pointerEvents = '';
        link.style.opacity       = '';
      }
    }
  </script>
</body>
</html>
