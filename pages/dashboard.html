 async function confirmSnapshot() {
   if (!isAdmin) {
     toast('Invalid action — you do not have permission to take a snapshot.', 'error');
     return;
   }
   
   const projId = document.getElementById('snapshot-project-sel')?.value || '';
   if (!projId) { toast('Please select a project.', 'error'); return; }
 
   const btn = document.getElementById('snapshot-confirm-btn');
   if (btn) { btn.disabled = true; btn.textContent = 'Saving…'; }
 
   try {
     // Get active disciplines from targets table
     const { data: targRows, error: targErr } = await db.from('targets')
       .select('discipline_id, disciplines(name, code)')
       .eq('project_id', projId);
 
     if (targErr) throw new Error(targErr.message);
 
     // Deduplicate disciplines
     const seen = new Set();
     const discsToSnap = [];
     (targRows || []).forEach(r => {
       if (r.discipline_id && !seen.has(r.discipline_id)) {
         seen.add(r.discipline_id);
         discsToSnap.push({ id: r.discipline_id, code: r.disciplines?.code, name: r.disciplines?.name });
       }
     });
 
     if (!discsToSnap.length) {
       toast('No active disciplines found for this project.', 'error');
       return;
     }
 
     // Get ROC weights for this project
     const { data: rocRows, error: rocErr } = await db.from('project_discipline_roc')
       .select('discipline_id, roc').eq('project_id', projId);
     if (rocErr) console.warn('[dashboard:confirmSnapshot:project_discipline_roc]', rocErr.message);
     const rocByDisc = {};
     (rocRows || []).forEach(r => { rocByDisc[r.discipline_id] = parseFloat(r.roc) || 0; });
 
     // Snapshot date as picked in the modal — defaults to today, but can be
     // backdated/forward-dated (e.g. to backfill days pgcron didn't capture).
     const snapDateStr = document.getElementById('snapshot-date-input')?.value;
     if (!snapDateStr) { toast('Please select a snapshot date.', 'error'); if (btn) { btn.disabled = false; btn.textContent = 'Take Snapshot'; } return; }

     const rows = [];
     let doneCount = 0;

     for (const disc of discsToSnap) {
       if (btn) btn.textContent = `Saving ${++doneCount} of ${discsToSnap.length}…`;

       // 1. Actual progress
       const actualProgress = await computeActualProgress(projId, disc.id, rocByDisc);

       // 2. Actual manpower
       const actualMP = await getActualManpower(projId, disc.id);

       rows.push({
         project_id:       projId,
         discipline_id:    disc.id,
         snapshot_date:    snapDateStr,
         actual_progress:  actualProgress || 0,
         actual_mp:        actualMP,
         planned_progress: null, 
         planned_mh:       null,
 		planned_mp: 	  null,
       });
     }
 
     const { error } = await db.from('progress_snapshots')
       .upsert(rows, { onConflict: 'project_id,discipline_id,snapshot_date' });
 
     if (error) throw new Error(error.message);
 
     closeModal('snapshot-modal');
     toast(`Snapshot saved — ${rows.length} discipline${rows.length !== 1 ? 's' : ''} captured.`, 'success');
     await Promise.all([reloadMhChart(), reloadKpiChart()]);
     await reloadScurve();
 
   } catch (err) {
     console.error('Snapshot error:', err);
     toast('Snapshot failed: ' + err.message, 'error');
   } finally {
     if (btn) { btn.disabled = false; btn.textContent = 'Take Snapshot'; }
   }
 }

    // ─── LOWER CHARTS ─────────────────────────────────────────────────────────
    const DOC_STATUS_TABLES = {
      drawing: ['erection_drawings', 'fabrication_drawings', 'support_drawings', 'weld_map_drawings'],
      test_package: ['test_package_drawings'],
    };

    async function reloadDocumentStatus() {
      if (!docReady()) {
        if (statusChart) { statusChart.destroy(); statusChart = null; }
        showChartEmptyOverlay('chart-status', 'Select Project and Doc Type to view this chart.');
        return;
      }
      const projId   = document.getElementById('doc-f-project').value;
      const docType  = document.getElementById('doc-f-doctype').value; // model|drawing|test_package|calculations|materials
      const project  = projectsData.find(p => p.id === projId);
      const projCode = project?.code || null;

      // 1. Which steps actually have a KPI target for this project + doc type?
      const { data: kpiRowsRaw, error: kpiRowsRawErr } = await db.from('target_kpi')
        .select('workflow_steps(id, name, sort_order), document_codes(activity_type)')
        .eq('project_id', projId);
      if (kpiRowsRawErr) console.warn('[dashboard:reloadDocumentStatus:target_kpi]', kpiRowsRawErr.message);
      const kpiRows = (kpiRowsRaw || []).filter(k => k.document_codes?.activity_type === docType);

      const stepMap = new Map(); // step name -> sort_order
      kpiRows.forEach(k => {
        const ws = k.workflow_steps;
        if (ws && !stepMap.has(ws.name)) stepMap.set(ws.name, ws.sort_order ?? 0);
      });

      if (!stepMap.size) {
        if (statusChart) { statusChart.destroy(); statusChart = null; }
        showChartEmptyOverlay('chart-status', 'No KPI targets defined for this Project and Doc Type.');
        return;
      }

      // 2. Load the actual documents' statuses for this doc type
      let rows = [];
      let modelStepTons = null; // ton-based totals — only populated for docType === 'model'
      if (docType === 'model') {
        const { data, error } = await db.from('models_3d').select('step_progress').eq('project_id', projId);
        if (error) console.warn('[dashboard:reloadDocumentStatus:models_3d]', error.message);
        rows = data || [];

        // Models track cumulative per-step tonnage in step_progress, not a single
        // overwritten "status" field — a model that has completed Stick Modeling,
        // Connection Modeling, AND Numbering must be counted toward all three
        // (weighted by tons), not just whichever step was logged most recently.
        modelStepTons = {};
        rows.forEach(r => {
          const sp = r.step_progress || {};
          Object.entries(sp).forEach(([stepName, tons]) => {
            if (!stepMap.has(stepName)) return;
            const t = parseFloat(tons) || 0;
            if (t <= 0) return;
            modelStepTons[stepName] = (modelStepTons[stepName] || 0) + t;
          });
        });
      } else if (docType === 'drawing') {
        const fetches = DOC_STATUS_TABLES.drawing.map(t =>
          db.from(t).select('status').eq('project_id', projId).then(r => {
            if (r.error) console.warn(`[dashboard:reloadDocumentStatus:${t}]`, r.error.message);
            return r.data || [];
          })
        );
        rows = (await Promise.all(fetches)).flat();
      } else if (docType === 'test_package') {
        const { data, error } = await db.from('test_package_drawings').select('status').eq('project_id', projId);
        if (error) console.warn('[dashboard:reloadDocumentStatus:test_package_drawings]', error.message);
        rows = data || [];
      } else if (docType === 'calculations') {
        const { data, error } = await db.from('eng_calculations').select('status').eq('project_id', projId);
        if (error) console.warn('[dashboard:reloadDocumentStatus:eng_calculations]', error.message);
        rows = data || [];
      } else if (docType === 'materials') {
        if (projCode) {
          const { data, error } = await db.from('material_status').select('status').eq('project_code', projCode);
          if (error) console.warn('[dashboard:reloadDocumentStatus:material_status]', error.message);
          rows = data || [];
        }
      }

      // 3. Count only statuses that match a targeted step — untargeted statuses are excluded
      let bySt;
      if (modelStepTons) {
        // Ton-based totals for 3D Model — round to 2dp for consistent display.
        bySt = {};
        Object.entries(modelStepTons).forEach(([k, v]) => { bySt[k] = parseFloat(v.toFixed(2)); });
      } else {
        bySt = {};
        rows.forEach(r => {
          if (r.status && stepMap.has(r.status)) bySt[r.status] = (bySt[r.status] || 0) + 1;
        });
      }

      if (!Object.keys(bySt).length) {
        if (statusChart) { statusChart.destroy(); statusChart = null; }
        showChartEmptyOverlay('chart-status', 'No documents found at any targeted step for this selection.');
        return;
      }

      // 4. Colors assigned dynamically by workflow sort_order — no more hardcoded status names
      const palette = ['#333','#555','#F8A145','#F07900','#D35100','#ff6b35','#22c55e','#16a34a','#3b82f6','#8b5cf6','#ec4899','#eab308'];
      const orderedNames = [...stepMap.entries()].sort((a, b) => a[1] - b[1]).map(([name]) => name);
      const colorByName = {};
      orderedNames.forEach((name, i) => { colorByName[name] = palette[i % palette.length]; });

      const labels = orderedNames.filter(n => bySt[n]);
      const chartData = labels.map(n => bySt[n]);
      const colors = labels.map(n => colorByName[n]);

      const canvas = document.getElementById('chart-status');
      if (!canvas) return;
      clearChartEmptyOverlay('chart-status');
      if (statusChart) statusChart.destroy();
      const unitSuffix = modelStepTons ? ' MT' : ''; // tons for 3D Model, plain count otherwise
      statusChart = new Chart(canvas, {
        type: 'pie',
        data: { labels, datasets: [{ data: chartData, backgroundColor: colors, borderWidth: 1, borderColor: window.CHART_BORDER }] },
        options: {
	  	  layout: { padding: 0 },
          plugins: {
            legend: {
              position: 'right',
              align: 'center',
              labels: {
                color: '#888',
                font: { family: 'Inter', size: 13 },
                boxWidth: 20,
                boxHeight: 14,
                padding: 14,
                textAlign: 'left'
              }
            },
            tooltip: {
              callbacks: {
                title: () => '',
                label: (ctx) => `${ctx.label}: ${ctx.parsed}${unitSuffix}`
              }
            }
          },
          responsive: true, maintainAspectRatio: false
        }
      });
    }

    // ─── RECENT ACTIVITY ──────────────────────────────────────────────────────
    async function loadRecentActivity() {
      const el = document.getElementById('recent-activity');
      if (!el) return;

      const RECENT_FILTER = isLeadUp ? {} : { user_id: selfUserId };
      const RECENT_DRAW_SOURCES = [
        { acts: 'erection_drawing_activities',    fk: 'erection_drawing_id',     draw: 'erection_drawings'     },
        { acts: 'fabrication_drawing_activities', fk: 'fabrication_drawing_id',  draw: 'fabrication_drawings'  },
        { acts: 'support_drawing_activities',     fk: 'support_drawing_id',      draw: 'support_drawings'      },
        { acts: 'weld_map_drawing_activities',    fk: 'weld_map_drawing_id',     draw: 'weld_map_drawings'     },
      ];
      const recentDrawFetches = RECENT_DRAW_SOURCES.map(async src => {
        const { data: acts, error: actsErr } = await db.from(src.acts)
          .select(`manhours, created_at, ${src.fk}, user_id`)
          .match(RECENT_FILTER).order('created_at', { ascending: false })
          .limit(10);
        if (actsErr) console.warn(`[dashboard:loadRecentActivity:${src.acts}]`, actsErr.message);
        if (!acts?.length) return [];
        const drawingIds = [...new Set(acts.map(a => a[src.fk]).filter(Boolean))];
        const userIds    = [...new Set(acts.map(a => a.user_id).filter(Boolean))];
        const [{ data: drawings, error: drawingsErr }, { data: users, error: usersErr }] = await Promise.all([
          db.from(src.draw).select('id, drawing_number, project_id').in('id', drawingIds),
          db.from('users').select('id, full_name').in('id', userIds),
        ]);
        if (drawingsErr) console.warn(`[dashboard:loadRecentActivity:${src.draw}]`, drawingsErr.message);
        if (usersErr) console.warn(`[dashboard:loadRecentActivity:users:${src.acts}]`, usersErr.message);
        const drawMap = Object.fromEntries((drawings || []).map(d => [d.id, d]));
        const userMap = Object.fromEntries((users    || []).map(u => [u.id, u]));
        return acts.map(a => ({
          ...a,
          drawings: drawMap[a[src.fk]] || null,
          users:    { full_name: userMap[a.user_id]?.full_name || 'Unknown' },
        }));
      });

      const [
        recentDrawArrays,
        { data: modelActs, error: modelActsErr },
        { data: tpActs, error: tpActsErr },
        { data: calcActs, error: calcActsErr },
        { data: matActs, error: matActsErr },
        { data: prActs, error: prActsErr },
        { data: tbeActs, error: tbeActsErr },
        { data: inqActs, error: inqActsErr },
      ] = await Promise.all([
        Promise.all(recentDrawFetches),
        db.from('model_activities')
          .select('manhours, created_at, models_3d(area, model_name, project_id), users(full_name)')
          .match(RECENT_FILTER).order('created_at', { ascending: false }).limit(10),
        db.from('test_package_drawing_activities')
          .select('manhours, created_at, user_id, test_package_drawings(drawing_number, project_id)')
          .match(RECENT_FILTER).order('created_at', { ascending: false }).limit(10),
        db.from('eng_calculation_activities')
          .select('manhours, created_at, user_id, eng_calculations(doc_number, project_id)')
          .match(RECENT_FILTER).order('created_at', { ascending: false }).limit(10),
        db.from('material_activities')
          .select('manhours, created_at, user_id, material_status(mto_number, project_code)')
          .match(RECENT_FILTER).order('created_at', { ascending: false }).limit(10),
        db.from('pr_activities')
          .select('manhours, created_at, user_id, purchase_requisitions(pr_no)')
          .match(RECENT_FILTER).order('created_at', { ascending: false }).limit(10),
        db.from('tbe_activities')
          .select('manhours, created_at, user_id, tbe_items(tbe_number)')
          .match(RECENT_FILTER).order('created_at', { ascending: false }).limit(10),
        db.from('inquiry_activities')
          .select('manhours, created_at, user_id, project_inquiries(control_number)')
          .match(RECENT_FILTER).order('created_at', { ascending: false }).limit(10),
      ]);
      if (modelActsErr) console.warn('[dashboard:loadRecentActivity:model_activities]', modelActsErr.message);
      if (tpActsErr) console.warn('[dashboard:loadRecentActivity:test_package_drawing_activities]', tpActsErr.message);
      if (calcActsErr) console.warn('[dashboard:loadRecentActivity:eng_calculation_activities]', calcActsErr.message);
      if (matActsErr) console.warn('[dashboard:loadRecentActivity:material_activities]', matActsErr.message);
      if (prActsErr) console.warn('[dashboard:loadRecentActivity:pr_activities]', prActsErr.message);
      if (tbeActsErr) console.warn('[dashboard:loadRecentActivity:tbe_activities]', tbeActsErr.message);
      if (inqActsErr) console.warn('[dashboard:loadRecentActivity:inquiry_activities]', inqActsErr.message);

      const drawActs = recentDrawArrays.flat()
        .sort((a, b) => new Date(b.created_at) - new Date(a.created_at))
        .slice(0, 10);
		
	  // Resolve users manually for the 6 sources without a recognized FK to `users`
      const rawSets = [tpActs, calcActs, matActs, prActs, tbeActs, inqActs];
      const extraUserIds = [...new Set(rawSets.flat().map(a => a?.user_id).filter(Boolean))];
      const { data: extraUsers, error: extraUsersErr } = extraUserIds.length
        ? await db.from('users').select('id, full_name').in('id', extraUserIds)
        : { data: [] };
      if (extraUsersErr) console.warn('[dashboard:loadRecentActivity:users]', extraUsersErr.message);
      const extraUserMap = Object.fromEntries((extraUsers || []).map(u => [u.id, u.full_name]));

      const all = [
        ...(drawActs || []).map(a => ({ type: 'drawing',  label: a.drawings?.drawing_number || '—',                       sub: 'Drawing',                  mh: a.manhours, date: a.created_at, user: a.users?.full_name || 'Unknown', proj: a.drawings?.project_id })),
        ...(modelActs || []).map(a => ({ type: 'model',   label: a.models_3d?.area || a.models_3d?.model_name || '—',     sub: '3D Model',                 mh: a.manhours, date: a.created_at, user: a.users?.full_name || 'Unknown', proj: a.models_3d?.project_id })),
        ...(tpActs   || []).map(a => ({ type: 'tp',       label: a.test_package_drawings?.drawing_number || '—',          sub: 'Test Package',             mh: a.manhours, date: a.created_at, user: extraUserMap[a.user_id] || 'Unknown', proj: a.test_package_drawings?.project_id })),
        ...(calcActs || []).map(a => ({ type: 'calc',     label: a.eng_calculations?.doc_number || '—',                   sub: 'Engineering Calculation',  mh: a.manhours, date: a.created_at, user: extraUserMap[a.user_id] || 'Unknown', proj: a.eng_calculations?.project_id })),
        ...(matActs  || []).map(a => ({ type: 'material', label: a.material_status?.mto_number || '—',                    sub: 'Material Preparation',     mh: a.manhours, date: a.created_at, user: extraUserMap[a.user_id] || 'Unknown', projCode: a.material_status?.project_code })),
        ...(prActs   || []).map(a => ({ type: 'material', label: a.purchase_requisitions?.pr_no || '—',                   sub: 'Material Preparation',     mh: a.manhours, date: a.created_at, user: extraUserMap[a.user_id] || 'Unknown' })),
        ...(tbeActs  || []).map(a => ({ type: 'material', label: a.tbe_items?.tbe_number || '—',                          sub: 'Material Preparation',     mh: a.manhours, date: a.created_at, user: extraUserMap[a.user_id] || 'Unknown' })),
        ...(inqActs  || []).map(a => ({ type: 'inquiry',  label: a.project_inquiries?.control_number || '—',              sub: 'Project Inquiry',          mh: a.manhours, date: a.created_at, user: extraUserMap[a.user_id] || 'Unknown' })),
      ].sort((a, b) => new Date(b.date) - new Date(a.date)).slice(0, 17);

      if (!all.length) { el.innerHTML = '<div class="empty-state"><p>No recent activity.</p></div>'; return; }

      const typeColor = { drawing: 'var(--accent)', model: '#38bdf8', tp: '#f472b6', calc: '#facc15', material: '#4ade80', inquiry: '#a78bfa' };
      const typeIcon = {
        model:    `<svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><path stroke="none" d="M0 0h24v24H0z" fill="none" /><path d="M14 3l6 4v7" /><path d="M18 17l-6 4l-6 -4" /><path d="M4 14v-7l6 -4" /><path d="M4 7l8 5v9" /><path d="M20 7l-8 5" /></svg>`,
        drawing:  `<svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/><line x1="8" y1="13" x2="16" y2="13"/><line x1="8" y1="17" x2="16" y2="17"/></svg>`,
        tp:       `<svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><path stroke="none" d="M0 0h24v24H0z" fill="none" /><path d="M15 3v4a1 1 0 0 0 1 1h4" /><path d="M18 17h-7a2 2 0 0 1 -2 -2v-10a2 2 0 0 1 2 -2h4l5 5v7a2 2 0 0 1 -2 2" /><path d="M16 17v2a2 2 0 0 1 -2 2h-7a2 2 0 0 1 -2 -2v-10a2 2 0 0 1 2 -2h2" /></svg>`,
        calc:     `<svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><path stroke="none" d="M0 0h24v24H0z" fill="none" /><path d="M4 7h6" /><path d="M7 4v6" /><path d="M20 16h-6" /><path d="M20 19h-6" /><path d="M5 19l14 -14" /></svg>`,
        material: `<svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><path stroke="none" d="M0 0h24v24H0z" fill="none" /><path d="M12 3l8 4.5l0 9l-8 4.5l-8 -4.5l0 -9l8 -4.5" /><path d="M12 12l8 -4.5" /><path d="M12 12l0 9" /><path d="M12 12l-8 -4.5" /></svg>`,
        inquiry:  `<svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><path stroke="none" d="M0 0h24v24H0z" fill="none" /><path d="M4 8h16" /><path d="M12 20h-6a2 2 0 0 1 -2 -2v-12a2 2 0 0 1 2 -2h12a2 2 0 0 1 2 2v6" /><path d="M8 4v4" /><path d="M16 19h6" /><path d="M19 16v6" /></svg>`,
      };

      el.innerHTML = all.map(a => {
        const projCode = a.projCode || projectsData.find(p => p.id === a.proj)?.code || '';
        return `
        <div style="display:flex;align-items:center;gap:10px;padding:8px 0;border-bottom:1px solid var(--border);">
          <div style="width:32px;height:32px;background:var(--accent-dim);border-radius:7px;display:flex;align-items:center;justify-content:center;flex-shrink:0;color:${typeColor[a.type]};">
            ${typeIcon[a.type]}
          </div>
          <div style="flex:1;min-width:0;">
            <div style="font-size:13px;font-weight:600;color:var(--text);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;">${esc(a.label)} ${projCode ? `<span style="font-size:10px;font-weight:600;color:var(--text-4);border:1px solid var(--border);border-radius:4px;padding:1px 5px;margin-left:4px;">${esc(projCode)}</span>` : ''}</div>
            <div style="font-size:11px;color:var(--text-3);">${esc(a.sub)} · ${formatHours(a.manhours)} hrs · ${esc(a.user)}</div>
          </div>
          <div style="font-size:11px;color:var(--text-4);white-space:nowrap;">${formatDateTime(a.date)}</div>
        </div>
      `;
      }).join('');
    }

    initLayout('Dashboard');
  </script>
</body>
</html>
