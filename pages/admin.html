<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Admin — EngPro App</title>
  <link rel="stylesheet" href="../css/main.css" />
</head>
<body>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="../js/supabase.js"></script>
  <script src="../js/utils.js"></script>
  <script src="../js/layout.js"></script>
  <script src="../js/messaging.js"></script>

  <script>
    const SVG_SM = (p) => `<svg xmlns="http://www.w3.org/2000/svg" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">${p}</svg>`;
    const IC = {
      edit:    SVG_SM('<path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"/><path d="M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z"/>'),
      trash:   SVG_SM('<polyline points="3 6 5 6 21 6"/><path d="M19 6l-1 14a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2L5 6"/><path d="M10 11v6"/><path d="M14 11v6"/><path d="M9 6V4a1 1 0 0 1 1-1h4a1 1 0 0 1 1 1v2"/>'),
      plus:    SVG_SM('<line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/>'),
      save:    SVG_SM('<path d="M19 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11l5 5v11a2 2 0 0 1-2 2z"/><polyline points="17 21 17 13 7 13 7 21"/><polyline points="7 3 7 8 15 8"/>'),
      project: SVG_SM('<rect x="2" y="7" width="20" height="14" rx="2"/><path d="M16 7V5a2 2 0 0 0-2-2h-4a2 2 0 0 0-2 2v2"/>'),
    };

    const BADGE_COLORS = [
      { value: '#C62828', label: 'Deep Red'    },
      { value: '#6A1B9A', label: 'Royal Purple' },
      { value: '#EF6C00', label: 'Amber'        },
      { value: '#1976D2', label: 'Blue'         },
      { value: '#00897B', label: 'Teal'         },
      { value: '#00ACC1', label: 'Cyan Blue'    },
      { value: '#2E7D32', label: 'Dark Green'   },
      { value: '#546E7A', label: 'Steel Gray'   },
      { value: '#8D6E63', label: 'Brown'        },
      { value: '#7CB342', label: 'Olive Green'  },
      { value: '#3949AB', label: 'Indigo'       },
    ];

    const PROJECT_STATUSES = ['Active', 'On Hold', 'Completed'];

    let disciplinesData 	= [];
    let stepsData       	= [];
    let rolesData       	= [];
    let projectsData    	= [];
    let docCodesData        = [];
	let otherActivitiesData = [];

    function injectModals() {
      document.body.insertAdjacentHTML('beforeend', `

        <!-- Discipline Modal -->
        <div class="modal" id="disc-modal">
          <div class="modal-backdrop" onclick="closeModal('disc-modal')"></div>
          <div class="modal-box modal-sm">
            <div class="modal-header">
              <h3 id="disc-modal-title" style="display:flex;align-items:center;gap:8px;">
                <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M2 3h6a4 4 0 0 1 4 4v14a3 3 0 0 0-3-3H2z"/><path d="M22 3h-6a4 4 0 0 0-4 4v14a3 3 0 0 1 3-3h7z"/></svg>
                Add Discipline
              </h3>
              <button class="modal-close" onclick="closeModal('disc-modal')">✕</button>
            </div>
            <div class="modal-body">
              <input type="hidden" id="d-id" />
              <div class="form-group">
                <label class="required">Discipline Name</label>
                <input type="text" id="d-name" placeholder="e.g. Mechanical" />
              </div>
              <div class="form-group">
                <label>Code</label>
                <input type="text" id="d-code" placeholder="e.g. MECH" maxlength="10" />
              </div>
            </div>
            <div class="modal-footer">
              <button class="btn btn-ghost" onclick="closeModal('disc-modal')">Cancel</button>
              <button class="btn btn-primary" id="disc-save-btn" onclick="saveDiscipline()" style="display:flex;align-items:center;gap:5px;">
                ${IC.save} Save
              </button>
            </div>
          </div>
        </div>

        <!-- Workflow Step Modal -->
        <div class="modal" id="step-modal">
          <div class="modal-backdrop" onclick="closeModal('step-modal')"></div>
          <div class="modal-box modal-sm">
            <div class="modal-header">
              <h3 id="step-modal-title" style="display:flex;align-items:center;gap:8px;">
                <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="22 12 18 12 15 21 9 3 6 12 2 12"/></svg>
                Add Workflow Step
              </h3>
              <button class="modal-close" onclick="closeModal('step-modal')">✕</button>
            </div>
            <div class="modal-body">
              <input type="hidden" id="s-id" />
              <div class="form-group">
                <label class="required">Step Name</label>
                <input type="text" id="s-name" placeholder="e.g. Issued for Review" />
              </div>
              <div class="form-row">
                <div class="form-group">
                  <label>Sort Order</label>
                  <input type="number" id="s-order" min="1" step="1" placeholder="1" />
                </div>
                <div class="form-group">
                  <label>Revision Code</label>
                  <input type="text" id="s-revision" placeholder="e.g. A, B, 0, 1" maxlength="10" />
                </div>
              </div>
			  <div class="form-group">
                <label>Activity Type</label>
                <select id="s-activity-type" onchange="toggleMiscActivityField()">
                  <option value="model">3D Model</option>
                  <option value="drawing" selected>Drawings</option>
                  <option value="test_package">Test Package</option>
				  <option value="materials">Materials</option>
				  <option value="calculations">Calculations</option>
                  <option value="miscellaneous">Miscellaneous</option>
                </select>
              </div>
              <div class="form-group" id="s-misc-activity-group" style="display:none;">
                <label class="required">Miscellaneous Activity</label>
                <select id="s-misc-activity-id">
                  <option value="">— Select Activity —</option>
                </select>
              </div>
              <div style="background:var(--bg-4);border:1px solid var(--border);border-radius:var(--radius);padding:10px 12px;font-size:12px;color:var(--text-3);display:flex;gap:8px;align-items:flex-start;margin-top:4px;">
                <svg xmlns="http://www.w3.org/2000/svg" width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="var(--accent)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="flex-shrink:0;margin-top:1px;"><circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="12"/><line x1="12" y1="16" x2="12.01" y2="16"/></svg>
                <span>Revision code will be applied to drawings when this step is completed.</span>
              </div>
            </div>
            <div class="modal-footer">
              <button class="btn btn-ghost" onclick="closeModal('step-modal')">Cancel</button>
              <button class="btn btn-primary" id="step-save-btn" onclick="saveStep()" style="display:flex;align-items:center;gap:5px;">
                ${IC.save} Save
              </button>
            </div>
          </div>
        </div>

        <!-- Role Modal -->
        <div class="modal" id="role-modal">
          <div class="modal-backdrop" onclick="closeModal('role-modal')"></div>
          <div class="modal-box modal-sm">
            <div class="modal-header">
              <h3 id="role-modal-title" style="display:flex;align-items:center;gap:8px;">
                <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M23 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/></svg>
                Add Role
              </h3>
              <button class="modal-close" onclick="closeModal('role-modal')">✕</button>
            </div>
            <div class="modal-body">
              <input type="hidden" id="r-id" />
              <div class="form-group">
                <label class="required">Role Name</label>
                <input type="text" id="r-name" placeholder="e.g. Lead Engineer" />
              </div>
              <div class="form-group">
                <label class="required">Role Key</label>
                <input type="text" id="r-key" placeholder="e.g. lead_engineer" maxlength="50" />
                <div style="font-size:11px;color:var(--text-4);margin-top:4px;">Lowercase, underscores only. Stored in the database and used in access control.</div>
              </div>
              <div class="form-group">
                <label>Badge Color</label>
                <select id="r-color">
                  ${BADGE_COLORS.map(c => `<option value="${c.value}">${c.label}</option>`).join('')}
                </select>
              </div>
              <div style="margin-top:8px;">
                <label style="font-size:12px;color:var(--text-3);display:block;margin-bottom:6px;">Preview</label>
                <span id="r-preview" class="badge" style="font-size:12px;">Role Name</span>
              </div>
            </div>
            <div class="modal-footer">
              <button class="btn btn-ghost" onclick="closeModal('role-modal')">Cancel</button>
              <button class="btn btn-primary" id="role-save-btn" onclick="saveRole()" style="display:flex;align-items:center;gap:5px;">
                ${IC.save} Save
              </button>
            </div>
          </div>
        </div>

        <!-- Project Modal -->
        <div class="modal" id="proj-modal">
          <div class="modal-backdrop" onclick="closeModal('proj-modal')"></div>
          <div class="modal-box modal-sm" style="max-width:420px";>
            <div class="modal-header">
              <h3 id="proj-modal-title" style="display:flex;align-items:center;gap:8px;">
                <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="7" width="20" height="14" rx="2"/><path d="M16 7V5a2 2 0 0 0-2-2h-4a2 2 0 0 0-2 2v2"/></svg>
                Add Project
              </h3>
              <button class="modal-close" onclick="closeModal('proj-modal')">✕</button>
            </div>
            <div class="modal-body">
              <input type="hidden" id="p-id" />
              <div class="form-group">
                <label class="required">Project Name</label>
                <input type="text" id="p-name" placeholder="e.g. Offshore Platform Phase 2" />
              </div>
              <div class="form-group">
                <label>Customer</label>
                <input type="text" id="p-customer" placeholder="e.g. Acme Energy Corp" />
              </div>
              <div class="form-row">
                <div class="form-group">
                  <label class="required">Project Code</label>
                  <input type="text" id="p-code" placeholder="e.g. OFP-2" maxlength="20" />
                  <div style="font-size:11px;color:var(--text-4);margin-top:4px;">Used to tag drawings and filter data.</div>
                </div>
                <div class="form-group">
                  <label>Status</label>
                  <select id="p-status">
                    ${PROJECT_STATUSES.map(s => `<option value="${s}">${s}</option>`).join('')}
                  </select>
                </div>
              </div>
              <div class="form-row">
                <div class="form-group">
                  <label>Start Date</label>
                  <input type="date" id="p-start" />
                </div>
                <div class="form-group">
                  <label>End Date</label>
                  <input type="date" id="p-end" />
                </div>
              </div>
              <div class="form-row">
                <div class="form-group">
                  <label>Week Start Day</label>
                  <select id="p-week-start">
                    <option value="0">Sunday</option>
                    <option value="1" selected>Monday</option>
                    <option value="2">Tuesday</option>
                    <option value="3">Wednesday</option>
                    <option value="4">Thursday</option>
                    <option value="5">Friday</option>
                    <option value="6">Saturday</option>
                  </select>
                </div>
              </div>
                <div class="form-group" style="flex:2;">
                  <label>Description</label>
                  <textarea id="p-desc" placeholder="Optional project description…" rows="2" style="resize:vertical;"></textarea>
                </div>			  
            </div>
            <div class="modal-footer">
              <button class="btn btn-ghost" onclick="closeModal('proj-modal')">Cancel</button>
              <button class="btn btn-primary" id="proj-save-btn" onclick="saveProject()" style="display:flex;align-items:center;gap:5px;">
                ${IC.save} Save
              </button>
            </div>
          </div>
        </div>

      <!-- Deliverable Modal -->
        <div class="modal" id="doc-modal">
          <div class="modal-backdrop" onclick="closeModal('doc-modal')"></div>
          <div class="modal-box modal-sm">
            <div class="modal-header">
              <h3 id="doc-modal-title" style="display:flex;align-items:center;gap:8px;">
                <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/><line x1="16" y1="13" x2="8" y2="13"/><line x1="16" y1="17" x2="8" y2="17"/></svg>
                Add Deliverable
              </h3>
              <button class="modal-close" onclick="closeModal('doc-modal')">✕</button>
            </div>
            <div class="modal-body">
              <input type="hidden" id="dc-id" />
              <div class="form-group">
                <label class="required">Document Type</label>
                <input type="text" id="dc-type" placeholder="Erection Drawing" />
              </div>
              <div class="form-group">
                <label class="required">Document Code</label>
                <input type="text" id="dc-code" placeholder="ERD" maxlength="20" />
                <div style="font-size:11px;color:var(--text-4);margin-top:4px;">Used to identify document type.</div>
              </div>
			  <div class="form-group">
                <label>Activity Type</label>
                <select id="dc-activity-type" onchange="toggleSourceTableField()">
                  <option value="model">3D Model</option>
                  <option value="drawing" selected>Drawings</option>
                  <option value="test_package">Test Package</option>
                  <option value="materials">Materials</option>
                  <option value="calculations">Calculations</option>
                </select>
              </div>
              <div class="form-group" id="dc-source-table-group">
                <label>Source Table</label>
                <select id="dc-source-table">
                  <option value="">— Select —</option>
                  <option value="erection_drawings">Erection Drawing</option>
                  <option value="fabrication_drawings">Fabrication Drawing</option>
                  <option value="support_drawings">Support Drawing</option>
                  <option value="weld_map_drawings">Weld Map Drawing</option>
                </select>
                <div style="font-size:11px;color:var(--text-4);margin-top:4px;">Which real drawing table this deliverable represents.</div>
              </div>
            </div>
            <div class="modal-footer">
              <button class="btn btn-ghost" onclick="closeModal('doc-modal')">Cancel</button>
              <button class="btn btn-primary" id="doc-save-btn" onclick="saveDocCode()" style="display:flex;align-items:center;gap:5px;">
                ${IC.save} Save
              </button>
            </div>
          </div>
        </div>
		
		<!-- Other Activity Modal -->
        <div class="modal" id="oa-modal">
          <div class="modal-backdrop" onclick="closeModal('oa-modal')"></div>
          <div class="modal-box modal-sm">
            <div class="modal-header">
              <h3 id="oa-modal-title" style="display:flex;align-items:center;gap:8px;">
                <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="22 12 18 12 15 21 9 3 6 12 2 12"/></svg>
                Add Other Activity
              </h3>
              <button class="modal-close" onclick="closeModal('oa-modal')">✕</button>
            </div>
            <div class="modal-body">
              <input type="hidden" id="oa-id" />
              <div class="form-group">
                <label class="required">Activity Code</label>
                <input type="text" id="oa-code" placeholder="e.g. SITE-VISIT" maxlength="30" />
              </div>
              <div class="form-group">
                <label class="required">Activity Description</label>
                <input type="text" id="oa-desc" placeholder="e.g. Site Visit / Inspection" />
              </div>
              <div class="form-group">
                <label>Remarks</label>
                <input type="text" id="oa-remarks" placeholder="Optional notes…" />
              </div>
            </div>
            <div class="modal-footer">
              <button class="btn btn-ghost" onclick="closeModal('oa-modal')">Cancel</button>
              <button class="btn btn-primary" id="oa-save-btn" onclick="saveOtherActivity()" style="display:flex;align-items:center;gap:5px;">
                ${IC.save} Save
              </button>
            </div>
          </div>
        </div>

	<!-- Miscellaneous Activity Modal -->
    <div class="modal" id="ma-modal">
	  <div class="modal-backdrop" onclick="closeModal('ma-modal')"></div>
	  <div class="modal-box modal-sm">
        <div class="modal-header">
          <h3 id="ma-modal-title">${IC.plus} Add Miscellaneous Activity</h3>
          <button class="modal-close" onclick="closeModal('ma-modal')">&times;</button>
        </div>
        <div class="modal-body" style="display:flex;flex-direction:column;gap:14px;">
          <input type="hidden" id="ma-id" />
          <div class="form-group">
            <label class="required">Category</label>
            <input type="text" id="ma-category" placeholder="e.g. Site Work, Office Admin…" />
          </div>
          <div class="form-group">
            <label class="required">Activity Name</label>
            <input type="text" id="ma-name" placeholder="e.g. Site Survey, Report Writing…" />
          </div>
          <div class="form-group">
            <label>Remarks</label>
            <input type="text" id="ma-remarks" placeholder="Optional notes…" />
          </div>
        </div>
        <div class="modal-footer">
          <button class="btn btn-ghost" onclick="closeModal('ma-modal')">Cancel</button>
          <button class="btn btn-primary" id="ma-save-btn" onclick="saveMiscActivity()" style="display:flex;align-items:center;gap:5px;">
            ${IC.save} Save
          </button>
        </div>
      </div>
    </div>

      `);

      document.getElementById('r-color').addEventListener('change', updateRolePreview);
      document.getElementById('r-name').addEventListener('input', updateRolePreview);
    }

    function updateRolePreview() {
      const preview = document.getElementById('r-preview');
      const name    = document.getElementById('r-name').value.trim() || 'Role Name';
      const color   = document.getElementById('r-color').value || '#546E7A';
      preview.className = 'badge';
      preview.style.backgroundColor = color + '22';
      preview.style.color           = color;
      preview.style.borderColor     = color + '55';
      preview.textContent = name;
    }

		  <button class="tab-btn" onclick="switchTab('otheractivities', this)">

    async function switchTab(tab, btn) {
      document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
      document.querySelectorAll('.tab-panel').forEach(p => p.classList.remove('active'));
      btn.classList.add('active');
      document.getElementById(`tab-${tab}`).classList.add('active');
      if (tab === 'projects')    await loadProjects();
      if (tab === 'disciplines') await loadDisciplines();
      if (tab === 'workflow')    await loadWorkflowSteps();
      if (tab === 'roles')       await loadRoles();
      if (tab === 'doccodes')    await loadDocCodes();
	  if (tab === 'otheractivities') await loadOtherActivities();
      if (tab === 'miscactivities')  await loadMiscActivities();
    }
	
	function sourceTableLabel(sourceTable) {
      const labels = {
        erection_drawings:    'Erection Drawing',
        fabrication_drawings: 'Fabrication Drawing',
        support_drawings:     'Support Drawing',
        weld_map_drawings:    'Weld Map Drawing'
      };
      return labels[sourceTable] || null;
    }

    // ── DELIVERABLES ──────────────────────────────────────────

    async function loadDocCodes() {
      const tbody = document.getElementById('doc-tbody');
      tbody.innerHTML = `<tr><td colspan="8" style="text-align:center;padding:30px;color:var(--text-4);">Loading…</td></tr>`;
      const { data, error } = await db.from('document_codes').select('*').order('code');
      if (error) { tbody.innerHTML = `<tr><td colspan="8" style="text-align:center;padding:30px;color:var(--red);">Error loading deliverable.</td></tr>`; return; }
      docCodesData = data || [];
      if (!docCodesData.length) {
        tbody.innerHTML = `<tr><td colspan="8" style="text-align:center;padding:40px;color:var(--text-4);">No document codes yet. Click "+ Add Deliverable" to get started.</td></tr>`;
        return;
      }
      tbody.innerHTML = docCodesData.map((d, i) => `
        <tr>
          <td style="font-weight:600;color:var(--text);">${d.type}</td>
          <td style="text-align:center;">
            <span class="badge badge-gray" style="font-family:monospace;letter-spacing:.5px;">${d.code}</span>
          </td>
          <td style="text-align:center;">
            <span class="badge ${d.activity_type === 'model' ? 'badge-blue' : d.activity_type === 'test_package' ? 'badge-orange' : (d.activity_type === 'materials' || d.activity_type === 'calculations') ? '' : 'badge-green'}" ${
              d.activity_type === 'materials' ? 'style="background:rgba(168,85,247,0.15);color:#a855f7;"' :
              d.activity_type === 'calculations' ? 'style="background:rgba(236,72,153,0.15);color:#ec4899;"' : ''
            }>${
              d.activity_type === 'model' ? '3D Model' : d.activity_type === 'test_package' ? 'Test Package' : d.activity_type === 'materials' ? 'Materials' : d.activity_type === 'calculations' ? 'Calculations' : 'Drawing'
            }</span>
          </td>
          <td style="text-align:center;">
            ${sourceTableLabel(d.source_table)
              ? `<span class="badge badge-gray" style="font-size:11px;">${sourceTableLabel(d.source_table)}</span>`
              : `<span style="font-size:12px;color:var(--text-4);">—</span>`}
          </td>
          <td style="text-align:center;">
            <div class="table-actions">
              <button class="btn btn-icon edit"   onclick="openEditDocCode(${i})" title="Edit">${IC.edit}</button>
              <button class="btn btn-icon delete" onclick="deleteDocCode('${d.id}')" title="Delete">${IC.trash}</button>
            </div>
          </td>
        </tr>
      `).join('');
    }
	
	function toggleSourceTableField() {
      const isDrawing = document.getElementById('dc-activity-type').value === 'drawing';
      document.getElementById('dc-source-table-group').style.display = isDrawing ? '' : 'none';
    }

    function openAddDocCode() {
      document.getElementById('dc-id').value            = '';
      document.getElementById('dc-type').value          = '';
      document.getElementById('dc-code').value          = '';
      document.getElementById('dc-activity-type').value = 'drawing';
      document.getElementById('dc-source-table').value  = '';
      toggleSourceTableField();
      document.getElementById('doc-modal-title').lastChild.textContent = ' Add Deliverable';
      openModal('doc-modal');
      setTimeout(() => document.getElementById('dc-type').focus(), 100);
    }

    function openEditDocCode(index) {
      const d = docCodesData[index];
      if (!d) return;
      document.getElementById('dc-id').value            = d.id;
      document.getElementById('dc-type').value          = d.type          || '';
      document.getElementById('dc-code').value          = d.code          || '';
      document.getElementById('dc-activity-type').value = d.activity_type || 'drawing';
      document.getElementById('dc-source-table').value  = d.source_table  || '';
      toggleSourceTableField();
      document.getElementById('doc-modal-title').lastChild.textContent = ' Edit Deliverable';
      openModal('doc-modal');
      setTimeout(() => document.getElementById('dc-type').focus(), 100);
    }

    async function saveDocCode() {
      const btn  = document.getElementById('doc-save-btn');
      const id   = document.getElementById('dc-id').value;
      const type          = document.getElementById('dc-type').value.trim();
      const code          = document.getElementById('dc-code').value.trim().toUpperCase();
      const activity_type = document.getElementById('dc-activity-type').value || 'drawing';
      const source_table  = activity_type === 'drawing' ? (document.getElementById('dc-source-table').value || null) : null;
      if (!type) { toast('Document type is required.', 'error'); document.getElementById('dc-type').focus(); return; }
      if (!code) { toast('Deliverable code is required.', 'error'); document.getElementById('dc-code').focus(); return; }
      btn.disabled = true; btn.textContent = 'Saving…';
      const { error } = id
        ? await db.from('document_codes').update({ type, code, activity_type, source_table }).eq('id', id)
        : await db.from('document_codes').insert({ type, code, activity_type, source_table });
      btn.disabled = false; btn.innerHTML = `${IC.save} Save`;
      if (error) { toast('Error: ' + error.message, 'error'); return; }
      toast(id ? 'Deliverable updated.' : 'Deliverable added.', 'success');
      closeModal('doc-modal');
      await loadDocCodes();
    }

    async function deleteDocCode(id) {
      confirmDialog('Delete this deliverable?', async () => {
        const { error } = await db.from('document_codes').delete().eq('id', id);
        if (error) { toast('Error: ' + error.message, 'error'); return; }
        toast('Deleted.', 'success');
        await loadDocCodes();
      });
    }

          <td style="text-align:center;">
            <span class="badge badge-gray" style="font-family:monospace;letter-spacing:.5px;">${a.code}</span>
          </td>
          <td style="font-weight:600;color:var(--text);">${a.description}</td>
          <td style="font-size:12px;color:var(--text-3);">${a.remarks || '—'}</td>
          <td style="text-align:center;">
            <div class="table-actions">
              <button class="btn btn-icon edit"   onclick="openEditOtherActivity(${i})" title="Edit">${IC.edit}</button>

            </div>
          </td>
        </tr>
      `).join('');
    }

    function openAddOtherActivity() {

      document.getElementById('oa-code').value    = '';
      document.getElementById('oa-desc').value    = '';
      document.getElementById('oa-remarks').value = '';

      setTimeout(() => document.getElementById('oa-code').focus(), 100);
    }

    function openEditOtherActivity(index) {
      const a = otherActivitiesData[index];
      if (!a) return;
      document.getElementById('oa-id').value      = a.id;
      document.getElementById('oa-code').value    = a.code        || '';
      document.getElementById('oa-desc').value    = a.description || '';
      document.getElementById('oa-remarks').value = a.remarks     || '';
      document.getElementById('oa-modal-title').lastChild.textContent = ' Edit Other Activity';

    async function saveOtherActivity() {

      const id          = document.getElementById('oa-id').value;
      const code        = document.getElementById('oa-code').value.trim().toUpperCase();

    async function deleteOtherActivity(id) {
      confirmDialog('Delete this activity?', async () => {

        if (error) { toast('Error: ' + error.message, 'error'); return; }
        toast('Deleted.', 'success');

      });

    // ── PROJECTS ──────────────────────────────────────────────

    const STATUS_BADGE = {
      'Active':    { bg: '#2E7D3222', color: '#2E7D32', border: '#2E7D3255' },
      'On Hold':   { bg: '#EF6C0022', color: '#EF6C00', border: '#EF6C0055' },
      'Completed': { bg: '#1976D222', color: '#1976D2', border: '#1976D255' },
    };

    function statusBadge(status) {
      const s = STATUS_BADGE[status] || { bg: '#54607a22', color: '#546E7A', border: '#546E7A55' };
      return `<span class="badge" style="background:${s.bg};color:${s.color};border-color:${s.border};">${status || '—'}</span>`;
    }

    async function loadProjects() {
      const tbody = document.getElementById('proj-tbody');
      tbody.innerHTML = `<tr><td colspan="6" style="text-align:center;padding:30px;color:var(--text-4);">Loading…</td></tr>`;
      const { data, error } = await db.from('projects').select('*').order('name');
      if (error) { tbody.innerHTML = `<tr><td colspan="6" style="text-align:center;padding:30px;color:var(--red);">Error loading projects.</td></tr>`; return; }
      projectsData = data || [];
      renderProjects(projectsData);
    }

    function renderProjects(list) {
      const tbody = document.getElementById('proj-tbody');
      if (!list.length) {
        tbody.innerHTML = `<tr><td colspan="6" style="text-align:center;padding:40px;color:var(--text-4);">No projects yet. Click "+ Add Project" to get started.</td></tr>`;
        return;
      }
      tbody.innerHTML = list.map((p, i) => `
        <tr>
          <td>
            <div style="font-weight:600;color:var(--text);">${p.name}</div>
            ${p.description ? `<div style="font-size:11px;color:var(--text-4);margin-top:2px;">${p.description}</div>` : ''}
          </td>
          <td style="font-size:12px;color:var(--text-3);">${p.customer || '—'}</td>
          <td style="text-align:center;">
            <span class="badge badge-gray" style="font-family:monospace;letter-spacing:.5px;">${p.code}</span>
          </td>
          <td style="text-align:center;">${statusBadge(p.status)}</td>
          <td style="text-align:center;font-size:12px;color:var(--text-3);">${p.start_date ? formatDate(p.start_date) : '—'}</td>
          <td style="text-align:center;font-size:12px;color:var(--text-3);">${p.end_date   ? formatDate(p.end_date)   : '—'}</td>
		  <td style="text-align:center;font-size:12px;color:var(--text-3);">${['Sun','Mon','Tue','Wed','Thu','Fri','Sat'][p.week_start_day ?? 1]}</td>
          <td style="text-align:center;">
            <div class="table-actions">
              <button class="btn btn-icon edit"   onclick="openEditProject(${i})" title="Edit">${IC.edit}</button>
              <button class="btn btn-icon delete" onclick="deleteProject('${p.id}')" title="Delete">${IC.trash}</button>
            </div>
          </td>
        </tr>
      `).join('');
    }

    function filterProjects(search) {
      const statusFilter = document.getElementById('proj-status-filter').value;
      const q = search.toLowerCase();
      renderProjects(projectsData.filter(p => {
        const matchSearch = !q || p.name?.toLowerCase().includes(q) || p.code?.toLowerCase().includes(q);
        const matchStatus = !statusFilter || p.status === statusFilter;
        return matchSearch && matchStatus;
      }));
    }

    function openAddProject() {
      document.getElementById('p-id').value     = '';
      document.getElementById('p-name').value     = '';
      document.getElementById('p-customer').value = '';
      document.getElementById('p-code').value     = '';
      document.getElementById('p-status').value = 'Active';
      document.getElementById('p-start').value  = '';
      document.getElementById('p-end').value    = '';
      document.getElementById('p-desc').value   = '';
      document.getElementById('proj-modal-title').lastChild.textContent = ' Add Project';
      openModal('proj-modal');
      setTimeout(() => document.getElementById('p-name').focus(), 100);
    }

    function openEditProject(index) {
      const p = projectsData[index];
      if (!p) return;
      document.getElementById('p-id').value     = p.id;
      document.getElementById('p-name').value     = p.name        || '';
      document.getElementById('p-customer').value = p.customer    || '';
      document.getElementById('p-code').value     = p.code        || '';
      document.getElementById('p-status').value = p.status      || 'Active';
      document.getElementById('p-start').value  = p.start_date  || '';
      document.getElementById('p-end').value    = p.end_date    || '';
      document.getElementById('p-desc').value        = p.description   || '';
      document.getElementById('p-week-start').value  = p.week_start_day ?? 1;
      document.getElementById('proj-modal-title').lastChild.textContent = ' Edit Project';
      openModal('proj-modal');
      setTimeout(() => document.getElementById('p-name').focus(), 100);
    }

    async function saveProject() {
      const btn   = document.getElementById('proj-save-btn');
      const id    = document.getElementById('p-id').value;
      const name     = document.getElementById('p-name').value.trim();
      const customer = document.getElementById('p-customer').value.trim() || null;
      const code     = document.getElementById('p-code').value.trim().toUpperCase();
      const status      = document.getElementById('p-status').value;
      const start_date  = document.getElementById('p-start').value  || null;
      const end_date    = document.getElementById('p-end').value    || null;
      const description    = document.getElementById('p-desc').value.trim() || null;
      const week_start_day = parseInt(document.getElementById('p-week-start').value) || 1;

      if (!name) { toast('Project name is required.', 'error'); document.getElementById('p-name').focus(); return; }
      if (!code) { toast('Project code is required.', 'error'); document.getElementById('p-code').focus(); return; }

      btn.disabled = true; btn.textContent = 'Saving…';
      const { error } = id
        ? await db.from('projects').update({ name, customer, code, status, start_date, end_date, description, week_start_day }).eq('id', id)
        : await db.from('projects').insert({ name, customer, code, status, start_date, end_date, description, week_start_day });
      btn.disabled = false; btn.innerHTML = `${IC.save} Save`;

      if (error) { toast('Error: ' + error.message, 'error'); return; }
      toast(id ? 'Project updated.' : 'Project added.', 'success');
      closeModal('proj-modal');
      await loadProjects();
    }

    async function deleteProject(id) {
      confirmDialog('Delete this project? This will not delete associated drawings or activities.', async () => {
        const { error } = await db.from('projects').delete().eq('id', id);
        if (error) { toast('Error: ' + error.message, 'error'); return; }
        toast('Project deleted.', 'success');
        await loadProjects();
      });
    }

    // ── DISCIPLINES ───────────────────────────────────────────

    async function loadDisciplines() {
      const tbody = document.getElementById('disc-tbody');
      tbody.innerHTML = `<tr><td colspan="3" style="text-align:center;padding:30px;color:var(--text-4);">Loading…</td></tr>`;
      const { data, error } = await db.from('disciplines').select('*').order('name');
      if (error) { tbody.innerHTML = `<tr><td colspan="3" style="text-align:center;padding:30px;color:var(--red);">Error loading disciplines.</td></tr>`; return; }
      disciplinesData = data || [];
      if (!disciplinesData.length) {
        tbody.innerHTML = `<tr><td colspan="3" style="text-align:center;padding:40px;color:var(--text-4);">No disciplines yet. Click "+ Add Discipline" to get started.</td></tr>`;
        return;
      }
      tbody.innerHTML = disciplinesData.map((d, i) => `
        <tr>
          <td style="font-weight:600;color:var(--text);">${d.name}</td>
          <td style="text-align:center;">
            ${d.code ? `<span class="badge badge-gray" style="font-family:monospace;letter-spacing:.5px;">${d.code}</span>` : '<span style="color:var(--text-4);">—</span>'}
          </td>
          <td style="text-align:center;">
            <div class="table-actions">
              <button class="btn btn-icon edit"   onclick="openEditDisc(${i})" title="Edit">${IC.edit}</button>
              <button class="btn btn-icon delete" onclick="deleteDiscipline('${d.id}')" title="Delete">${IC.trash}</button>
            </div>
          </td>
        </tr>
      `).join('');
    }

    function openAddDisc() {
      document.getElementById('d-id').value   = '';
      document.getElementById('d-name').value = '';
      document.getElementById('d-code').value = '';
      document.getElementById('disc-modal-title').lastChild.textContent = ' Add Discipline';
      openModal('disc-modal');
      setTimeout(() => document.getElementById('d-name').focus(), 100);
    }

    function openEditDisc(index) {
      const d = disciplinesData[index];
      if (!d) return;
      document.getElementById('d-id').value   = d.id;
      document.getElementById('d-name').value = d.name || '';
      document.getElementById('d-code').value = d.code || '';
      document.getElementById('disc-modal-title').lastChild.textContent = ' Edit Discipline';
      openModal('disc-modal');
      setTimeout(() => document.getElementById('d-name').focus(), 100);
    }

    async function saveDiscipline() {
      const btn  = document.getElementById('disc-save-btn');
      const id   = document.getElementById('d-id').value;
      const name = document.getElementById('d-name').value.trim();
      const code = document.getElementById('d-code').value.trim().toUpperCase();
      if (!name) { toast('Discipline name is required.', 'error'); document.getElementById('d-name').focus(); return; }
      btn.disabled = true; btn.textContent = 'Saving…';
      const { error } = id
        ? await db.from('disciplines').update({ name, code: code || null }).eq('id', id)
        : await db.from('disciplines').insert({ name, code: code || null });
      btn.disabled = false; btn.innerHTML = `${IC.save} Save`;
      if (error) { toast('Error: ' + error.message, 'error'); return; }
      toast(id ? 'Discipline updated.' : 'Discipline added.', 'success');
      closeModal('disc-modal');
      await loadDisciplines();
    }

    async function deleteDiscipline(id) {
      confirmDialog('Delete this discipline? This may affect drawings and users assigned to it.', async () => {
        const { error } = await db.from('disciplines').delete().eq('id', id);
        if (error) { toast('Error: ' + error.message, 'error'); return; }
        toast('Discipline deleted.', 'success');
        await loadDisciplines();
      });
    }

    // ── WORKFLOW STEPS ────────────────────────────────────────

let currentWfTab = 'model';

    function switchWfTab(type, btn) {
      currentWfTab = type;
      ['model', 'drawing', 'test_package', 'materials', 'calculations', 'miscellaneous'].forEach(t => {
        document.getElementById(`wf-panel-${t}`).style.display = t === type ? '' : 'none';
      });
      document.querySelectorAll('.wf-sub-btn').forEach(b => {
        const active = b === btn;
        b.style.borderBottomColor = active ? 'var(--accent)' : 'transparent';
        b.style.color = active ? 'var(--text)' : 'var(--text-3)';
      });
      // Update the third column header to match the tab
      const thirdHeader = document.querySelector(`#wf-panel-${type} thead tr th:nth-child(3)`);
      if (thirdHeader) {
        thirdHeader.textContent = type === 'miscellaneous' ? 'Linked Activity' : 'Revision Code';
      }
    }

    async function loadWorkflowSteps() {
      ['model', 'drawing', 'test_package', 'materials', 'calculations', 'miscellaneous'].forEach(t => {
        const tbody = document.getElementById(`step-tbody-${t}`);
        if (tbody) tbody.innerHTML = `<tr><td colspan="4" style="text-align:center;padding:30px;color:var(--text-4);">Loading…</td></tr>`;
      });

      const { data, error } = await db.from('workflow_steps').select('*, misc_activities(category, name)').order('sort_order');
      if (error) {
        ['model', 'drawing', 'test_package', 'materials', 'calculations'].forEach(t => {
          const tbody = document.getElementById(`step-tbody-${t}`);
          if (tbody) tbody.innerHTML = `<tr><td colspan="4" style="text-align:center;padding:30px;color:var(--red);">Error loading steps.</td></tr>`;
        });
        return;
      }

      stepsData = data || [];

      ['model', 'drawing', 'test_package', 'materials', 'calculations', 'miscellaneous'].forEach(t => {
        const tbody   = document.getElementById(`step-tbody-${t}`);
        const filtered = stepsData.filter(s => (s.activity_type || 'drawing') === t);
        if (!filtered.length) {
          tbody.innerHTML = `<tr><td colspan="4" style="text-align:center;padding:40px;color:var(--text-4);">No steps yet. Click "+ Add Step" to get started.</td></tr>`;
          return;
        }
        tbody.innerHTML = filtered.map((s, i) => {
          const globalIdx = stepsData.indexOf(s);
          return `<tr>
            <td style="text-align:center;">
              <span style="display:inline-flex;align-items:center;justify-content:center;width:24px;height:24px;background:var(--bg-4);border-radius:50%;font-size:11px;font-weight:700;color:var(--text-3);">${s.sort_order}</span>
            </td>
            <td style="font-weight:600;color:var(--text);">${s.name}</td>
            <td style="text-align:center;">
              ${s.activity_type === 'miscellaneous'
                ? `<span class="badge badge-gray" style="font-size:11px;">${s.misc_activities ? s.misc_activities.category + ' — ' + s.misc_activities.name : '—'}</span>`
                : s.revision_code ? `<span class="badge badge-blue" style="font-family:monospace;letter-spacing:.5px;">${s.revision_code}</span>` : '<span style="color:var(--text-4);">—</span>'}
            </td>
            <td style="text-align:center;">
              <div class="table-actions" style="justify-content:center;">
                <button class="btn btn-icon edit"   onclick="openEditStep(${globalIdx})" title="Edit">${IC.edit}</button>
                <button class="btn btn-icon delete" onclick="deleteStep('${s.id}')" title="Delete">${IC.trash}</button>
              </div>
            </td>
          </tr>`;
        }).join('');
      });
    }

    function toggleMiscActivityField() {
      const type  = document.getElementById('s-activity-type').value;
      const group = document.getElementById('s-misc-activity-group');
      const sel   = document.getElementById('s-misc-activity-id');
      if (type === 'miscellaneous') {
        // Populate dropdown from miscActivitiesData
        sel.innerHTML = '<option value="">— Select Activity —</option>' +
          miscActivitiesData.map(a => `<option value="${a.id}">${a.category} — ${a.name}</option>`).join('');
        group.style.display = '';
      } else {
        group.style.display = 'none';
        sel.value = '';
      }
    }

    function openAddStep() {
      document.getElementById('s-id').value            = '';
      document.getElementById('s-name').value          = '';
      document.getElementById('s-order').value         = '';
      document.getElementById('s-revision').value      = '';
      document.getElementById('s-activity-type').value = currentWfTab;
      document.getElementById('s-misc-activity-id').value = '';
      toggleMiscActivityField();
      document.getElementById('step-modal-title').lastChild.textContent = ' Add Workflow Step';
      openModal('step-modal');
      setTimeout(() => document.getElementById('s-name').focus(), 100);
    }

    function openEditStep(index) {
      const s = stepsData[index];
      if (!s) return;
      document.getElementById('s-id').value            = s.id;
      document.getElementById('s-name').value          = s.name || '';
      document.getElementById('s-order').value         = s.sort_order || '';
      document.getElementById('s-revision').value      = s.revision_code || '';
      document.getElementById('s-activity-type').value = s.activity_type || 'drawing';
      toggleMiscActivityField();
      document.getElementById('s-misc-activity-id').value = s.misc_activity_id || '';
      document.getElementById('step-modal-title').lastChild.textContent = ' Edit Workflow Step';
      openModal('step-modal');
      setTimeout(() => document.getElementById('s-name').focus(), 100);
    }

    async function saveStep() {
      const btn              = document.getElementById('step-save-btn');
      const id               = document.getElementById('s-id').value;
      const name             = document.getElementById('s-name').value.trim();
      const sort_order       = parseInt(document.getElementById('s-order').value) || 99;
      const revision_code    = document.getElementById('s-revision').value.trim() || null;
      const activity_type    = document.getElementById('s-activity-type').value || 'drawing';
      const misc_activity_id = activity_type === 'miscellaneous'
        ? (document.getElementById('s-misc-activity-id').value || null)
        : null;
      if (!name) { toast('Step name is required.', 'error'); document.getElementById('s-name').focus(); return; }
      if (activity_type === 'miscellaneous' && !misc_activity_id) { toast('Please select a Miscellaneous Activity.', 'error'); return; }
      btn.disabled = true; btn.textContent = 'Saving…';
      const { error } = id
        ? await db.from('workflow_steps').update({ name, sort_order, revision_code, activity_type, misc_activity_id }).eq('id', id)
        : await db.from('workflow_steps').insert({ name, sort_order, revision_code, activity_type, misc_activity_id });
      btn.disabled = false; btn.innerHTML = `${IC.save} Save`;
      if (error) { toast('Error: ' + error.message, 'error'); return; }
      toast(id ? 'Step updated.' : 'Step added.', 'success');
      closeModal('step-modal');
      await loadWorkflowSteps();
    }

    async function deleteStep(id) {
      confirmDialog('Delete this workflow step?', async () => {
        const { error } = await db.from('workflow_steps').delete().eq('id', id);
        if (error) { toast('Error: ' + error.message, 'error'); return; }
        toast('Step deleted.', 'success');
        await loadWorkflowSteps();
      });
    }

    // ── ROLES ─────────────────────────────────────────────────

    async function loadRoles() {
      const tbody = document.getElementById('role-tbody');
      tbody.innerHTML = `<tr><td colspan="4" style="text-align:center;padding:30px;color:var(--text-4);">Loading…</td></tr>`;
      const { data, error } = await db.from('roles').select('*').order('name');
      if (error) { tbody.innerHTML = `<tr><td colspan="4" style="text-align:center;padding:30px;color:var(--red);">Error loading roles.</td></tr>`; return; }
      rolesData = data || [];
      if (!rolesData.length) {
        tbody.innerHTML = `<tr><td colspan="4" style="text-align:center;padding:40px;color:var(--text-4);">No roles yet. Click "+ Add Role" to get started.</td></tr>`;
        return;
      }
      tbody.innerHTML = rolesData.map((r, i) => `
        <tr>
          <td style="font-weight:600;color:var(--text);">${r.name}</td>
          <td><span style="font-family:monospace;font-size:12px;color:var(--text-3);">${r.key}</span></td>
          <td style="text-align:center;">
            <span class="badge" style="background-color:${(r.badge_color||'#546E7A')}22;color:${r.badge_color||'#546E7A'};border-color:${(r.badge_color||'#546E7A')}55;">${r.name}</span>
          </td>
          <td style="text-align:center;">
            <div class="table-actions">
              <button class="btn btn-icon edit"   onclick="openEditRole(${i})" title="Edit">${IC.edit}</button>
              <button class="btn btn-icon delete" onclick="deleteRole('${r.id}')" title="Delete">${IC.trash}</button>
            </div>
          </td>
        </tr>
      `).join('');
    }

    function openAddRole() {
      document.getElementById('r-id').value    = '';
      document.getElementById('r-name').value  = '';
      document.getElementById('r-key').value   = '';
      document.getElementById('r-color').value = BADGE_COLORS[0].value;
      document.getElementById('role-modal-title').lastChild.textContent = ' Add Role';
      updateRolePreview();
      openModal('role-modal');
      setTimeout(() => document.getElementById('r-name').focus(), 100);
    }

    function openEditRole(index) {
      const r = rolesData[index];
      if (!r) return;
      document.getElementById('r-id').value    = r.id;
      document.getElementById('r-name').value  = r.name || '';
      document.getElementById('r-key').value   = r.key  || '';
      document.getElementById('r-color').value = r.badge_color || BADGE_COLORS[0].value;
      document.getElementById('role-modal-title').lastChild.textContent = ' Edit Role';
      updateRolePreview();
      openModal('role-modal');
      setTimeout(() => document.getElementById('r-name').focus(), 100);
    }

    async function saveRole() {
      const btn         = document.getElementById('role-save-btn');
      const id          = document.getElementById('r-id').value;
      const name        = document.getElementById('r-name').value.trim();
      const key         = document.getElementById('r-key').value.trim().toLowerCase().replace(/[^a-z0-9_]/g, '_');
      const badge_color = document.getElementById('r-color').value;
      if (!name) { toast('Role name is required.', 'error'); document.getElementById('r-name').focus(); return; }
      if (!key)  { toast('Role key is required.',  'error'); document.getElementById('r-key').focus();  return; }
      document.getElementById('r-key').value = key;
      btn.disabled = true; btn.textContent = 'Saving…';
      const { error } = id
        ? await db.from('roles').update({ name, key, badge_color }).eq('id', id)
        : await db.from('roles').insert({ name, key, badge_color });
      btn.disabled = false; btn.innerHTML = `${IC.save} Save`;
      if (error) { toast('Error: ' + error.message, 'error'); return; }
      toast(id ? 'Role updated.' : 'Role added.', 'success');
      closeModal('role-modal');
      await loadRoles();
    }

    async function deleteRole(id) {
      confirmDialog('Delete this role? Users assigned this role will need to be updated manually.', async () => {
        const { error } = await db.from('roles').delete().eq('id', id);
        if (error) { toast('Error: ' + error.message, 'error'); return; }
        toast('Role deleted.', 'success');
        await loadRoles();
      });
    }

    initLayout('Admin');
  </script>
</body>
