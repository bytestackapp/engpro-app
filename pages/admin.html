	function openArchiveDeleteModal() {
      const proj = window._lastArchivedProject;
      if (!proj) { toast('No recently exported project found — export one first.', 'error'); return; }
      document.getElementById('archive-delete-project-label').textContent = proj.code;
      document.getElementById('archive-delete-password').value = '';
      openModal('archive-delete-modal');
      setTimeout(() => document.getElementById('archive-delete-password').focus(), 100);
    }

    async function confirmArchiveDelete() {
      const proj = window._lastArchivedProject;
      const password = document.getElementById('archive-delete-password').value;
      const btn = document.getElementById('archive-delete-confirm-btn');

      if (!password) { toast('Enter your password to confirm.', 'error'); return; }

      btn.disabled = true;
      btn.textContent = 'Verifying…';

      try {
        // Re-verify it's really this admin, right now, by re-authenticating
        // with their own email + the password they just typed. This doesn't
        // disrupt their session — it's the same account confirming itself.
        const { error: authError } = await db.auth.signInWithPassword({
          email: userProfile.email,
          password,
        });
        if (authError) {
          toast('Incorrect password.', 'error');
          btn.disabled = false;
          btn.textContent = 'Delete Permanently';
          return;
        }

        btn.textContent = 'Deleting…';
        const { error: deleteError } = await db.rpc('admin_archive_delete_project', {
          target_project_id: proj.id,
        });

        if (deleteError) {
          toast('Delete failed: ' + deleteError.message, 'error');
          btn.disabled = false;
          btn.textContent = 'Delete Permanently';
          return;
        }

        closeModal('archive-delete-modal');
        toast(`${proj.code} data deleted and marked Archived.`, 'success');
        window._lastArchivedProject = null;
      } catch (err) {
        console.error('[confirmArchiveDelete]', err);
        toast('Unexpected error: ' + err.message, 'error');
        btn.disabled = false;
        btn.textContent = 'Delete Permanently';
      }
    }

	// ============================================================
    // PROJECT ARCHIVE EXPORT (Phase 1 — read-only, exports every
    // table connected to one project into a single Excel workbook)
    // ============================================================

    // Tables that carry a direct project_id or project_code column.
    // { table, column, sheet }
        const ARCHIVE_DIRECT_TABLES = [
      { table: 'models_3d',                       column: 'project_id',   sheet: '3D Models' },
      { table: 'model_activities',                column: 'project_id',   sheet: 'Model Activities' },
      { table: 'erection_drawings',               column: 'project_id',   sheet: 'Erection Drawings' },
      { table: 'erection_drawing_activities',     column: 'project_id',   sheet: 'Erection Activities' },

      { table: 'fabrication_drawing_activities',  column: 'project_id',   sheet: 'Fabrication Activities' },
      { table: 'support_drawings',                column: 'project_id',   sheet: 'Support Drawings' },
      { table: 'support_drawing_activities',      column: 'project_id',   sheet: 'Support Activities' },
      { table: 'weld_map_drawings',               column: 'project_id',   sheet: 'Weld Map Drawings' },
      { table: 'weld_map_drawing_activities',     column: 'project_id',   sheet: 'Weld Map Activities' },
      { table: 'test_package_drawings',           column: 'project_id',   sheet: 'Test Packages' },
      { table: 'test_package_drawing_activities', column: 'project_id',   sheet: 'Test Pkg Activities' },
      { table: 'material_status',                 column: 'project_code', sheet: 'Material Status' },
      { table: 'material_activities',             column: 'project_id',   sheet: 'Material Activities' },
      { table: 'pr_activities',                   column: 'project_id',   sheet: 'PR Activities' },
      { table: 'tbe_activities',                  column: 'project_id',   sheet: 'TBE Activities' },
      { table: 'eng_calculations',                column: 'project_id',   sheet: 'Eng Calculations' },
      { table: 'eng_calculation_activities',      column: 'project_id',   sheet: 'Eng Calc Activities' },
      { table: 'technical_queries',               column: 'project_code', sheet: 'Technical Queries' },
      { table: 'issues_concerns',                 column: 'project_id',   sheet: 'Issues Concerns' },
      { table: 'other_activity_logs',             column: 'project_id',   sheet: 'Other Activity Logs' },
      { table: 'misc_activity_logs',              column: 'project_id',   sheet: 'Misc Activity Logs' },
      { table: 'structure_items',                 column: 'project_code', sheet: 'Structure Items' },
      { table: 'targets',                         column: 'project_id',   sheet: 'Positions' },
      { table: 'project_discipline_roc',          column: 'project_id',   sheet: 'Discipline ROC' },
      { table: 'roc_items',                       column: 'project_id',   sheet: 'ROC Items' },
      { table: 'planned_progress',                column: 'project_id',   sheet: 'Planned Progress' },
      { table: 'progress_snapshots',              column: 'project_id',   sheet: 'Progress Snapshots' },
      { table: 'target_kpi',                      column: 'project_id',   sheet: 'Target KPI' },
    ];

    // Builds ID → readable-name lookup maps, used to humanize every sheet
    // before writing the file. Keyed by column name, so any sheet with a
    // matching column (e.g. every table's "user_id") gets resolved the same way.
    async function buildArchiveLookupMaps() {
      const [
        { data: users }, { data: discs }, { data: projects }, { data: reasons },
        { data: structureItems }, { data: targetsData },
        { data: erectionDwgs }, { data: fabDwgs }, { data: supDwgs }, { data: weldDwgs },
        { data: tpDwgs }, { data: calcs }, { data: materials }, { data: models },
        { data: prs }, { data: tbes }, { data: otherActs }, { data: miscActs },
      ] = await Promise.all([
        db.from('users').select('id, full_name'),
        db.from('disciplines').select('id, name'),
        db.from('projects').select('id, code, name'),
        db.from('revision_reasons').select('id, code, description'),
        db.from('structure_items').select('id, area_system_module'),
        db.from('targets').select('id, position, role_key'),
        db.from('erection_drawings').select('id, drawing_number'),
        db.from('fabrication_drawings').select('id, drawing_number'),
        db.from('support_drawings').select('id, drawing_number'),
        db.from('weld_map_drawings').select('id, drawing_number'),
        db.from('test_package_drawings').select('id, drawing_number'),
        db.from('eng_calculations').select('id, doc_number'),
        db.from('material_status').select('id, mto_number'),
        db.from('models_3d').select('id, model_name'),
        db.from('purchase_requisitions').select('id, pr_no'),
        db.from('tbe_items').select('id, tbe_number'),
        db.from('other_activities').select('id, code'),
        db.from('misc_activities').select('id, name'),
      ]);
      const mapOf = (rows, fn) => Object.fromEntries((rows || []).map(r => [r.id, fn(r)]));
      return {
        user_id:               mapOf(users, u => u.full_name),
        created_by:             mapOf(users, u => u.full_name),
        checked_by:              mapOf(users, u => u.full_name),
        discipline_id:            mapOf(discs, d => d.name),
        project_id:                 mapOf(projects, p => `${p.code} — ${p.name}`),
        revision_reason_id:           mapOf(reasons, r => r.description || r.code),
        structure_item_id:              mapOf(structureItems, s => s.area_system_module),
        target_id:                         mapOf(targetsData, t => t.position || t.role_key),
        erection_drawing_id:                 mapOf(erectionDwgs, d => d.drawing_number),
        fabrication_drawing_id:                mapOf(fabDwgs, d => d.drawing_number),
        support_drawing_id:                      mapOf(supDwgs, d => d.drawing_number),
        weld_map_drawing_id:                       mapOf(weldDwgs, d => d.drawing_number),
        test_package_drawing_id:                     mapOf(tpDwgs, d => d.drawing_number),
        eng_calculation_id:                            mapOf(calcs, c => c.doc_number),
        material_status_id:                              mapOf(materials, m => m.mto_number),
        model_id:                                          mapOf(models, m => m.model_name),
        pr_id:                                               mapOf(prs, p => p.pr_no),
        tbe_id:                                                mapOf(tbes, t => t.tbe_number),
        activity_id: { ...mapOf(otherActs, a => a.code), ...mapOf(miscActs, a => a.name) },
      };
    }

    // Detects any value that looks like an ISO date or timestamp
    // ("2026-08-19" or "2026-08-19T14:23:11.000Z") and trims it down to
    // just the date part. Works on every column automatically, regardless
    // of the column's name, so every sheet stays consistent without
    // needing to list out every date-ish column by hand.
    function normalizeDateValue(val) {
      if (typeof val === 'string' && /^\d{4}-\d{2}-\d{2}(T|$)/.test(val)) {
        return val.substring(0, 10);
      }
      return val;
    }

    function humanizeRows(rows, maps) {
      return (rows || []).map(row => {
        const out = {};
        for (const col in row) {
          let val = row[col];
          if (maps && maps[col] && val && maps[col][val] !== undefined) {
            val = maps[col][val];       // resolve UUID -> readable name
          } else {
            val = normalizeDateValue(val); // otherwise, trim date/time if it looks like one
          }
          out[col] = val;
        }
        return out;
      });
    }

    function addSheet(wb, sheetName, rows, maps) {
      const humanized = maps ? humanizeRows(rows, maps) : (rows || []);
      const ws = XLSX.utils.json_to_sheet(humanized.length ? humanized : [{}]);
      XLSX.utils.book_append_sheet(wb, ws, sheetName.substring(0, 31));
    }

    async function exportProjectArchive() {
      const sel = document.getElementById('archive-project-select');
      const projectId = sel.value;
      const projectCode = sel.selectedOptions[0]?.dataset.code;
      if (!projectId) { toast('Select a project first.', 'error'); return; }
      window._lastArchivedProject = { id: projectId, code: projectCode };

      const btn = document.getElementById('archive-export-btn');
      const statusEl = document.getElementById('archive-export-status');
      btn.disabled = true;
      const setStatus = msg => { statusEl.textContent = msg; };

      try {
        const wb = XLSX.utils.book_new();

        setStatus('Loading reference names…');
        const maps = await buildArchiveLookupMaps();

        // ---- Fetch every direct table (order doesn't matter here) ----
        setStatus(`Fetching ${ARCHIVE_DIRECT_TABLES.length} direct tables…`);
        const directResults = await Promise.all(
          ARCHIVE_DIRECT_TABLES.map(cfg => {
            const value = cfg.column === 'project_code' ? projectCode : projectId;
            return db.from(cfg.table).select('*').eq(cfg.column, value)
              .then(r => ({ ...cfg, data: r.data, error: r.error }));
          })
        );
        directResults.forEach(r => { if (r.error) console.warn(`[archive:${r.table}]`, r.error.message); });
        const getData = t => directResults.find(r => r.table === t)?.data;

        // ---- Fetch the tables that depend on IDs from the batch above ----
        setStatus('Fetching histogram, ROC steps, KPI areas…');
        const targetIds    = (getData('targets') || []).map(t => t.id);
        const rocItemIds   = (getData('roc_items') || []).map(r => r.id);
        const targetKpiIds = (getData('target_kpi') || []).map(k => k.id);
        const materialIds  = (getData('material_status') || []).map(m => m.id);

        const [
          { data: histogramData, error: histErr },
          { data: rocStepData, error: rocStepErr },
          { data: kpiAreaData, error: kpiAreaErr },
          { data: prLinks, error: linkErr },
          { data: tbeItemsData, error: tbeItemsErr },
          { data: poItemsData, error: poErr },
        ] = await Promise.all([
          targetIds.length    ? db.from('target_schedule').select('*').in('target_id', targetIds)         : Promise.resolve({ data: [] }),
          rocItemIds.length   ? db.from('roc_step_items').select('*').in('roc_item_id', rocItemIds)       : Promise.resolve({ data: [] }),
          targetKpiIds.length ? db.from('target_kpi_areas').select('*').in('kpi_id', targetKpiIds)        : Promise.resolve({ data: [] }),
          materialIds.length  ? db.from('pr_mto_links').select('*').in('mto_id', materialIds)             : Promise.resolve({ data: [] }),
          materialIds.length  ? db.from('tbe_items').select('*').in('mto_id', materialIds)                : Promise.resolve({ data: [] }),
          materialIds.length  ? db.from('po_items').select('*').in('mto_id', materialIds)     : Promise.resolve({ data: [] }),
        ]);
        if (histErr)    console.warn('[archive:target_schedule]', histErr.message);
        if (rocStepErr) console.warn('[archive:roc_step_items]', rocStepErr.message);
        if (kpiAreaErr) console.warn('[archive:target_kpi_areas]', kpiAreaErr.message);
        if (linkErr)    console.warn('[archive:pr_mto_links]', linkErr.message);
        if (tbeItemsErr) console.warn('[archive:tbe_items]', tbeItemsErr.message);
        if (poErr)      console.warn('[archive:po_items]', poErr.message);

        // ---- PR Items: fetch, then attach each PR's MTO number(s) ----
        // pr_mto_links is a many-to-many table (one PR can cover several
        // materials) — not exported as its own sheet anymore; instead its
        // info is folded directly into PR Items as an "mto_number" column
        // (comma-separated if a PR links to more than one material).
        const prIds = [...new Set((prLinks || []).map(l => l.pr_id))];
        let prItemsData = [];
        if (prIds.length) {
          const { data: prs, error: prErr } = await db.from('purchase_requisitions').select('*').in('id', prIds);
          if (prErr) console.warn('[archive:purchase_requisitions]', prErr.message);
          const materialNumberById = Object.fromEntries((getData('material_status') || []).map(m => [m.id, m.mto_number]));
          const mtoNumbersByPr = {};
          (prLinks || []).forEach(l => {
            const num = materialNumberById[l.mto_id];
            if (!num) return;
            (mtoNumbersByPr[l.pr_id] ||= []).push(num);
          });
          prItemsData = (prs || []).map(pr => ({
            ...pr,
            mto_number: (mtoNumbersByPr[pr.id] || []).join(', '),
          }));
        }

        // ---- Planned Progress: round planned_pct to 2 decimal places ----
        const plannedProgressData = (getData('planned_progress') || []).map(r => ({
          ...r,
          planned_pct: r.planned_pct != null ? Math.round(Number(r.planned_pct) * 100) / 100 : r.planned_pct,
        }));

        // ================================================================
        // Write every sheet, in the exact order requested.
        // ================================================================
        setStatus('Building file…');

        addSheet(wb, '3D Models',              getData('models_3d'), maps);
        addSheet(wb, 'Model Activities',       getData('model_activities'), maps);
        addSheet(wb, 'Erection Drawings',      getData('erection_drawings'), maps);
        addSheet(wb, 'Erection Activities',    getData('erection_drawing_activities'), maps);
        addSheet(wb, 'Fabrication Drawings',   getData('fabrication_drawings'), maps);
        addSheet(wb, 'Fabrication Activities', getData('fabrication_drawing_activities'), maps);
        addSheet(wb, 'Support Drawings',       getData('support_drawings'), maps);
        addSheet(wb, 'Support Activities',     getData('support_drawing_activities'), maps);
        addSheet(wb, 'Weld Map Drawings',      getData('weld_map_drawings'), maps);
        addSheet(wb, 'Weld Map Activities',    getData('weld_map_drawing_activities'), maps);
        addSheet(wb, 'Test Packages',          getData('test_package_drawings'), maps);
        addSheet(wb, 'Test Pkg Activities',    getData('test_package_drawing_activities'), maps);
        addSheet(wb, 'Material Status',        getData('material_status'), maps);
        addSheet(wb, 'Material Activities',    getData('material_activities'), maps);
        addSheet(wb, 'PR Items',               prItemsData, maps);
        addSheet(wb, 'PR Activities',          getData('pr_activities'), maps);
        addSheet(wb, 'TBE Items',              tbeItemsData, maps);
        addSheet(wb, 'TBE Activities',         getData('tbe_activities'), maps);
        addSheet(wb, 'PO Items',               poItemsData, maps);
        addSheet(wb, 'Eng Calculations',       getData('eng_calculations'), maps);
        addSheet(wb, 'Eng Calc Activities',    getData('eng_calculation_activities'), maps);
        addSheet(wb, 'Technical Queries',      getData('technical_queries'), maps);
        addSheet(wb, 'Issues Concerns',        getData('issues_concerns'), maps);
        addSheet(wb, 'Other Activity Logs',    getData('other_activity_logs'), maps);
        addSheet(wb, 'Misc Activity Logs',     getData('misc_activity_logs'), maps);
        addSheet(wb, 'Structure Items',        getData('structure_items'), maps);
        addSheet(wb, 'Positions',              getData('targets'), maps);
        addSheet(wb, 'Histogram',              histogramData, maps);
        addSheet(wb, 'Discipline ROC',         getData('project_discipline_roc'), maps);
        addSheet(wb, 'ROC Items',              getData('roc_items'), maps);
        addSheet(wb, 'ROC Step Items',         rocStepData, maps);
        addSheet(wb, 'Planned Progress',       plannedProgressData, maps);
        addSheet(wb, 'Progress Snapshots',     getData('progress_snapshots'), maps);
        addSheet(wb, 'Target KPI',             getData('target_kpi'), maps);
        addSheet(wb, 'Target KPI Areas',       kpiAreaData, maps);

        const sheetCount = wb.SheetNames.length;
        XLSX.writeFile(wb, `ProjectArchive_${projectCode}_${new Date().toISOString().substring(0,10)}.xlsx`);

        closeModal('archive-export-modal');
        document.getElementById('archive-done-message').textContent =
          `Exported ${sheetCount} sheets for ${projectCode}.`;
        openModal('archive-done-modal');
      } catch (err) {
        console.error('[exportProjectArchive]', err);
        toast('Export failed: ' + err.message, 'error');
        setStatus('Export failed — see console for details.');
      } finally {
        btn.disabled = false;
      }
    }

    async function saveDocCode() {
      const btn  = document.getElementById('doc-save-btn');
      const id   = document.getElementById('dc-id').value;
      const type          = document.getElementById('dc-type').value.trim();
      const code          = document.getElementById('dc-code').value.trim().toUpperCase();
      const activity_type = document.getElementById('dc-activity-type').value || 'drawing';
      const source_table  = activity_type === 'drawing' ? (document.getElementById('dc-source-table').value || null) : null;
      if (!type) { toast('Document type is required.', 'error'); document.getElementById('dc-type').focus(); return; }
      if (!code) { toast('Deliverable code is required.', 'error'); document.getElementById('dc-code').focus(); return; }
      btn.disabled = true; btn.textContent = 'Saving…';
      const { error } = id
        ? await db.from('document_codes').update({ type, code, activity_type, source_table }).eq('id', id)
        : await db.from('document_codes').insert({ type, code, activity_type, source_table });
      btn.disabled = false; btn.innerHTML = `${IC.save} Save`;
      if (error) { toast('Error: ' + error.message, 'error'); return; }
      toast(id ? 'Deliverable updated.' : 'Deliverable added.', 'success');
      closeModal('doc-modal');
      await loadDocCodes();
    }

    async function deleteDocCode(id) {
      const doc = docCodesData.find(d => d.id === id);
      confirmDialog('Delete this deliverable?', async () => {
        const { data: rocRows } = await db.from('roc_items').select('weight').eq('doc_code_id', id);
        const hasRocData = (rocRows || []).some(r => parseFloat(r.weight) > 0);

        const { data: kpiRows } = await db.from('target_kpi').select('target_value').eq('doc_code_id', id);
        const hasKpiData = (kpiRows || []).some(r => r.target_value != null);

        if (hasRocData || hasKpiData) {
          toast(`Delete Failed — item has existing ROC or KPI data. Clear those first.`, 'error');
          return;
        }

        const { error } = await db.from('document_codes').delete().eq('id', id);
        if (error) { toast('Error: ' + error.message, 'error'); return; }
        toast('Deleted.', 'success');
        await loadDocCodes();
      });
    }

    const METADATA_TABLES = [
      'erection_drawings', 'fabrication_drawings', 'support_drawings',
      'weld_map_drawings', 'test_package_drawings', 'eng_calculations',
    ];
    
    // Returns true if ANY table has at least one row where metadata->>key is set.
    async function isColumnKeyLocked(key) {
      for (const t of METADATA_TABLES) {
        const { count, error } = await db.from(t)
          .select('id', { count: 'exact', head: true })
          .not(`metadata->>${key}`, 'is', null)
          .neq(`metadata->>${key}`, '');
        if (!error && count > 0) return true;
      }
      return false;
    }
    
    async function loadCustomColumnCatalog() {
      const tbody = document.getElementById('cc-tbody');
      tbody.innerHTML = `<tr><td colspan="6" style="text-align:center;padding:30px;color:var(--text-4);">Loading…</td></tr>`;
      const { data, error } = await db.from('custom_column_catalog').select('*').order('sort_order');
      if (error) { tbody.innerHTML = `<tr><td colspan="6" style="text-align:center;padding:30px;color:var(--red);">Error loading custom columns.</td></tr>`; return; }
      customColumnCatalogData = data || [];
      if (!customColumnCatalogData.length) {
        tbody.innerHTML = `<tr><td colspan="6" style="text-align:center;padding:40px;color:var(--text-4);">No custom columns yet. Click "+ Add Custom Column" to get started.</td></tr>`;
        return;
      }
    
      // Compute lock status for every row up front (parallel).
      const lockFlags = await Promise.all(customColumnCatalogData.map(c => isColumnKeyLocked(c.key)));
    
      tbody.innerHTML = customColumnCatalogData.map((c, i) => {
        const locked = lockFlags[i];
        return `
          <tr>
            <td style="text-align:center;">
              <span style="display:inline-flex;align-items:center;justify-content:center;width:24px;height:24px;background:var(--bg-4);border-radius:50%;font-size:11px;font-weight:700;color:var(--text-3);">${c.sort_order}</span>
            </td>
            <td style="font-weight:600;color:var(--text);">${esc(c.label)}</td>
            <td style="font-family:monospace;font-size:12px;color:var(--text-3);">${esc(c.key)}</td>
            <td style="text-align:center;color:var(--text-3);">${esc(c.unit || '—')}</td>
            <td style="text-align:center;">
              ${locked
                ? `<span class="badge badge-orange" style="display:inline-flex;align-items:center;gap:4px;">LOCKED</span>`
                : `<span class="badge badge-gray">Unused</span>`}
            </td>
            <td style="text-align:center;">
              <div class="table-actions">
                <button class="btn btn-icon edit" ${locked ? 'disabled style="opacity:.35;cursor:not-allowed;"' : `onclick="openEditCustomColumn(${i})"`} title="${locked ? 'Locked — in use' : 'Edit'}">${IC.edit}</button>
                <button class="btn btn-icon delete" ${locked ? 'disabled style="opacity:.35;cursor:not-allowed;"' : `onclick="deleteCustomColumn('${c.id}')"`} title="${locked ? 'Locked — in use' : 'Delete'}">${IC.trash}</button>
              </div>
            </td>
          </tr>
        `;
      }).join('');
    }
    
    function slugifyColumnKey(label) {
      return label.toLowerCase().trim().replace(/\s+/g, '_').replace(/[^a-z0-9_]/g, '');
    }
    
    function openAddCustomColumn() {
      document.getElementById('cc-id').value    = '';
      document.getElementById('cc-label').value = '';
      document.getElementById('cc-key').value   = '';
      document.getElementById('cc-unit').value  = '';

        : 1;
      document.getElementById('cc-modal-title').lastChild.textContent = ' Add Custom Column';
      openModal('cc-modal');
      setTimeout(() => {
        const labelEl = document.getElementById('cc-label');
        labelEl.oninput = () => { document.getElementById('cc-key').value = slugifyColumnKey(labelEl.value); };
        labelEl.focus();
      }, 100);
    }
    
    // Locked entries never reach here (button disabled), but guard anyway.
    function openEditCustomColumn(index) {
      const c = customColumnCatalogData[index];
      if (!c) return;
      document.getElementById('cc-id').value    = c.id;
      document.getElementById('cc-label').value = c.label;

      document.getElementById('cc-unit').value  = c.unit || '';

    async function saveCustomColumn() {
      const btn   = document.getElementById('cc-save-btn');
      const id    = document.getElementById('cc-id').value;
      const label = document.getElementById('cc-label').value.trim();
      const key   = document.getElementById('cc-key').value.trim();
      const unit  = document.getElementById('cc-unit').value.trim() || null;
      const sort_order = parseInt(document.getElementById('cc-order').value) || 99;
    
      if (!label) { toast('Label is required.', 'error'); document.getElementById('cc-label').focus(); return; }
      if (!key)   { toast('Could not generate a key from that label.', 'error'); return; }
    
      // Re-check lock immediately before an edit save (defensive — UI already blocks this path).
      if (id) {
        const locked = await isColumnKeyLocked(key);
        if (locked) { toast('This column is locked and cannot be modified.', 'error'); closeModal('cc-modal'); await loadCustomColumnCatalog(); return; }
      }
    
      btn.disabled = true; btn.textContent = 'Saving…';
      const { error } = id
        ? await db.from('custom_column_catalog').update({ label, key, unit, sort_order }).eq('id', id)
        : await db.from('custom_column_catalog').insert({ label, key, unit, sort_order });
      btn.disabled = false; btn.innerHTML = `${IC.save} Save`;
    
      if (error) { toast('Error: ' + error.message, 'error'); return; }
      toast(id ? 'Custom column updated.' : 'Custom column added.', 'success');
      closeModal('cc-modal');
      await loadCustomColumnCatalog();
    }
    
    async function deleteCustomColumn(id) {
      const col = customColumnCatalogData.find(c => c.id === id);
      if (!col) return;
      const locked = await isColumnKeyLocked(col.key);
      if (locked) { toast('This column is in use and cannot be deleted.', 'error'); return; }
      confirmDialog('Delete this custom column? It will no longer be selectable on any register page.', async () => {
        const { error } = await db.from('custom_column_catalog').delete().eq('id', id);
        if (error) { toast('Error: ' + error.message, 'error'); return; }

        await loadCustomColumnCatalog();
      });
    }

    // Populate the "Revision Of" dropdown with other steps of the same activity type,
    // excluding the step currently being edited (a step can't be a revision of itself).
    function populateRevisionOfOptions(selectedId) {
      const type = document.getElementById('s-activity-type').value || 'drawing';
      const currentId = document.getElementById('s-id').value;
      const sel = document.getElementById('s-revision-of');
      const candidates = stepsData
        .filter(s => (s.activity_type || 'drawing') === type && s.id !== currentId)
        .sort((a, b) => (a.sort_order || 0) - (b.sort_order || 0));
      sel.innerHTML = '<option value="">— None —</option>' +
        candidates.map(s => `<option value="${s.id}">${esc(s.name)}</option>`).join('');
      sel.value = selectedId || '';
    }
	
	function populateStepPositionOptions(defaultBeforeId) {
      const type = document.getElementById('s-activity-type').value || 'drawing';
      const currentId = document.getElementById('s-id').value;
      const siblings = stepsData
        .filter(s => (s.activity_type || 'drawing') === type && s.id !== currentId)
        .sort((a, b) => (a.sort_order || 0) - (b.sort_order || 0));
      const sel = document.getElementById('s-position');
      sel.innerHTML = siblings.map(s => `<option value="${s.id}">Before "${esc(s.name)}"</option>`).join('')
        + `<option value="">At the end</option>`;
      sel.value = defaultBeforeId || '';
    }

    function openAddStep() {
      document.getElementById('s-id').value            = '';
      document.getElementById('s-name').value          = '';
      document.getElementById('s-revision').value      = '';
      document.getElementById('s-activity-type').value = currentWfTab;
      document.getElementById('s-misc-activity-id').value = '';
      document.getElementById('s-requires-mh').checked = true;
      document.getElementById('s-credit-required').checked = true;
      document.getElementById('s-is-revision').checked = false;
	  document.getElementById('s-is-issuance').checked = false;
      toggleMiscActivityField();
      populateStepPositionOptions(); // defaults to "At the end"
      populateRevisionOfOptions();
      toggleRevisionOfField();
      document.getElementById('step-modal-title').lastChild.textContent = ' Add Workflow Step';
      openModal('step-modal');
      setTimeout(() => document.getElementById('s-name').focus(), 100);

    function openEditStep(index) {
      const s = stepsData[index];
      if (!s) return;
      document.getElementById('s-id').value            = s.id;
      document.getElementById('s-name').value          = s.name || '';
      document.getElementById('s-revision').value      = s.revision_code || '';
      document.getElementById('s-activity-type').value = s.activity_type || 'drawing';
      document.getElementById('s-requires-mh').checked = s.requires_manhours !== false;
      document.getElementById('s-credit-required').checked = s.credit_required !== false;
      document.getElementById('s-is-revision').checked = s.is_revision === true;
	  document.getElementById('s-is-issuance').checked = s.is_issuance === true;
      toggleMiscActivityField();
      document.getElementById('s-misc-activity-id').value = s.misc_activity_id || '';
      // Default the position dropdown to wherever this step currently sits.
      const sameType = stepsData
        .filter(x => (x.activity_type || 'drawing') === (s.activity_type || 'drawing'))
        .sort((a, b) => (a.sort_order || 0) - (b.sort_order || 0));
      const nextSibling = sameType[sameType.indexOf(s) + 1];
      populateStepPositionOptions(nextSibling ? nextSibling.id : '');
      populateRevisionOfOptions(s.revision_of || '');
      toggleRevisionOfField();
      document.getElementById('step-modal-title').lastChild.textContent = ' Edit Workflow Step';
      openModal('step-modal');
      setTimeout(() => document.getElementById('s-name').focus(), 100);
    }
	
	async function moveStep(index, direction) {
      const s = stepsData[index];
      if (!s) return;
      const type = s.activity_type || 'drawing';
      const siblings = stepsData
        .filter(x => (x.activity_type || 'drawing') === type)
        .sort((a, b) => (a.sort_order || 0) - (b.sort_order || 0));
      const pos = siblings.findIndex(x => x.id === s.id);
      const swapPos = direction === 'up' ? pos - 1 : pos + 1;
      if (swapPos < 0 || swapPos >= siblings.length) return; // already at the edge
      const other = siblings[swapPos];
      await db.from('workflow_steps').update({ sort_order: other.sort_order }).eq('id', s.id);
      await db.from('workflow_steps').update({ sort_order: s.sort_order }).eq('id', other.id);
      await loadWorkflowSteps();
    }

    async function saveStep() {
      const btn               = document.getElementById('step-save-btn');
      const id                 = document.getElementById('s-id').value;
      const name               = document.getElementById('s-name').value.trim();
      const beforeId           = document.getElementById('s-position').value || null; // step to insert before, or null = at the end
      const revision_code      = document.getElementById('s-revision').value.trim() || null;
      const activity_type      = document.getElementById('s-activity-type').value || 'drawing';
      const requires_manhours  = activity_type === 'miscellaneous'
        ? true
        : document.getElementById('s-requires-mh').checked;
      const credit_required    = activity_type === 'miscellaneous'
        ? true
        : document.getElementById('s-credit-required').checked;
      const misc_activity_id   = activity_type === 'miscellaneous'
        ? (document.getElementById('s-misc-activity-id').value || null)
        : null;
      const is_revision = document.getElementById('s-is-revision').checked;
      const is_issuance = document.getElementById('s-is-issuance').checked;
      const revision_of = is_revision
        ? (document.getElementById('s-revision-of').value || null)
        : null;
      if (!name) { toast('Step name is required.', 'error'); document.getElementById('s-name').focus(); return; }
      if (activity_type === 'miscellaneous' && !misc_activity_id) { toast('Please select a Miscellaneous Activity.', 'error'); return; }
      btn.disabled = true; btn.textContent = 'Saving…';

      const payload = { name, revision_code, activity_type, misc_activity_id, requires_manhours, credit_required, is_revision, revision_of, is_issuance };

      // Save the step itself first (sort_order corrected in the resequence pass below).
      let stepId = id;
      if (id) {
        const { error } = await db.from('workflow_steps').update(payload).eq('id', id);
        if (error) { btn.disabled = false; btn.innerHTML = `${IC.save} Save`; toast('Error: ' + error.message, 'error'); return; }
      } else {
        const { data, error } = await db.from('workflow_steps').insert({ ...payload, sort_order: 999 }).select().single();
        if (error) { btn.disabled = false; btn.innerHTML = `${IC.save} Save`; toast('Error: ' + error.message, 'error'); return; }
        stepId = data.id;
      }

      // Build the full ordered list for this activity type with this step placed
      // at the chosen position, then resequence everyone to clean 1..N — no manual
      // renumbering of the other steps needed, ever.
      const siblings = stepsData
        .filter(s => (s.activity_type || 'drawing') === activity_type && s.id !== stepId)
        .sort((a, b) => (a.sort_order || 0) - (b.sort_order || 0))
        .map(s => s.id);
      const insertIdx = beforeId ? siblings.indexOf(beforeId) : -1;
      if (insertIdx === -1) siblings.push(stepId);
      else siblings.splice(insertIdx, 0, stepId);

      for (let i = 0; i < siblings.length; i++) {
        await db.from('workflow_steps').update({ sort_order: i + 1 }).eq('id', siblings[i]);
      }

      btn.disabled = false; btn.innerHTML = `${IC.save} Save`;
      toast(id ? 'Step updated.' : 'Step added.', 'success');
      closeModal('step-modal');
      await loadWorkflowSteps();
    }

    async function deleteStep(id) {
      const step = stepsData.find(s => String(s.id) === String(id));
      confirmDialog('Delete this workflow step?', async () => {
        let hasRocData = false;
        if (step?.name) {
          const { data: rocStepRows } = await db.from('roc_step_items').select('weight').ilike('step_name', step.name);
          hasRocData = (rocStepRows || []).some(r => parseFloat(r.weight) > 0);
        }

        const { data: kpiRows } = await db.from('target_kpi').select('target_value').eq('step_id', id);
        const hasKpiData = (kpiRows || []).some(r => r.target_value != null);

        if (hasRocData || hasKpiData) {
          toast(`Delete Failed — item has existing ROC or KPI data. Clear those first.`, 'error');
          return;
        }

        const { error } = await db.from('workflow_steps').delete().eq('id', id);
        if (error) { toast('Error: ' + error.message, 'error'); return; }
        toast('Step deleted.', 'success');
        await loadWorkflowSteps();
      });
    }

    async function moveRole(index, direction) {
      const r = rolesData[index];
      if (!r) return;
      const ordered = [...rolesData].sort((a, b) => (a.sort_order || 0) - (b.sort_order || 0));
      const pos = ordered.findIndex(x => x.id === r.id);
      const swapPos = direction === 'up' ? pos - 1 : pos + 1;
      if (swapPos < 0 || swapPos >= ordered.length) return; // already at the edge
      const other = ordered[swapPos];
      await db.from('roles').update({ sort_order: other.sort_order }).eq('id', r.id);
      await db.from('roles').update({ sort_order: r.sort_order }).eq('id', other.id);
      await loadRoles();
    }

    function renderPaList() {
      const q = (document.getElementById('pa-search').value || '').trim().toLowerCase();

      const list = document.getElementById('pa-list');

    function updatePaStatus() {
      document.getElementById('pa-status').textContent =
        `${paSelected.size} person(s) allowed on this page (admins always allowed).`;

    async function savePageAccess() {
      const btn  = document.getElementById('pa-save-btn');
      const page = document.getElementById('pa-page').value;
      const toAdd    = [...paSelected].filter(id => !paSaved.has(id));
      const toRemove = [...paSaved].filter(id => !paSelected.has(id));
      if (!toAdd.length && !toRemove.length) { toast('No changes to save.', 'info'); return; }

      btn.disabled = true; btn.textContent = 'Saving…';
      let err = null;
      if (toRemove.length) {
        const r = await db.from('page_access').delete().eq('page', page).in('user_id', toRemove);
        err = r.error;
      }
      if (!err && toAdd.length) {
        const r = await db.from('page_access').insert(toAdd.map(user_id => ({ page, user_id })));
        err = r.error;
      }
      btn.disabled = false; btn.innerHTML = `${IC.save} Save`;

      if (err) { toast('Error: ' + err.message, 'error'); return; }
      paSaved = new Set(paSelected);
      toast('Page access updated.', 'success');
    }

    function openReportPermissionModal() {
      document.getElementById('rp-category').value = 'reports';
      populateRpItemOptions();
      onRpItemChange();
      openModal('report-permission-modal');
    }

    function onRpCategoryChange() {
      populateRpItemOptions();
      onRpItemChange();
    }

    function populateRpItemOptions() {
      const category = document.getElementById('rp-category').value;
      const items = REPORTS_CATALOG[category] || [];
      document.getElementById('rp-item').innerHTML =
        items.map(i => `<option value="${i.key}">${esc(i.label)}</option>`).join('');
    }

    // Roles ordered by rank (lower sort_order = higher rank = shown first),
    // same convention as the Roles tab.
    function rankedRoles() {
      return [...rolesData].sort((a, b) => (a.sort_order || 0) - (b.sort_order || 0));
    }

    function renderRpRoleList(checkedKeys) {
      const list = document.getElementById('rp-role-list');
      const roles = rankedRoles();
      if (!roles.length) {
        list.innerHTML = `<div style="padding:16px;text-align:center;color:var(--text-4);font-size:12px;">No roles defined yet.</div>`;
        return;
      }
      list.innerHTML = roles.map(r => `
        <label style="display:flex;align-items:center;gap:10px;padding:9px 14px;border-bottom:1px solid var(--border);cursor:pointer;font-size:13px;">
          <input type="checkbox" class="rp-role-checkbox" value="${r.key}" ${checkedKeys.includes(r.key) ? 'checked' : ''}
                 style="accent-color:var(--accent);width:14px;height:14px;flex-shrink:0;" />
          <span style="display:inline-flex;align-items:center;justify-content:center;width:20px;height:20px;background:var(--bg-4);border-radius:50%;font-size:10px;font-weight:700;color:var(--text-3);flex-shrink:0;">${r.sort_order ?? '—'}</span>
          <span style="font-weight:600;color:var(--text);">${esc(r.name)}</span>
          <span style="font-family:monospace;font-size:11px;color:var(--text-4);margin-left:auto;">${r.key}</span>
        </label>
      `).join('');
      // drop the border on the last row
      const rows = list.querySelectorAll('label');
      if (rows.length) rows[rows.length - 1].style.borderBottom = 'none';
    }

    async function onRpItemChange() {
      const category = document.getElementById('rp-category').value;
      const reportKey = document.getElementById('rp-item').value;
      const status = document.getElementById('rp-status');
      if (!reportKey) { renderRpRoleList([]); status.textContent = ''; return; }

      if (!rolesData.length) await loadRoles();

      status.textContent = 'Loading…';
      const { data, error } = await db.from('report_permissions')
        .select('*')
        .eq('category', category)
        .eq('report_key', reportKey)
        .maybeSingle();

      if (error) {
        status.textContent = 'Error loading current permissions.';
        renderRpRoleList([]);
        return;
      }

      if (data) {
        renderRpRoleList(data.allowed_roles || []);
        status.textContent = `Restricted — last updated ${new Date(data.updated_at).toLocaleString()}`;
      } else {
        // No row yet = currently open to everyone. Default the checklist to
        // all-checked so "Save" with no changes preserves that open state.
        renderRpRoleList(rolesData.map(r => r.key));
        status.textContent = 'No restrictions set yet — currently open to all roles.';
      }
    }

    function rpSetAll(checked) {
      document.querySelectorAll('.rp-role-checkbox').forEach(cb => { cb.checked = checked; });
    }

    async function saveReportPermission() {
      const btn = document.getElementById('rp-save-btn');
      const category  = document.getElementById('rp-category').value;
      const reportKey = document.getElementById('rp-item').value;
      if (!reportKey) { toast('Select an item first.', 'error'); return; }

      const allowedRoles = [...document.querySelectorAll('.rp-role-checkbox:checked')].map(cb => cb.value);
      if (!allowedRoles.length) {
        toast('Select at least one role, or Cancel — an item with zero roles would be invisible to everyone.', 'error');
        return;
      }

      btn.disabled = true; btn.textContent = 'Saving…';
      const { error } = await db.from('report_permissions').upsert({
        category, report_key: reportKey, allowed_roles: allowedRoles, updated_at: new Date().toISOString(),
      }, { onConflict: 'category,report_key' });
      btn.disabled = false; btn.innerHTML = `${IC.save} Save`;

      if (error) { toast('Error: ' + error.message, 'error'); return; }
      toast('Report permissions updated.', 'success');
      await onRpItemChange(); // refresh the "last updated" status line, modal stays open
    }

    function openAddRole() {
      document.getElementById('r-id').value    = '';
      document.getElementById('r-name').value  = '';
      document.getElementById('r-key').value   = '';
      document.getElementById('r-color').value = BADGE_COLORS[0].value;
      document.getElementById('role-modal-title').lastChild.textContent = ' Add Role';
      updateRolePreview();
      openModal('role-modal');
      setTimeout(() => document.getElementById('r-name').focus(), 100);
    }

    function openEditRole(index) {
      const r = rolesData[index];
      if (!r) return;
      document.getElementById('r-id').value    = r.id;
      document.getElementById('r-name').value  = r.name || '';
      document.getElementById('r-key').value   = r.key  || '';
      document.getElementById('r-color').value = r.badge_color || BADGE_COLORS[0].value;
      document.getElementById('role-modal-title').lastChild.textContent = ' Edit Role';
      updateRolePreview();
      openModal('role-modal');
      setTimeout(() => document.getElementById('r-name').focus(), 100);
    }

    async function saveRole() {
      const btn         = document.getElementById('role-save-btn');
      const id          = document.getElementById('r-id').value;
      const name        = document.getElementById('r-name').value.trim();
      const key         = document.getElementById('r-key').value.trim().toLowerCase().replace(/[^a-z0-9_]/g, '_');
      const badge_color = document.getElementById('r-color').value;
      if (!name) { toast('Role name is required.', 'error'); document.getElementById('r-name').focus(); return; }
      if (!key)  { toast('Role key is required.',  'error'); document.getElementById('r-key').focus();  return; }
      document.getElementById('r-key').value = key;
      btn.disabled = true; btn.textContent = 'Saving…';
      const nextOrder = rolesData.length
        ? Math.max(...rolesData.map(r => r.sort_order || 0)) + 1
        : 1;
      const { error } = id
        ? await db.from('roles').update({ name, key, badge_color }).eq('id', id)
        : await db.from('roles').insert({ name, key, badge_color, sort_order: nextOrder });
      btn.disabled = false; btn.innerHTML = `${IC.save} Save`;
      if (error) { toast('Error: ' + error.message, 'error'); return; }
      toast(id ? 'Role updated.' : 'Role added.', 'success');
      closeModal('role-modal');
      await loadRoles();
    }

    async function deleteRole(id) {
      confirmDialog('Delete this role? Users assigned this role will need to be updated manually.', async () => {
        const { error } = await db.from('roles').delete().eq('id', id);
        if (error) { toast('Error: ' + error.message, 'error'); return; }
        toast('Role deleted.', 'success');
        await loadRoles();
      });
    }
	
	function openTeamPinModal() {
      document.getElementById('team-pin-new').value = '';
      document.getElementById('team-pin-confirm').value = '';
      document.getElementById('team-pin-error').style.display = 'none';
      openModal('team-pin-modal');
      setTimeout(() => document.getElementById('team-pin-new').focus(), 50);
    }
    
    async function saveTeamPin() {
      const newPin     = document.getElementById('team-pin-new').value;
      const confirmPin = document.getElementById('team-pin-confirm').value;
      const err        = document.getElementById('team-pin-error');
      const btn        = document.getElementById('team-pin-save-btn');
    
      err.style.display = 'none';
    
      if (!newPin || newPin.length < 4) {
        err.textContent = 'PIN must be at least 4 characters.';
        err.style.display = 'block';
        return;
      }
      if (newPin !== confirmPin) {
        err.textContent = 'PINs do not match.';
        err.style.display = 'block';
        return;
      }
    
      btn.disabled = true;
      btn.textContent = 'Saving…';
      const { error } = await db.rpc('set_admin_pin', { new_pin: newPin });
      btn.disabled = false;
      btn.textContent = 'OK';
    
      if (error) {
        err.textContent = 'Error: ' + error.message;
        err.style.display = 'block';
        return;
      }
    
      closeModal('team-pin-modal');
      toast('Team PIN updated.', 'success');
    }	

    initLayout('Admin');

    // If we were sent back here from the Workflow Tester, land on that tab directly.
    window.addEventListener('DOMContentLoaded', () => {
      const params = new URLSearchParams(window.location.search);
      if (params.get('tab') === 'adminsettings') {
        setTimeout(() => {
          const archiveSel = document.getElementById('archive-project-select');
      if (archiveSel && !archiveSel.dataset.loaded) {
        db.from('projects').select('id,name,code').order('code').then(({ data }) => {
          archiveSel.innerHTML = `<option value="">— Select a project —</option>` +
            (data || []).map(p => `<option value="${p.id}" data-code="${p.code}">${p.code} — ${p.name}</option>`).join('');
          archiveSel.dataset.loaded = '1';
        });
      }

      const btn = [...document.querySelectorAll('.tab-btn')].find(b => b.textContent.trim() === 'Admin Settings');
          if (btn) switchTab('adminsettings', btn);
        }, 300); // small delay so pageInit's DOM has rendered first
      }
    });
  </script>
</body>
</html>
