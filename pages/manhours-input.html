    function confirmDrawingModal() {
      const sourceRows = modalSource === 'testpkg'  ? tpEntryRows
                       : modalSource === 'calc'      ? calcEntryRows
                       : modalSource === 'materials' ? matEntryRows
                       : entryRows;
      const rowState   = sourceRows.find(r => r.id === modalTargetRowId);
      if (!rowState) { closeDrawingModal(); return; }
    
      // Validate: IFC re-issues must have a reason
      const ifcStep   = modalSource === 'testpkg'  ? TP_IFC_STEP_NAME
                      : modalSource === 'calc'      ? null
                      : modalSource === 'materials' ? null
                      : IFC_STEP_NAME;
      const srcList   = modalSource === 'testpkg'  ? tpDrawingsList
                      : modalSource === 'calc'      ? calcsList
                      : modalSource === 'materials' ? materialsList
                      : drawingsList;
      const stepsArr2 = modalSource === 'testpkg'  ? TP_STEPS
                      : modalSource === 'calc'      ? CALC_STEPS
                      : modalSource === 'materials' ? MAT_STEPS
                      : WORKFLOW_STEPS;
      const isRevMode = stepsArr2.some(s => s.name === rowState.step && s.is_revision === true);
      if (isRevMode) {
        const missingReason = modalTempSelected.find(s => !s.reason_id);
        if (missingReason) {
          const d = srcList.find(x => x.id === missingReason.id);
          toast(`Please select a revision type for ${d?.drawing_number || 'the re-issued item'}.`, 'error');
          return;
        }
      }
    
      // NEW — gate on is_issuance
      const isIssuanceStep = stepsArr2.some(s => s.name === rowState.step && s.is_issuance === true);
      if (isIssuanceStep) {
        if (!modalTempSelected.length) {
          toast('Please select at least one document first.', 'error');
          return;
        }
        openEtdModal(rowState.etd_no || '');
        return; // wait for the ETD modal's OK — finalizeDrawingModalSelection() picks up from here
      }
    
      finalizeDrawingModalSelection(rowState.etd_no || null);
    }
    
    // NEW — the part that used to run at the end of confirmDrawingModal().
    // Called directly for non-issuance steps, or from confirmEtdModal() for issuance steps.
    function finalizeDrawingModalSelection(etdNo) {
      const sourceRows = modalSource === 'testpkg'  ? tpEntryRows
                       : modalSource === 'calc'      ? calcEntryRows
                       : modalSource === 'materials' ? matEntryRows
                       : entryRows;
      const rowState = sourceRows.find(r => r.id === modalTargetRowId);
      if (!rowState) { closeDrawingModal(); closeEtdModal(); return; }
    
      rowState.selectedDrawings = [...modalTempSelected]; // [{id, reason_id}]
      rowState.etd_no = etdNo || null;
    
      updatePickerSummary(modalTargetRowId, modalSource);
      if (modalSource === 'testpkg') refreshTpStepOptions(modalTargetRowId);
      else if (modalSource === 'calc' || modalSource === 'materials') { /* no step-lock logic needed */ }
      else { refreshStepOptions(modalTargetRowId); }
      updateTotals();
      closeEtdModal();
      closeDrawingModal();
    }

    function refreshStepOptions(rowId) {
      const rowState = entryRows.find(r => r.id === rowId);
      if (!rowState) return;

      const allCompleted = new Set();
      rowState.selectedDrawings.forEach(sel => {
        const id = sel.id ?? sel; // support both {id} and plain id
        const d = drawingsList.find(x => x.id === id);
        if (d) d.completedSteps.forEach(s => allCompleted.add(s));
      });

      const select = document.getElementById('step-' + rowId);
      if (!select) return;

      const currentStep = rowState.step;
      // IFC locks after first use. Revision-cycle steps (Revision, Check Revision,
      // Issuance of Revision, etc.) NEVER lock — any of them can be used multiple times.
      const stepsToDisable = [...allCompleted].filter(s => !REVISION_STEP_NAMES.has(s));
      select.innerHTML = buildStepOptions(currentStep, stepsToDisable);

      if (allCompleted.has(currentStep) && !REVISION_STEP_NAMES.has(currentStep)) {
        const nextAvailable = VISIBLE_STEPS.find(s => !allCompleted.has(s));
        if (nextAvailable) {
          select.value = nextAvailable;
          rowState.step = nextAvailable;
          toggleManhoursByStep(rowId);
        }
      }
    }

    function refreshTpStepOptions(rowId) {
      const rowState = tpEntryRows.find(r => r.id === rowId);
      if (!rowState) return;

      const allCompleted = new Set();
      rowState.selectedDrawings.forEach(sel => {
        const id = sel.id ?? sel;
        const d = tpDrawingsList.find(x => x.id === id);
        if (d) d.completedSteps.forEach(s => allCompleted.add(s));
      });

      const select = document.getElementById('step-' + rowId);
      if (!select) return;

      const currentStep = rowState.step;
      const stepsToDisable = [...allCompleted].filter(s => !TP_REVISION_STEP_NAMES.has(s));
      select.innerHTML = buildTpStepOptions(currentStep, stepsToDisable);

      if (allCompleted.has(currentStep) && !TP_REVISION_STEP_NAMES.has(currentStep)) {
        const nextAvailable = TP_VISIBLE_STEPS.find(s => !allCompleted.has(s));
        if (nextAvailable) {
          select.value = nextAvailable;
          rowState.step = nextAvailable;
          toggleTpManhoursByStep(rowId);
        }
      }
    }

    // ── PICKER SUMMARY ─────────────────────────────────────
    function updatePickerSummary(rowId, source) {
      source = source || 'drawing';
      const rowState  = (source === 'testpkg' ? tpEntryRows : source === 'calc' ? calcEntryRows : source === 'materials' ? matEntryRows : entryRows).find(r => r.id === rowId);
      if (!rowState) return;
      const count     = rowState.selectedDrawings.length;
      const btn       = document.getElementById('picker-btn-' + rowId);
      const labelEl   = document.getElementById('picker-label-' + rowId);
      const infoEl    = document.getElementById('picker-info-' + rowId);
      const tooltipEl = document.getElementById('picker-tooltip-' + rowId);
      const isPrRow  = source === 'materials' && rowState.selectedDrawings[0]?.pr_no !== undefined;
      const isTbeRow = source === 'materials' && rowState.selectedDrawings[0]?.tbe_no !== undefined;
      const noun      = isPrRow ? 'PR' : isTbeRow ? 'TBE' : source === 'testpkg' ? 'test package' : source === 'calc' ? 'calculation' : source === 'materials' ? 'document' : 'drawing';
      const clickText = source === 'materials' ? 'Click to select document' : source === 'testpkg' ? 'Click to select test packages' : source === 'calc' ? 'Click to select calculations' : 'Click to select drawings';
    
      if (count === 0) {
        if (labelEl)   labelEl.textContent = clickText;
        if (btn)       btn.classList.remove('active');
        if (infoEl)    infoEl.style.display = 'none';
      } else {
        if (labelEl)   labelEl.textContent = 'Click to change selection';
        if (btn)       btn.classList.add('active');
        if (infoEl)    infoEl.style.display = 'inline-flex';
        if (tooltipEl) {
          const countLine = `${count} ${noun}${count > 1 ? 's' : ''} selected`;
          const etdLine   = rowState.etd_no ? `<br>ETD No.: ${rowState.etd_no}` : '';
          tooltipEl.innerHTML = countLine + etdLine;
        }
      }
      updateMhHint(rowId);
    }

    // ── MANHOUR HINT ───────────────────────────────────────
    function updateMhHint(rowId) {
      const rowState = entryRows.find(r => r.id === rowId) || tpEntryRows.find(r => r.id === rowId) || matEntryRows.find(r => r.id === rowId);
      if (!rowState) return;
      const count  = rowState.selectedDrawings.length;
      const mh     = parseFloat(document.getElementById('mh-' + rowId)?.value || 0);
      const hintEl = document.getElementById('mh-hint-' + rowId);
      if (!hintEl) return;
      hintEl.textContent = (count > 1 && mh > 0) ? `÷ ${count} = ${(mh / count).toFixed(2)} hrs each` : '';

    const TODAY_MH_TABLES = [

    async function loadTodayLoggedMH() {
      if (!userProfile?.id) return;

      const now = new Date();
      const todayStart = new Date(now.getFullYear(), now.getMonth(), now.getDate(), 0, 0, 0).toISOString();
      const todayEnd    = new Date(now.getFullYear(), now.getMonth(), now.getDate(), 23, 59, 59).toISOString();

      const fetches = TODAY_MH_TABLES.map(t =>
        db.from(t).select('manhours')
          .eq('user_id', userProfile.id)
          .gte('created_at', todayStart)
          .lte('created_at', todayEnd)
          .then(r => r.data || [])
      );

      const results = await Promise.all(fetches);
      todayLoggedMH = results.flat().reduce((sum, r) => sum + (parseFloat(r.manhours) || 0), 0);
      renderTodayMhSubline();
    }

    function renderTodayMhSubline() {
      const el = document.getElementById('today-logged-subline');

      el.textContent = `Already logged: ${todayLoggedMH.toFixed(1)} hrs`;

    function filterModelPicker(rowId) {
      const posId  = document.getElementById('model-pos-' + rowId)?.value || '';
      const target = targetsList.find(t => t.id === posId);
      const discId = target?.discipline_id || userProfile?.discipline_id || '';

      const sel    = document.getElementById('model-id-' + rowId);
      if (!sel) return;
      Array.from(sel.options).forEach(opt => {
        if (!opt.value) return;
        const discMatch = discId ? opt.dataset.disc === discId : true;
        const projMatch = projId ? opt.dataset.project === projId : true;
        opt.hidden = !(discMatch && projMatch);
      });
      sel.value = '';
    }

    function onModelSelect(rowId, modelId) {
      const model = modelsList.find(m => m.id === modelId);
      if (!model) return;
    
      const projSel = document.getElementById('model-proj-' + rowId);
      if (projSel && model.project_id && !projSel.value) {
        projSel.value = model.project_id;
      }
    
      const statusSel = document.getElementById('model-status-' + rowId);
      if (statusSel) {
        const stepProgress = model.step_progress || {};
        statusSel.innerHTML = `<option value="">— Select —</option>` + MODEL_STEPS.map(s => {
          const tons = parseFloat(stepProgress[s.name] || 0);
          const target = getModelAreaTargetTons(model.project_id, model.discipline_id, s.name, model.area);
          const pct = (tons > 0 && target && target > 0) ? Math.min(100, (tons / target) * 100) : null;
          const label = pct != null
            ? `${esc(s.name)} - ${pct.toFixed(0)}%`
            : (tons > 0 ? `${esc(s.name)} - ${tons.toFixed(1)}t (no target)` : esc(s.name));
          return `<option value="${s.name}">${label}</option>`;
        }).join('');
        statusSel.value = model.status;
      }
    
      updateModelProgressHint(rowId);
    }

	function updateModelProgressHint(rowId) {
      const hintEl = document.getElementById('model-progress-hint-' + rowId);
      if (!hintEl) return;
    
      const modelId = document.getElementById('model-id-' + rowId)?.value;
      const stepName = document.getElementById('model-status-' + rowId)?.value;
      const model = modelsList.find(m => m.id === modelId);
      if (!model || !stepName) { hintEl.textContent = ''; return; }
    
      const tons = parseFloat((model.step_progress || {})[stepName] || 0);
      const target = getModelAreaTargetTons(model.project_id, model.discipline_id, stepName, model.area);
    
      if (target && target > 0) {
        const pct = Math.min(100, (tons / target) * 100);
        hintEl.innerHTML = `Progress: <strong>${pct.toFixed(0)}%</strong> (${tons.toFixed(1)} / ${target.toFixed(1)} MT)`;

        hintEl.textContent = tons > 0 ? `${tons.toFixed(1)} t logged — no target tonnage set for this area/step` : 'No target tonnage set for this area/step';

async function saveAllEntries(addMore = false) {

  // Determine which blocks are "touched" — has the user actually entered anything?

    r.selectedDrawings.length > 0 ||
    parseFloat(document.getElementById('mh-' + r.id)?.value || 0) > 0
  );
  const tpBlockTouched = tpEntryRows.some(r =>

    parseFloat(document.getElementById('mh-' + r.id)?.value || 0) > 0

    document.getElementById('model-id-' + r.id)?.value ||
    parseFloat(document.getElementById('model-mh-' + r.id)?.value || 0) > 0

  // At least one block must have input
  if (!drawingBlockTouched && !tpBlockTouched && !calcBlockTouched && !matBlockTouched && !oaBlockTouched && !maBlockTouched && !modelBlockTouched && !inqBlockTouched) {
    toast('Please fill in at least one activity before saving.', 'error'); return;
  }

  // Validate only touched blocks — skip empty ones entirely
  if (drawingBlockTouched) {
    for (const rowState of entryRows) {

      const mhExempt = !stepRequiresManhours(rowState.step, WORKFLOW_STEPS);
      const mh = parseFloat(document.getElementById('mh-' + rowState.id)?.value || 0);
      if (!mhExempt && (!mh || mh <= 0)) {
        toast('Drawing Preparation: enter valid manhours (> 0) for every row.', 'error'); return;
      }
      if (!document.getElementById('pos-' + rowState.id)?.value) {
        toast('Drawing Preparation: please select a position for every row.', 'error'); return;
      }
    }
  }
  
  if (tpBlockTouched) {
    for (const rowState of tpEntryRows) {
      if (!rowState.project_id) {
        toast('Test Package: please select a project for every row.', 'error'); return;
      }
      if (!rowState.selectedDrawings.length) {
        toast('Test Package: please select test packages for every row, or remove empty rows.', 'error'); return;
      }
      const isIssuance = TP_STEPS.some(s => s.name === rowState.step && s.is_issuance === true);
      if (isIssuance && !rowState.etd_no) {
        toast(`Test Package: ETD No. is required for "${rowState.step}". Please re-open the document picker for that row.`, 'error'); return;
      }	  
      const mhExempt = !stepRequiresManhours(rowState.step, TP_STEPS);
      const mh = parseFloat(document.getElementById('mh-' + rowState.id)?.value || 0);
      if (!mhExempt && (!mh || mh <= 0)) {
        toast('Test Package: enter valid manhours (> 0) for every row.', 'error'); return;
      }
      if (!document.getElementById('pos-' + rowState.id)?.value) {
        toast('Test Package: please select a position for every row.', 'error'); return;
      }

  if (oaBlockTouched) {

  if (maBlockTouched) {
    for (const row of miscActivityRows) {
      const projectId  = document.getElementById('ma-proj-' + row.id)?.value;
      const activityId = document.getElementById('ma-act-' + row.id)?.value;
      const mh = parseFloat(document.getElementById('ma-mh-' + row.id)?.value || 0);
      const posId = document.getElementById('ma-pos-' + row.id)?.value;
      if (!projectId) { toast('Miscellaneous Activities: please select a project for every row.', 'error'); return; }
      if (!activityId) { toast('Miscellaneous Activities: please select an activity for every row, or remove empty rows.', 'error'); return; }
      if (!mh || mh <= 0) { toast('Miscellaneous Activities: enter valid manhours (> 0) for every row.', 'error'); return; }
      if (!posId) { toast('Miscellaneous Activities: please select a position for every row.', 'error'); return; }
    }
  }
  
  if (inqBlockTouched) {
    for (const row of inquiryRows) {
      const inqId      = document.getElementById('inq-ctrl-' + row.id)?.value;
      const activityId = document.getElementById('inq-act-' + row.id)?.value;
      const mh         = parseFloat(document.getElementById('inq-mh-' + row.id)?.value || 0);
      if (!inqId) { toast('Project Inquiry: please select a control number for every row.', 'error'); return; }
      if (!activityId) { toast('Project Inquiry: please select an activity for every row.', 'error'); return; }
      if (!mh || mh <= 0) { toast('Project Inquiry: enter valid manhours (> 0) for every row.', 'error'); return; }
      if (!document.getElementById('inq-pos-' + row.id)?.value) { toast('Project Inquiry: please select a position for every row.', 'error'); return; }
    }
  }

  if (modelBlockTouched) {
    for (const row of modelRows) {
      const projectId = document.getElementById('model-proj-' + row.id)?.value;
      const modelId = document.getElementById('model-id-' + row.id)?.value;
      const tons = parseFloat(document.getElementById('model-tons-' + row.id)?.value || 0);
      if (!projectId) { toast('3D Model Preparation: please select a project for every row.', 'error'); return; }
      if (!modelId) { toast('3D Model Preparation: please select a model for every row, or remove empty rows.', 'error'); return; }
      const modelMh = parseFloat(document.getElementById('model-mh-' + row.id)?.value || 0);
      if (!modelMh || modelMh <= 0) { toast('3D Model Preparation: enter valid manhours (> 0) for every row.', 'error'); return; }
      if (!document.getElementById('model-pos-' + row.id)?.value) { toast('3D Model Preparation: please select a position for every row.', 'error'); return; }
    }
  }
  
  if (calcBlockTouched) {
    for (const rowState of calcEntryRows) {
      if (!rowState.project_id) {
        toast('Engineering Calculation: please select a project for every row.', 'error'); return;
      }
      if (!rowState.selectedDrawings.length) {
        toast('Engineering Calculation: please select a calculation for every row, or remove empty rows.', 'error'); return;
      }
      const isIssuance = CALC_STEPS.some(s => s.name === rowState.step && s.is_issuance === true);
      if (isIssuance && !rowState.etd_no) {
        toast(`Engineering Calculation: ETD No. is required for "${rowState.step}". Please re-open the document picker for that row.`, 'error'); return;
      }	  
      const mhExempt = !stepRequiresManhours(rowState.step, CALC_STEPS);
      const mh = parseFloat(document.getElementById('mh-' + rowState.id)?.value || 0);
      if (!mhExempt && (!mh || mh <= 0)) {
        toast('Engineering Calculation: enter valid manhours (> 0) for every row.', 'error'); return;
      }
      if (!document.getElementById('calc-pos-' + rowState.id)?.value) {
        toast('Engineering Calculation: please select a position for every row.', 'error'); return;
      }
    }
  }

  if (matBlockTouched) {
    for (const rowState of matEntryRows) {
      if (!rowState.project_id) {
        toast('Material Preparation: please select a project for every row.', 'error'); return;
      }
      if (!rowState.selectedDrawings.length) {
        toast('Material Preparation: please select a material for every row, or remove empty rows.', 'error'); return;
      }
      const isIssuance = MAT_STEPS.some(s => s.name === rowState.step && s.is_issuance === true);
      if (isIssuance && !rowState.etd_no) {
        toast(`Material Preparation: ETD No. is required for "${rowState.step}". Please re-open the document picker for that row.`, 'error'); return;
      }	  
      const mhExempt = !stepRequiresManhours(rowState.step, MAT_STEPS);
      const mh = parseFloat(document.getElementById('mh-' + rowState.id)?.value || 0);
      if (!mhExempt && (!mh || mh <= 0)) {
        toast('Material Preparation: enter valid manhours (> 0) for every row.', 'error'); return;
      }
      if (!document.getElementById('mat-pos-' + rowState.id)?.value) {
        toast('Material Preparation: please select a position for every row.', 'error'); return;
      }
    }
  }

  const btn = document.getElementById('save-btn');
  if (btn) { btn.innerHTML = `<div style="width:14px;height:14px;border:2px solid #fff;border-top-color:transparent;border-radius:50%;animation:spin .6s linear infinite;"></div> Saving…`; btn.disabled = true; }

  try {
  
  // ── Save Drawing Preparation rows ──
  if (drawingBlockTouched) {
    const records = [];
    // Ordered per-drawing list of steps that participate in the IFA-cycle -> IFC ->
    // post-IFC-revision counter, so they can be replayed in firing order below.
    const revisionCycleEvents = {}; // drawingId -> [stepName, stepName, ...]
   for (const rowState of entryRows) {
      const rawMh  = parseFloat(document.getElementById('mh-' + rowState.id).value);
      const mh     = stepRequiresManhours(rowState.step, WORKFLOW_STEPS) ? (isNaN(rawMh) ? 0 : rawMh) : 0;
      const count  = rowState.selectedDrawings.length;
      const mhEach = parseFloat((mh / count).toFixed(4));
      const isIfc      = rowState.step === IFC_STEP_NAME && !!IFC_STEP_NAME;
      const isRevision = WORKFLOW_STEPS.some(s => s.name === rowState.step && s.is_revision === true);
      // Revision cycles are always treated as complete — they're exempt from the
      // "already logged" gate anyway and shouldn't be left dangling "in progress."
      const isComplete = isRevision ? true : isRowStepComplete(rowState.id);
      const targetId  = document.getElementById('pos-' + rowState.id)?.value || null;
      const posTarget = targetId ? targetsList.find(t => t.id === targetId) : null;
      const discId    = posTarget?.discipline_id || null;

      for (const sel of rowState.selectedDrawings) {
        const drawingId  = sel.id ?? sel;
        const reasonId   = sel.reason_id || null;
		const revisionDescription = sel.revision_description || null;
        const drawing    = drawingsList.find(d => d.id === drawingId);
        const isReIssue  = isRevision;

        // Skip already-completed steps, but never skip Revision (can repeat)
        if (!isRevision && drawing && drawing.completedSteps.includes(rowState.step)) {
          toast(`${drawing.drawing_number} already has "${rowState.step}" logged. Skipped.`, 'info');
          continue;
        }

        records.push({
          drawing_id: drawingId,
          source_table: drawing?.source_table || null,
          user_id: userProfile.id,
          step_done: rowState.step,
          is_step_complete: isComplete,
          manhours: mhEach,
          project_id: rowState.project_id || null,
          discipline_id: discId,
          target_id: targetId,
          revision_reason_id: isReIssue ? reasonId : null,
		  revision_description: isReIssue ? revisionDescription : null,
		  etd_no: rowState.etd_no || null,
          remarks: null
        });

        if (rowState.step === IFA_STEP_NAME || rowState.step === IFA_ORIGIN_REVISION_STEP_NAME
            || rowState.step === IFC_STEP_NAME || rowState.step === ORIGIN_REVISION_STEP_NAME
            || rowState.step === AS_BUILT_ISSUED_STEP_NAME || rowState.step === AS_BUILT_ORIGIN_REVISION_STEP_NAME) {
          (revisionCycleEvents[drawingId] = revisionCycleEvents[drawingId] || []).push(rowState.step);
        }
      }
    }

    if (records.length) {
      // Group records by their source table — each type writes to its own activities table
      const bySource = {};
      records.forEach(r => {
        if (!r.source_table) return; // safety guard, shouldn't normally happen
        (bySource[r.source_table] = bySource[r.source_table] || []).push(r);
      });

      for (const [sourceTable, group] of Object.entries(bySource)) {
        const src = DRAWING_SOURCES.find(s => s.table === sourceTable);
        if (!src) continue;
        const payload = group.map(r => ({
          [src.fk]: r.drawing_id,
          user_id: r.user_id,
          step_done: r.step_done,
          is_step_complete: r.is_step_complete,
          manhours: r.manhours,
          project_id: r.project_id,
          discipline_id: r.discipline_id,
          target_id: r.target_id,
          revision_reason_id: r.revision_reason_id,
		  revision_description: r.revision_description,
		  etd_no: r.etd_no,
          remarks: r.remarks,
          ...getCreatedAtOverride()
        }));
        const { error } = await db.from(src.activities).insert(payload);
        if (error) { toast(error.message, 'error'); return; }
      }

      const firstStep   = WORKFLOW_STEPS[0]?.name || 'Draft';
      const checkedStep = WORKFLOW_STEPS.find(w => w.name.toLowerCase().includes('check'))?.name || 'Checked';
      const statusUpdates   = {}; // drawingId -> newStatus
      const revisionUpdates = {}; // drawingId -> newRevisionCode (static-code steps only)

      records.filter(r => r.is_step_complete && !REVISION_STEP_NAMES.has(r.step_done) && !AS_BUILT_STATUS_FROZEN_STEP_NAMES.has(r.step_done)).forEach(r => {
        const current = statusUpdates[r.drawing_id];
        const currentOrder = WORKFLOW_STEPS.find(w => w.name === current)?.sort_order ?? -1;
        const newOrder     = WORKFLOW_STEPS.find(w => w.name === r.step_done)?.sort_order ?? -1;
        if (newOrder > currentOrder) statusUpdates[r.drawing_id] = r.step_done;
      });

      // Static revision-code copy — unchanged for steps outside the IFA/IFC counter
      // (Prepared, Checked, or anything else configured before "Issued for Approval").
      // Issued for Approval / Issued for Construction are excluded here on purpose —
      // they're handled by the counter-driven block further down instead.
      records
        .filter(r => !REVISION_STEP_NAMES.has(r.step_done) && !AS_BUILT_STATUS_FROZEN_STEP_NAMES.has(r.step_done) && r.step_done !== IFA_STEP_NAME && r.step_done !== IFC_STEP_NAME)
        .forEach(r => {
          const step = WORKFLOW_STEPS.find(w => w.name === r.step_done);
          if (step?.revision_code) {
            const current = revisionUpdates[r.drawing_id];
            const currentOrder = WORKFLOW_STEPS.find(w => w.revision_code === current)?.sort_order ?? -1;
            if (step.sort_order > currentOrder) revisionUpdates[r.drawing_id] = step.revision_code;
          }
        });

      // IFA-cycle -> IFC -> post-IFC-revision counter setup (mirrors Calculations)
      const ifaBaseCode = WORKFLOW_STEPS.find(s => s.name === IFA_STEP_NAME)?.revision_code || 'C';
      const ifcBaseCode = WORKFLOW_STEPS.find(s => s.name === IFC_STEP_NAME)?.revision_code || '0';
      const ifaTrackIsNumeric = isNumericCode(ifaBaseCode);
      const ifcTrackPadWidth  = ifaTrackIsNumeric ? numericPadWidth(ifaBaseCode) : numericPadWidth(ifcBaseCode);
      const formatIfcNumber   = (n) => ifcTrackPadWidth ? String(n).padStart(ifcTrackPadWidth, '0') : String(n);
      const asBuiltPadWidth  = AS_BUILT_BASE_CODE ? numericPadWidth(AS_BUILT_BASE_CODE) : 0;
      const formatAsBuiltNumber = (n) => asBuiltPadWidth ? String(n).padStart(asBuiltPadWidth, '0') : String(n);

      for (const [sourceTable, group] of Object.entries(bySource)) {
        const draftIds = group.filter(r => r.step_done === firstStep).map(r => r.drawing_id);
        if (draftIds.length) {
          await db.from(sourceTable).update({ created_by: userProfile.id }).in('id', draftIds);
        }

        const checkIds = group.filter(r => r.step_done === checkedStep).map(r => r.drawing_id);
        if (checkIds.length) {
          await db.from(sourceTable).update({ checked_by: userProfile.id }).in('id', checkIds);
        }

        const idsInThisSource = new Set(group.map(r => r.drawing_id));

        for (const drawingId of idsInThisSource) {
          const newStatus = statusUpdates[drawingId];
          if (newStatus) {
            const { data: existing } = await db.from(sourceTable).select('status').eq('id', drawingId).single();
            const existingOrder = WORKFLOW_STEPS.find(w => w.name === existing?.status)?.sort_order ?? -1;
            const newOrder      = WORKFLOW_STEPS.find(w => w.name === newStatus)?.sort_order ?? -1;
            if (newOrder > existingOrder) {
              await db.from(sourceTable).update({ status: newStatus }).eq('id', drawingId);
            }
          }

          const newRevision = revisionUpdates[drawingId];
          if (newRevision) {
            const { data: existing } = await db.from(sourceTable).select('revision').eq('id', drawingId).single();
            const existingOrder = WORKFLOW_STEPS.find(w => w.revision_code === existing?.revision)?.sort_order ?? -1;
            const newOrder      = WORKFLOW_STEPS.find(w => w.revision_code === newRevision)?.sort_order ?? -1;
            if (newOrder > existingOrder) {
              await db.from(sourceTable).update({ revision: newRevision }).eq('id', drawingId);
            }
          }

          // Replay this drawing's IFA/IFC counter events (in firing order) on top of
          // whatever revision_number is already persisted from prior save actions.
          const events = revisionCycleEvents[drawingId];
          if (events && events.length) {
            const { data: existing } = await db.from(sourceTable).select('revision_number').eq('id', drawingId).single();
            let counter = existing?.revision_number ?? 0;

            for (const step of events) {

            }

              await db.from(sourceTable).update({ revision_number: counter, revision: newRevisionText }).eq('id', drawingId);

  // ── Save Test Package rows ──

            || rowState.step === TP_AS_BUILT_ISSUED_STEP_NAME || rowState.step === TP_AS_BUILT_ORIGIN_REVISION_STEP_NAME) {

              if (step.sort_order > currentOrder) revisionUpdates[r.test_package_drawing_id] = step.revision_code;

          if (newOrder > existingOrder) {
            await db.from('test_package_drawings').update({ revision: newRevision }).eq('id', tpId);

        const tpIfaBaseCode = TP_STEPS.find(s => s.name === TP_IFA_STEP_NAME)?.revision_code || 'C';
        const tpIfcBaseCode = TP_STEPS.find(s => s.name === TP_IFC_STEP_NAME)?.revision_code || '0';
        const tpIfaTrackIsNumeric = isNumericCode(tpIfaBaseCode);
        const tpIfcTrackPadWidth  = tpIfaTrackIsNumeric ? numericPadWidth(tpIfaBaseCode) : numericPadWidth(tpIfcBaseCode);
        const tpFormatIfcNumber   = (n) => tpIfcTrackPadWidth ? String(n).padStart(tpIfcTrackPadWidth, '0') : String(n);
        const tpAsBuiltPadWidth = TP_AS_BUILT_BASE_CODE ? numericPadWidth(TP_AS_BUILT_BASE_CODE) : 0;
        const tpFormatAsBuiltNumber = (n) => tpAsBuiltPadWidth ? String(n).padStart(tpAsBuiltPadWidth, '0') : String(n);

        for (const [tpId, events] of Object.entries(tpRevisionCycleEvents)) {

    const discId    = posTarget?.discipline_id || null;

    for (const sel of rowState.selectedDrawings) {

	  const revisionDescription = sel.revision_description || null;
      const calc      = calcsList.find(c => c.id === calcId);

      // Skip already-completed steps, but never skip Revision (can repeat)
      if (!isRevision && calc && calc.completedSteps.includes(rowState.step)) {
        toast(`${calc.drawing_number} already has "${rowState.step}" logged. Skipped.`, 'info');
        continue;
      }

      calcRecords.push({
        eng_calculation_id:   calcId,
        user_id:              userProfile.id,
        step_done:            rowState.step,
        is_step_complete:     isComplete,

		revision_description: isReIssue ? revisionDescription : null,
		etd_no:               rowState.etd_no || null,
        ...getCreatedAtOverride(),
      });
    }
  }

  if (calcRecords.length) {
    const byCalc = {};
    calcRecords.forEach(r => (byCalc[r.eng_calculation_id] = byCalc[r.eng_calculation_id] || []).push(r));
  
    const ifaBaseCode = CALC_STEPS.find(s => s.name === CALC_IFA_STEP_NAME)?.revision_code || 'C';
    const ifcBaseCode = CALC_STEPS.find(s => s.name === CALC_IFC_STEP_NAME)?.revision_code || '0';
    const ifaTrackIsNumeric = isNumericCode(ifaBaseCode);
    const ifcTrackPadWidth = ifaTrackIsNumeric ? numericPadWidth(ifaBaseCode) : numericPadWidth(ifcBaseCode);
    const formatIfcNumber = (n) => ifcTrackPadWidth ? String(n).padStart(ifcTrackPadWidth, '0') : String(n);

      if (!calc) continue;
  
      let cycles = Array.isArray(calc.ifa_cycles) ? [...calc.ifa_cycles] : (calc.ifa_cycles ? JSON.parse(calc.ifa_cycles) : []);
      let ifcRevision = calc.ifc_revision;
      let dateIfc     = calc.date_ifc;

    if (isComplete) {

        const model = modelsList.find(m => m.id === modelId);

        const lastStatus = Object.keys(stepTons)
         .filter(s => stepTons[s] > 0)
         .sort((a, b) => (MODEL_STEPS.find(x => x.name === a)?.sort_order ?? 0) - (MODEL_STEPS.find(x => x.name === b)?.sort_order ?? 0))
         .pop() || Object.keys(stepTons)[0];
        const updatePayload = { status: lastStatus };

        // Revision code — unchanged from before
        let bestStep = null;
        for (const stepName of Object.keys(stepTons)) {
          if (stepTons[stepName] <= 0) continue;
          const stepDef = MODEL_STEPS.find(s => s.name === stepName);
          if (!stepDef?.revision_code) continue;
          if (!bestStep || stepDef.sort_order > bestStep.sort_order) bestStep = stepDef;
        }
        if (bestStep) {
          const { data: existingModel } = await db.from('models_3d').select('revision').eq('id', modelId).single();
          const existingOrder = MODEL_STEPS.find(w => w.revision_code === existingModel?.revision)?.sort_order ?? -1;
          if (bestStep.sort_order > existingOrder) updatePayload.revision = bestStep.revision_code;
        }

        if (model) {
          const stepProgressMap = { ...(model.step_progress || {}) };
          for (const [stepName, addedTons] of Object.entries(stepTons)) {
            if (addedTons <= 0) continue;
            stepProgressMap[stepName] = parseFloat(stepProgressMap[stepName] || 0) + addedTons;
          }
          updatePayload.step_progress = stepProgressMap;

          const { data: rocItemsData } = await db.from('roc_items')
            .select('roc_step_items(step_name, weight), document_codes(activity_type)')
            .eq('project_id', model.project_id)
            .eq('discipline_id', model.discipline_id);

          // Only count RoC items belonging to the "model" activity type — other

          // project+discipline but must not dilute the model's weight total.
          const modelRocItems = (rocItemsData || []).filter(r => r.document_codes?.activity_type === 'model');
          const allStepWeights = modelRocItems.flatMap(r => r.roc_step_items || []);
          const totalRocWeight = allStepWeights.reduce((s, r) => s + parseFloat(r.weight || 0), 0);
          let earnedProgress = 0;
          if (totalRocWeight > 0) {
            for (const sw of allStepWeights) {
              const stepTonsDone = parseFloat(stepProgressMap[sw.step_name] || 0);
              const targetTons   = getModelAreaTargetTons(model.project_id, model.discipline_id, sw.step_name, model.area);
              const stepPct      = targetTons ? Math.min(1, stepTonsDone / targetTons) : 0;
              earnedProgress += (parseFloat(sw.weight || 0) / totalRocWeight) * stepPct;
            }
          }
          updatePayload.progress = parseFloat((earnedProgress * 100).toFixed(2));
        }

        await db.from('models_3d').update(updatePayload).eq('id', modelId);
      }

      await load3DModels();
      toast(`${modelRecords.length} 3D model entr${modelRecords.length === 1 ? 'y' : 'ies'} saved!`, 'success');
    }

    modelRows = []; modelCounter = 0;
    const modelContainer = document.getElementById('model-rows-container');
    if (modelContainer) modelContainer.innerHTML = '';
    addModelRow();
  }
  }
  } finally {
    if (btn) { btn.innerHTML = `${IC.save} Save Entries`; btn.disabled = false; }
  }

}

    async function logStep(kind, targetId, stepName, opts = {}) {
      const isTP   = kind === 'testpkg';
      const isCalc = kind === 'calc';
      const stepsArr    = isCalc ? CALC_STEPS : (isTP ? TP_STEPS : WORKFLOW_STEPS);
      const addRowFn    = isCalc ? addCalcEntryRow : (isTP ? addTpEntryRow : addEntryRow);
      const containerId = isCalc ? 'calc-rows-container' : (isTP ? 'tp-rows-container' : 'entry-rows-container');
      const stepDef = stepsArr.find(s => s.name === stepName);
      if (!stepDef) { console.error(`❌ Step "${stepName}" not found`); return { step: stepName, data: null, error: 'Step not found' }; }

      if (isCalc) { calcEntryRows.length = 0; }
      else if (isTP) { tpEntryRows.length = 0; }
      else { entryRows.length = 0; }

      const container = document.getElementById(containerId);
      if (container) container.innerHTML = '';
      addRowFn();
      const row = (isCalc ? calcEntryRows : (isTP ? tpEntryRows : entryRows)).slice(-1)[0];
      row.step = stepName;

      if (isCalc) {
        const stepSel = document.getElementById('calc-step-' + row.id);
        if (stepSel) stepSel.value = stepName;
      }

      row.selectedDrawings = [{
        id: targetId,
        reason_id: stepDef.is_revision ? (opts.reasonId || revisionReasonsList[0]?.id || null) : null,
        revision_description: stepDef.is_revision ? (opts.description || `Dummy run – ${stepName}`) : null
      }];
      row.etd_no = stepDef.is_issuance ? (opts.etdNo || `TEST-${Date.now()}`) : '';
      const mhInput = document.getElementById('mh-' + row.id);
      if (mhInput) mhInput.value = 1;
      await saveAllEntries(true);

      let table = isCalc ? 'eng_calculations' : (isTP ? 'test_package_drawings' : drawingsList.find(d => d.id === targetId)?.source_table);
      let data = null;
      if (table) {
        const selectCols = isCalc ? 'status, ifa_cycles, ifc_revision, date_ifc' : 'status, revision, revision_number';
        const res = await db.from(table).select(selectCols).eq('id', targetId).single();
        data = res.data;
      } else {
      }
      return { step: stepName, data };
    }

    async function runFullCycle(kind, targetId, onStep) {
      const stepsArr = (kind === 'testpkg' ? TP_STEPS : kind === 'calc' ? CALC_STEPS : WORKFLOW_STEPS)
        .slice().sort((a, b) => a.sort_order - b.sort_order);
      const results = [];
      for (const s of stepsArr) {
        const r = await logStep(kind, targetId, s.name);
        results.push(r);
        if (typeof onStep === 'function') onStep(r, results);
      }
      return results;
    }

      if (src) await db.from(src.activities).delete().eq(src.fk, drawingId);
      await db.from(sourceTable).update({ status: resetStatus || 'Not Started', revision: null, revision_number: 0, created_by: null, checked_by: null }).eq('id', drawingId);
    }

      panel.style.left = rect.left + 'px';

    let atDocInputSeq = 0;

    async function onAdminTestDocInput() {
      const kind = document.getElementById('at-doc-type').value;
      const name = document.getElementById('at-doc-name').value.trim();
      const list = getAdminTestList(kind);
      const match = list.find(d => d.drawing_number === name);
      const statusEl = document.getElementById('at-doc-status');

      if (!match) {
        statusEl.textContent = name ? '✗ No matching record found' : '';
        statusEl.style.color = 'var(--red)';
        return;
      }

      const seq = ++atDocInputSeq;
      statusEl.textContent = 'Checking current status…';
      statusEl.style.color = 'var(--text-4)';

      const table = kind === 'calc' ? 'eng_calculations' : (kind === 'testpkg' ? 'test_package_drawings' : match.source_table);
      const selectCols = kind === 'calc' ? 'status, ifc_revision, ifa_cycles' : 'status, revision';
      const { data } = await db.from(table).select(selectCols).eq('id', match.id).single();
      if (seq !== atDocInputSeq) return; // a newer keystroke already superseded this lookup

      const revisionDisplay = kind === 'calc'
        ? (data?.ifc_revision ?? (Array.isArray(data?.ifa_cycles) && data.ifa_cycles.length ? data.ifa_cycles[data.ifa_cycles.length - 1].revision : null))
        : data?.revision;

      statusEl.textContent = `✓ Document Found! Current status: ${data?.status || 'Not Started'}, Revision: ${revisionDisplay ?? '—'}`;
      statusEl.style.color = 'var(--green)';
    }

      return { kind, target: match };
