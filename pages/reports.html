<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Reports — EngPro App</title>
  <link rel="stylesheet" href="../css/main.css" />
  <style>
    /* ── REPORT PAGE STYLES ── */
    .report-list { display:flex; flex-direction:column; gap:10px; }
    .report-card {
      display:flex; align-items:center; gap:16px;
      background:var(--bg-4); border:1px solid var(--border);
      border-radius:var(--radius-lg); padding:16px 20px;
      cursor:pointer; transition:border-color .15s, background .15s;
    }
    .report-card:hover { border-color:var(--accent); background:var(--accent-dim); }
    .report-card.disabled:hover { border-color:var(--border); background:var(--bg-4); }
    .report-card.disabled .report-card-title { color:#888; }
    .report-card.disabled .report-card-desc  { color:#666; }
    .report-card.disabled .report-card-icon  { background:rgba(136,136,136,0.08); color:#888; }
    .report-card.disabled > svg:last-child    { color:#999; }
    .report-card-icon { width:40px; height:40px; border-radius:var(--radius); background:var(--accent-dim); display:flex; align-items:center; justify-content:center; color:var(--accent); flex-shrink:0; }
    .report-card-body { flex:1; }
    .report-card-title { font-size:14px; font-weight:600; color:var(--text); }
    .report-card-desc  { font-size:12px; color:var(--text-3); margin-top:2px; }

    /* ── SETTINGS TABLE ── */
    .settings-table { width:100%; border-collapse:collapse; font-size:13px; }
	.settings-table th { color:var(--text-3); font-size:11px; font-weight:700; text-transform:uppercase; letter-spacing:.5px; padding:8px 12px; border:none; border-bottom:2px solid var(--border); }
	.settings-table td { padding:8px 12px; border:none; border-bottom:1px solid var(--border); }
	.settings-table input { width:100%; background:transparent; border:none; outline:none; color:var(--text); font-size:13px; padding:2px 4px; }
	.settings-table input:focus { background:var(--bg-4); border-radius:4px; }
	.settings-table tr:hover td { background:var(--bg-4); }
	.settings-table tbody tr:last-child td { border-bottom:none; }
	
	.status-badge { display:inline-block;padding:2px 8px;border-radius:4px;font-size:11px;font-weight:600; }
    .status-open       { background:rgba(249,115,22,.15);color:#f97316; }
    .status-inprogress { background:rgba(59,130,246,.15);color:#3b82f6; }
    .status-completed  { background:rgba(34,197,94,.15);color:#22c55e; }
    .status-cancelled  { background:rgba(100,116,139,.15);color:#64748b; }

    /* ── PRINT / PDF STYLES ── */
    @media print {
      /* Force background colors (orange, green, blue headers) */
      * {
        -webkit-print-color-adjust: exact !important;
        print-color-adjust: exact !important;
        color-adjust: exact !important;
      }

      html, body {
        margin: 0 !important;
        padding: 0 !important;
        background: #fff !important;
        height: auto !important;
        overflow: visible !important;
      }

      /* Hide everything — the JS clone (#pdf-preview-print) is position:fixed
         so it sits on top and prints correctly */
      body > *:not(#pdf-preview-print):not(#print-overlay) {
        display: none !important;
      }

      #print-overlay { display: none !important; }

      #pdf-preview-print {
        display: block !important;
        position: static !important;
        width: 100% !important;
        margin: 0 !important;
        padding: 0 !important;
        background: #fff !important;
        z-index: auto !important;
      }

      /* Each pdf-page = one physical page */
      .pdf-page {
        display: block !important;
        width: 100% !important;
        margin: 0 !important;
        padding: 10mm !important;
        box-sizing: border-box !important;
        background: #fff !important;
        border: none !important;
        page-break-after: always;
        break-after: page;
        page-break-inside: avoid;
        break-inside: avoid;
      }
      .pdf-page:last-child {
        page-break-after: auto;
        break-after: auto;
      }

      /* Portrait pages (default) */
      @page { size: A3 portrait; margin: 0; }

      /* Landscape — Engineering Deliverables */
      @page land { size: A3 landscape; margin: 0; }
      .pdf-page.landscape { page: land; }
    }
	
	#drawing-list-view .settings-table th {
      white-space: normal;
      word-break: break-word;
      line-height: 1.3;
    }

    /* ── AG&P colour palette (matched to the Excel-exported sample WPR) ── */
    #pdf-preview {
      --ag-gray:   #BFBFBF; /* top-level section title bars, status-box header */
      --ag-orange: #FABF8F; /* table headers + default cell fill (primary AG&P accent) */
      --ag-green:  #D8E4BC; /* identifier column accent — portrait/Highlights pivot tables */
      --ag-blue:   #B8CCE4; /* identifier column accent — landscape Engineering Deliverables tables */
      --ag-border: #000000;
      font-family: Arial, sans-serif;
      font-size: 9px;
      color: #000;
      background: #fff;
    }
    /* Screen preview styles for pdf-page */
    .pdf-page {
      padding: 8mm;
      width: 277mm;
      box-sizing: border-box;
      background: #fff;
      margin-bottom: 12px;
      border: 1px solid #ccc;  /* subtle page border for screen only */
    }
    .pdf-page.landscape {
      width: 400mm;
    }
    .pdf-page:last-child {
      margin-bottom: 0;
    }

    /* Header */
    .pdf-header {
      display:grid; grid-template-columns:120px 1fr auto;
      border:1px solid #000; margin-bottom:6px;
    }
    .pdf-logo-cell {
      border-right:1px solid #000; display:flex;
      align-items:center; justify-content:center; padding:8px;
    }
    .pdf-logo-box {
      width:80px; height:50px; border:2px dashed #999;
      display:flex; align-items:center; justify-content:center;
      font-size:10px; color:#999; font-weight:700;
    }
    .pdf-title-cell {
      display:flex; align-items:center; justify-content:center;
      font-size:16px; font-weight:700; text-transform:uppercase; letter-spacing:1px;
    }
    .pdf-meta-cell {
      border-left:1px solid #000; padding:8px 12px;
      font-size:9px; line-height:1.8; min-width:200px;
    }
    .pdf-meta-cell div { display:flex; gap:4px; }
    .pdf-meta-label { font-weight:700; min-width:80px; }

    /* Section headers — gray top-level bar, orange sub-section bar (matches sample) */
    .pdf-section-header {
      background:var(--ag-gray); border:0.5px solid #000;
      padding:4px 8px; font-weight:700; font-style:italic;
      margin-bottom:0; font-size:9px; color:#000 !important;
    }
    .pdf-subsection-header {
      background:var(--ag-orange); border:0.5px solid #000; border-top:none;
      padding:4px 8px; font-weight:700; font-style:italic;
      margin-bottom:0; font-size:9px; color:#000 !important;
    }

    /* Small "Status / Quantity" summary box */
    .pdf-status-box { border-collapse:collapse; font-size:8px; margin:4px 0 6px; border:0.5px solid #000; }
	.pdf-status-box th, .pdf-status-box td { border:0.5px solid #000; padding:2px 14px; text-align:left; background:#fff; color:#000 !important; }
    .pdf-status-box th { background:var(--ag-orange); font-weight:700; font-style:italic; color:#000 !important; }
    .pdf-status-box td:first-child { font-weight:700; font-style:italic; color:#000 !important; }

    /* Report tables — AG&P orange, with green/blue identifier-column accents */
    .pdf-table { width:100%; border-collapse:collapse; font-size:8px; border:1px solid #000; }
    .pdf-table th, .pdf-table td {
      border:1px solid #000; padding:3px 5px; text-align:center;
      background:var(--ag-orange); color:#000;
    }
    .pdf-table thead { display:table-header-group; } /* repeat header on every printed page */
    .pdf-table tr { page-break-inside:avoid; }
    .pdf-table th { font-weight:700; font-style:italic; color:#000; }
    .pdf-table th.group-header { font-size:9px; color:#000; }
    .pdf-table td.area-col, .pdf-table th.area-col { text-align:left; font-style:italic; color:#000; }

    /* Identifier columns (e.g. "Area / Tank No.") — green accent, portrait pivot tables */
    .pdf-table td.id-col, .pdf-table th.id-col { background:var(--ag-green); text-align:left; font-style:italic; color:#000; }
    /* Identifier columns — blue accent, landscape Engineering Deliverables tables */
    .pdf-table td.id-col-blue, .pdf-table th.id-col-blue { background:var(--ag-blue); color:#000; }

    /* Alternating column-group bands for grouped/pivot tables (doc-code groups) */
    .pdf-table .band-a { background:var(--ag-orange); color:#000; }
    .pdf-table .band-b { background:var(--ag-green); color:#000; }

    .pdf-table tr.total-row td { font-weight:700; font-style:italic; background:var(--ag-orange) !important; color:#000 !important; }
    .pdf-table td.dash { color:#555; }
  </style>
</head>
<body>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="https://cdn.jsdelivr.net/npm/xlsx-js-style/dist/xlsx.bundle.js"></script>
  <script src="../js/supabase.js"></script>
  <script src="../js/utils.js"></script>
  <script src="../js/layout.js"></script>
  <script src="../js/messaging.js"></script>
  <script src="../js/pdf_integration_vercel.js"></script>

  <script>
    const SVG_SM = (p) => `<svg xmlns="http://www.w3.org/2000/svg" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">${p}</svg>`;
    const IC = {
      plus:     SVG_SM('<line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/>'),
      save:     SVG_SM('<path d="M19 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11l5 5v11a2 2 0 0 1-2 2z"/><polyline points="17 21 17 13 7 13 7 21"/><polyline points="7 3 7 8 15 8"/>'),
      trash:    SVG_SM('<polyline points="3 6 5 6 21 6"/><path d="M19 6l-1 14a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2L5 6"/><path d="M10 11v6"/><path d="M14 11v6"/>'),
      settings: SVG_SM('<circle cx="12" cy="12" r="3"/><path d="M12 2v2m0 16v2M2 12h2m16 0h2m-3.22-6.78-1.42 1.42M6.64 17.36l-1.42 1.42m0-11.56 1.42 1.42m8.48 8.48 1.42 1.42"/>'),
      report:   SVG_SM('<path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/><line x1="16" y1="13" x2="8" y2="13"/><line x1="16" y1="17" x2="8" y2="17"/><polyline points="10 9 9 9 8 9"/>'),
      monitor:  SVG_SM('<rect x="2" y="3" width="20" height="14" rx="2"/><line x1="8" y1="21" x2="16" y2="21"/><line x1="12" y1="17" x2="12" y2="21"/>'),
      print:    SVG_SM('<polyline points="6 9 6 2 18 2 18 9"/><path d="M6 18H4a2 2 0 0 1-2-2v-5a2 2 0 0 1 2-2h16a2 2 0 0 1 2 2v5a2 2 0 0 1-2 2h-2"/><rect x="6" y="14" width="12" height="8"/>'),
      back:     SVG_SM('<polyline points="15 18 9 12 15 6"/>'),
    };

    let projectsData    = [];
    let disciplinesData = [];
    let docCodesData    = [];
    let workflowSteps   = [];
    let activeProject   = null;
	let revisionReasonsById = new Map();

    // Shared across Weekly Report and Activity Log — each drawing type's
    // parent table + its corresponding activity-log table.
    const DRAW_SOURCES = [
      { table: 'erection_drawings',     acts: 'erection_drawing_activities'    },
      { table: 'fabrication_drawings',  acts: 'fabrication_drawing_activities' },
      { table: 'support_drawings',      acts: 'support_drawing_activities'     },
      { table: 'weld_map_drawings',     acts: 'weld_map_drawing_activities'    },
      { table: 'test_package_drawings', acts: 'test_package_drawing_activities'},
    ];
	
	// Drawing List config — one entry per document type. `isCalc` marks the
    // one type with a materially different shape (no discipline_id/revision_number
    // on the parent row, no BASE_COLS custom-column pattern differences otherwise).
    const DL_SOURCES = [
      { key: 'erection',     table: 'erection_drawings',     acts: 'erection_drawing_activities',     activityType: 'drawing',      label: 'Erection' },
      { key: 'fabrication',  table: 'fabrication_drawings',  acts: 'fabrication_drawing_activities',  activityType: 'drawing',      label: 'Fabrication' },
      { key: 'support',      table: 'support_drawings',      acts: 'support_drawing_activities',      activityType: 'drawing',      label: 'Support' },
      { key: 'weld_map',     table: 'weld_map_drawings',     acts: 'weld_map_drawing_activities',     activityType: 'drawing',      label: 'Weld Map' },
      { key: 'test_package', table: 'test_package_drawings', acts: 'test_package_drawing_activities', activityType: 'test_package', label: 'Test Package' },
      { key: 'calc',         table: 'eng_calculations',      acts: 'eng_calculation_activities',      activityType: 'calculations', label: 'Engineering Calc', isCalc: true },
    ];
    
    const DL_METADATA_FIELDS = [
      { key: 'no_of_sheets',    col: 'no_of_sheets' },
      { key: 'shop_dia_inch',   col: 'shop_dia_inch' },
      { key: 'field_dia_inch',  col: 'field_dia_inch' },
      { key: 'surface_area_m2', col: 'surface_area_m2' },
      { key: 'weight_kg',       col: 'weight_kg' },
    ];
	
    let activeView      = 'home';
    let loggedInProfile = null;
	
	// Loaded from report_permissions in pageInit(), keyed by report_key.
    // An item with no row here (like drawingList) is open to everyone —
    // matches the default behavior in the admin's Report Permission modal.
    let reportPermissionsByKey = {};

    async function loadReportPermissions() {
      const { data, error } = await db.from('report_permissions').select('report_key, allowed_roles');
      if (error) { console.error('[Reports] Failed to load report_permissions:', error); return; }
      reportPermissionsByKey = {};
      (data || []).forEach(row => { reportPermissionsByKey[row.report_key] = row.allowed_roles || []; });
    }

    function canView(reportKey) {
      const allowed = reportPermissionsByKey[reportKey];
      if (!allowed) return true; // no row = open to all
      return allowed.includes(loggedInProfile?.role);
    }
	
	function preparedByLabel() {
      return loggedInProfile?.full_name || loggedInProfile?.initials || 'Engineering';
    }
	
    async function pageInit(profile) {
      loggedInProfile = profile;
      await loadReportPermissions();
      const showWeekly         = canView('weeklyProgress');
      const showActivity       = canView('activityLog');
      const showInquiry        = canView('inquirySummary');
      const showDrawingList    = canView('drawingList');
      const showReportsTab     = showWeekly || showActivity;
      const showMonitoringTab  = showInquiry || showDrawingList;
      const content = document.getElementById('page-content');
      content.innerHTML = `
        <div class="page-header">
          <h1 style="display:flex;align-items:center;gap:10px;">
            <svg xmlns="http://www.w3.org/2000/svg" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><line x1="18" y1="20" x2="18" y2="10"/><line x1="12" y1="20" x2="12" y2="4"/><line x1="6" y1="20" x2="6" y2="14"/></svg>
            Reports
          </h1>
          <p>Select a project to get started</p>
        </div>

        <!-- Project Selector -->
        <div class="card" style="margin-bottom:20px;">
          <div class="card-body" style="display:flex;align-items:center;gap:16px;flex-wrap:wrap;">
            <div style="font-size:13px;font-weight:600;color:var(--text-2);white-space:nowrap;">Active Project:</div>
            <select id="report-project" onchange="onProjectChange(this.value)" style="flex:1;min-width:200px;max-width:400px;">
              <option value="">— Select Project —</option>
            </select>
          </div>
        </div>

        <!-- Main Report Area -->
        <div id="report-main" style="display:block;">

          <!-- Tabs -->
          <div class="tabs" id="report-tabs">
            ${showReportsTab ? `
            <button class="tab-btn active" onclick="switchReportTab('reports', this)">
              ${IC.report} Reports
            </button>` : ''}
            <button class="tab-btn ${showReportsTab ? '' : 'active'}" onclick="switchReportTab('monitoring', this)">
              ${IC.monitor} Monitoring
            </button>
          </div>

          ${showReportsTab ? `
          <!-- Reports Tab -->
          <div class="tab-panel active" id="tab-reports">
            <div class="report-list">
              ${showWeekly ? `
              <div class="report-card requires-project" onclick="openWeeklyReport()">
                <div class="report-card-icon">
                  <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="18" rx="2"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/></svg>
                </div>
                <div class="report-card-body">
                  <div class="report-card-title">Weekly Progress Report</div>
                  <div class="report-card-desc">Highlights, engineering deliverables by discipline, purchase requisition status, engineering calculations, technical queries, and issues &amp; concerns for a selected week range.</div>
                </div>
                <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="9 18 15 12 9 6"/></svg>
              </div>` : ''}

              ${showActivity ? `
              <div class="report-card requires-project" onclick="openActivityLogReport()">
                <div class="report-card-icon">
                  <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><path d="M3 3v18h18"/><path d="m19 9-5 5-4-4-3 3"/></svg>
                </div>
                <div class="report-card-body">
                  <div class="report-card-title">Activity Log</div>
                  <div class="report-card-desc">Detailed activity history for a custom date range, filterable by discipline and user.</div>
                </div>
                <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="9 18 15 12 9 6"/></svg>
              </div>` : ''}
            </div>
          </div>
          ` : ''}

          <!-- Monitoring Tab -->
          <div class="tab-panel ${showReportsTab ? '' : 'active'}" id="tab-monitoring">
            <div class="report-list">
              ${!showMonitoringTab ? `
              <div style="text-align:center;padding:40px;color:var(--text-4);font-size:13px;">
                You don't have access to any monitoring items yet. Contact an admin if you believe this is a mistake.
              </div>` : ''}
              ${showInquiry ? `
              <div class="report-card" onclick="openInquirySummary()">
                <div class="report-card-icon">
                  <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><rect x="8" y="2" width="8" height="4" rx="1" ry="1"/><path d="M16 4h2a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2h2"/><line x1="9" y1="12" x2="15" y2="12"/><line x1="9" y1="16" x2="15" y2="16"/></svg>
                </div>
                <div class="report-card-body">
                  <div class="report-card-title">Project Inquiry Summary</div>
                  <div class="report-card-desc">Estimated vs. spent manhours per inquiry, with preparer and status.</div>
                </div>
                <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="9 18 15 12 9 6"/></svg>
              </div>` : ''}
              ${showDrawingList ? `
              <div class="report-card requires-project" onclick="openDrawingList()">
                <div class="report-card-icon">
                  <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/><line x1="16" y1="13" x2="8" y2="13"/><line x1="16" y1="17" x2="8" y2="17"/></svg>
                </div>
                <div class="report-card-body">
                  <div class="report-card-title">Drawing List</div>
                  <div class="report-card-desc">Consolidated drawing/document register — erection, fabrication, support, weld map, test package, and engineering calc — filterable by date, discipline, user, type, and step.</div>
                </div>
                <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="9 18 15 12 9 6"/></svg>
              </div>` : ''}
            </div>
          </div>

        </div>

        <!-- Weekly Report View (replaces main when active) -->
        <div id="weekly-view" style="display:none;">
          <div style="display:flex;align-items:center;gap:12px;margin-bottom:20px;flex-wrap:wrap;">
            <button class="btn btn-ghost btn-sm" onclick="closeWeeklyReport()" style="display:flex;align-items:center;gap:5px;">
              ${IC.back} Back
            </button>
            <h2 style="font-size:16px;font-weight:700;color:var(--text);margin:0;flex:1;">Weekly Progress Report</h2>
            <button class="btn btn-primary btn-sm" onclick="generatePDFFromPreview()" style="display:flex;align-items:center;gap:5px;">
              ${IC.print} Print / Export PDF
            </button>
          </div>

          <!-- Week Picker -->
          <div class="card" style="margin-bottom:16px;">
            <div class="card-body" style="display:flex;align-items:flex-end;gap:14px;flex-wrap:wrap;">
              <div class="form-group" style="margin:0;">
                <label>As of Date</label>
                <input type="date" id="report-asof" onchange="recalcWeekRange()" />
              </div>
              <div style="font-size:12px;color:var(--text-3);padding-bottom:9px;">
                Week: <strong id="week-range-display" style="color:var(--text);">—</strong>
              </div>
              <button class="btn btn-primary" onclick="generateWeeklyReport()" style="display:flex;align-items:center;gap:5px;">
                <svg xmlns="http://www.w3.org/2000/svg" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.35-4.35"/></svg>
                Generate
              </button>
            </div>
          </div>
        </div>

        <!-- Activity Log View (replaces main when active) -->

	function toLocalISODate(d) {
      const y   = d.getFullYear();
      const m   = String(d.getMonth() + 1).padStart(2, '0');
      const day = String(d.getDate()).padStart(2, '0');
      return `${y}-${m}-${day}`;
    }
	
    // ── WEEKLY REPORT ─────────────────────────────────────────
    // Snap `dateStr` back to the most recent day matching weekStartDay (0=Sun..6=Sat).
    // Returns { from, to } as 'YYYY-MM-DD' strings (to = from + 6 days).
    function snapToWeekStart(dateStr, weekStartDay) {
      const wsd = Number.isInteger(weekStartDay) ? weekStartDay : 1; // default Monday
      const d = new Date(dateStr + 'T00:00:00');
      const diff = (d.getDay() - wsd + 7) % 7;
      const from = new Date(d); from.setDate(d.getDate() - diff);
      const to   = new Date(from); to.setDate(from.getDate() + 6);
      return { from: toLocalISODate(from), to: toLocalISODate(to) };
    }

    function recalcWeekRange() {
      const asof = document.getElementById('report-asof').value;
      if (!asof) return { from: null, to: null };
      const proj = projectsData.find(p => p.id === activeProject);
      const range = snapToWeekStart(asof, proj?.week_start_day);
      document.getElementById('week-range-display').textContent =
        `${formatDate(range.from)} – ${formatDate(range.to)}`;
      return range;
    }

	// ── MONITORING: PROJECT INQUIRY SUMMARY ─────────────────────
    // Note: this is intentionally NOT scoped to the "Active Project" selector
    // above — project_inquiries.project is a free-text project code column,
    // not a link to the currently selected project, so this summary always
    // shows all inquiries across all projects.

    async function loadProjectInquirySummary() {
      const tbody = document.getElementById('monitoring-inquiry-tbody');
      tbody.innerHTML = `<tr><td colspan="7" style="text-align:center;padding:20px;color:var(--text-4);">Loading…</td></tr>`;

      const [inqRes, actRes, usersRes] = await Promise.all([
        db.from('project_inquiries').select('id, control_number, client, project, estimated_mh, status').order('control_number'),
        db.from('inquiry_activities').select('inquiry_id, user_id, manhours'),
        db.from('users').select('id, full_name, initials'),
      ]);

      if (inqRes.error) {
        console.error('[Monitoring] Failed to load project_inquiries:', inqRes.error);
        tbody.innerHTML = `<tr><td colspan="7" style="text-align:center;padding:20px;color:#c00;">Failed to load data.</td></tr>`;
        return;
      }

      const inquiries  = inqRes.data  || [];
      const activities = actRes.data  || [];
      const usersById  = new Map((usersRes.data || []).map(u => [u.id, u]));

      // Group logged manhours by inquiry_id: total MH spent + the set of
      // distinct users who logged against it (for the "Prepared By" list).
      const byInquiry = new Map();
      activities.forEach(a => {
        if (!a.inquiry_id) return;
        if (!byInquiry.has(a.inquiry_id)) byInquiry.set(a.inquiry_id, { users: new Set(), totalMh: 0 });
        const bucket = byInquiry.get(a.inquiry_id);
        bucket.totalMh += (a.manhours || 0);
        const u = usersById.get(a.user_id);
        if (u) bucket.users.add(u.initials || u.full_name || 'Unknown');
      });

      if (!inquiries.length) {
        tbody.innerHTML = `<tr><td colspan="7" style="text-align:center;padding:20px;color:var(--text-4);">No project inquiries found.</td></tr>`;
        return;
      }

      tbody.innerHTML = inquiries.map(inq => {
        const bucket = byInquiry.get(inq.id);
        const preparedBy = bucket && bucket.users.size ? Array.from(bucket.users).join(', ') : '—';
        const mhSpent    = bucket ? bucket.totalMh : 0;
        const statusCls  = {'Open':'status-open','In Progress':'status-inprogress','Completed':'status-completed','Cancelled':'status-cancelled'}[inq.status] || 'status-open';
        return `
          <tr>
            <td style="text-align:left;">${esc(inq.control_number) || '—'}</td>
            <td style="text-align:left;">${esc(inq.client) || '—'}</td>
            <td style="text-align:left;">${esc(inq.project) || '—'}</td>
            <td style="text-align:left;color:#f97316;font-weight:700;">${parseFloat(inq.estimated_mh || 0).toFixed(1)}</td>
            <td style="text-align:left;">${preparedBy}</td>
            <td style="text-align:left;">${mhSpent.toFixed(1)}</td>
            <td style="text-align:left;"><span class="status-badge ${statusCls}">${esc(inq.status) || 'Open'}</span></td>
          </tr>
        `;
      }).join('');
    }
	
	async function exportInquirySummaryExcel() {
      const [inqRes, actRes, usersRes] = await Promise.all([
        db.from('project_inquiries').select('id, control_number, client, project, estimated_mh, status').order('control_number'),
        db.from('inquiry_activities').select('inquiry_id, user_id, manhours'),
        db.from('users').select('id, full_name, initials'),
      ]);

      const inquiries  = inqRes.data  || [];
      const activities = actRes.data  || [];
      const usersById  = new Map((usersRes.data || []).map(u => [u.id, u]));

      const byInquiry = new Map();
      activities.forEach(a => {
        if (!a.inquiry_id) return;
        if (!byInquiry.has(a.inquiry_id)) byInquiry.set(a.inquiry_id, { users: new Set(), totalMh: 0 });
        const bucket = byInquiry.get(a.inquiry_id);
        bucket.totalMh += (a.manhours || 0);
        const u = usersById.get(a.user_id);
        if (u) bucket.users.add(u.initials || u.full_name || 'Unknown');
      });

      const headers = ['CONTROL NO.', 'CLIENT', 'PROJECTS', 'ESTIMATED MH', 'PREPARED BY', 'MH SPENT', 'REMARKS'];
      const rows = inquiries.map(inq => {
        const bucket = byInquiry.get(inq.id);
        return [
          inq.control_number || '',
          inq.client || '',
          inq.project || '',
          parseFloat(inq.estimated_mh || 0),
          bucket && bucket.users.size ? Array.from(bucket.users).join(', ') : '',
          bucket ? bucket.totalMh : 0,
          inq.status || '',
        ];
      });

      const ORANGE = 'FABF8F';
      const aoa = [
        ['PROJECT INQUIRY SUMMARY', '', '', '', '', '', ''],
        headers,
        ...rows,
      ];
      const ws = XLSX.utils.aoa_to_sheet(aoa);

      ws['!merges'] = [{ s: { r: 0, c: 0 }, e: { r: 0, c: 6 } }];
      ws['!cols'] = [{ wch: 18 }, { wch: 20 }, { wch: 45 }, { wch: 14 }, { wch: 24 }, { wch: 12 }, { wch: 12 }];

      // Row heights: title + header rows = 25pt, all data rows = 18pt
      ws['!rows'] = [
        { hpt: 25 },
        { hpt: 25 },
        ...rows.map(() => ({ hpt: 18 })),
      ];

      const thinBorder = { top:{style:'thin'}, bottom:{style:'thin'}, left:{style:'thin'}, right:{style:'thin'} };

      // Title row
      for (let c = 0; c <= 6; c++) {
        const ref = XLSX.utils.encode_cell({ r: 0, c });
        if (!ws[ref]) ws[ref] = { t: 's', v: '' };
        ws[ref].s = { fill: { fgColor: { rgb: ORANGE } }, font: { bold: true, sz: 11 }, alignment: { horizontal: 'center', vertical: 'center' }, border: thinBorder };
      }
      // Header row
      for (let c = 0; c <= 6; c++) {
        const ref = XLSX.utils.encode_cell({ r: 1, c });
        ws[ref].s = { fill: { fgColor: { rgb: ORANGE } }, font: { bold: true }, alignment: { horizontal: 'center', vertical: 'center' }, border: thinBorder };
      }
      // Data rows — font size 11 throughout; center-aligned except Client (c=1) and Projects (c=2)
      for (let r = 0; r < rows.length; r++) {
        const rowIdx = r + 2;
        for (let c = 0; c <= 6; c++) {
          const ref = XLSX.utils.encode_cell({ r: rowIdx, c });
          if (!ws[ref]) continue;
          const isLeftCol = (c === 1 || c === 2); // Client, Projects
          const style = {
            alignment: { horizontal: isLeftCol ? 'left' : 'center', vertical: 'center' },
            border: thinBorder,
            font: { sz: 11 },
          };
          if (c === 3) style.font = { sz: 11, color: { rgb: 'F97316' }, bold: true };                  // Estimated MH
          ws[ref].s = style;
        }
      }

      const wb = XLSX.utils.book_new();
      XLSX.utils.book_append_sheet(wb, ws, 'Project Inquiry Summary');
      XLSX.writeFile(wb, `Project_Inquiry_Summary_${new Date().toISOString().slice(0,10)}.xlsx`);
    }

      ];
    
      // Header 37.5pt, body rows 25pt
      ws['!rows'] = [{ hpt: 37.5 }, ...rows.map(() => ({ hpt: 25 }))];
    
      const thinBorder = { top:{style:'thin'}, bottom:{style:'thin'}, left:{style:'thin'}, right:{style:'thin'} };

      for (let c = 0; c < headers.length; c++) {
        const ref = XLSX.utils.encode_cell({ r: 0, c });

          fill: { fgColor: { rgb: GREY } },
          font: { bold: true, sz: 11 },
          alignment: { horizontal: 'center', vertical: 'center', wrapText: true },
          border: thinBorder,
        };
      }
      for (let r = 0; r < rows.length; r++) {
        for (let c = 0; c < headers.length; c++) {
          const ref = XLSX.utils.encode_cell({ r: r + 1, c });
          if (!ws[ref]) ws[ref] = { t: 's', v: '' };
          const isLeftCol = (c === 1 || c === 2); // Doc No., Title
          ws[ref].s = {
            alignment: { horizontal: isLeftCol ? 'left' : 'center', vertical: 'center' },
            border: thinBorder,
            font: { sz: 11 },
          };
        }
      }
    
      const proj      = projectsData.find(p => p.id === activeProject);
      const discId    = document.getElementById('dl-discipline').value;
      const discCode  = discId ? (disciplinesData.find(d => d.id === discId)?.code || 'ALL') : 'ALL';
      const dateStr   = (document.getElementById('dl-date').value || new Date().toISOString().slice(0,10)).replace(/-/g, '');
      const filename  = `${proj?.code || 'PROJ'}-${discCode}-DLIST-${dateStr}.xlsx`;
    
      const wb = XLSX.utils.book_new();
      XLSX.utils.book_append_sheet(wb, ws, 'Drawing List');
      XLSX.writeFile(wb, filename);
    }

	function formatDateDMY(dateStr) {
      if (!dateStr) return '';
      const d = new Date(dateStr + 'T00:00:00');
      if (isNaN(d)) return dateStr;
      const day = String(d.getDate()).padStart(2, '0');
      const month = d.toLocaleString('en-US', { month: 'short' });
      const year = d.getFullYear();
      return `${day}-${month}-${year}`;
    }
	
	async function generateDrawingList() {
      const date         = document.getElementById('dl-date').value;
      if (!date) { toast('Please select a date.', 'error'); return; }
      const disciplineId = document.getElementById('dl-discipline').value || null;
      const userId        = document.getElementById('dl-user').value || null;
      const typeKey        = document.getElementById('dl-doctype').value || null;
      const stepDone        = document.getElementById('dl-step').value || null;
    
      const tbody = document.getElementById('drawing-list-tbody');
      tbody.innerHTML = `<tr><td colspan="14" style="text-align:center;padding:20px;color:var(--text-4);">Loading…</td></tr>`;
    
      const sources = typeKey ? DL_SOURCES.filter(s => s.key === typeKey) : DL_SOURCES;
      const disciplinesById = new Map(disciplinesData.map(d => [d.id, d]));
    
      const rows = [];
    
      for (const src of sources) {
        // 1) Find activities matching the filter for this source, on this date.
        let q = db.from(src.acts)
          .select('*')
          .eq('project_id', activeProject)
          .gte('created_at', date + 'T00:00:00')
          .lte('created_at', date + 'T23:59:59')
          .order('created_at', { ascending: false });
        if (userId)   q = q.eq('user_id', userId);
        if (stepDone) q = q.eq('step_done', stepDone);
    
        const { data: acts, error } = await q;
        if (error) { console.error(`[Drawing List] ${src.table} activities error:`, error); continue; }
        if (!acts || !acts.length) continue;
    
        // One matching activity per parent document — most recent wins.
        const latestActByParent = new Map();
        const parentIdField = src.isCalc ? 'eng_calculation_id' : `${src.table.replace(/s$/, '')}_id`;
        // NOTE: confirm each activities table's FK column name — it may not follow
        // this exact convention (e.g. erection_drawing_id, fabrication_drawing_id,
        // support_drawing_id, weld_map_drawing_id, test_package_drawing_id,
        // eng_calculation_id). Adjust parentIdField per table if it doesn't match.
        for (const a of acts) {
          const pid = a[parentIdField];
          if (!pid) continue;
          if (!latestActByParent.has(pid)) latestActByParent.set(pid, a);
        }
        if (!latestActByParent.size) continue;
    
        // 2) Fetch parent document rows for the matched IDs.
        const ids = Array.from(latestActByParent.keys());
        const selectCols = src.isCalc
          ? 'id, doc_number, doc_description, metadata, ifa_cycles, discipline_id, ifc_revision'
          : 'id, drawing_number, title, discipline_id, revision_number, metadata';
        const { data: docs, error: docErr } = await db.from(src.table).select(selectCols).in('id', ids);
        if (docErr) { console.error(`[Drawing List] ${src.table} fetch error:`, docErr); continue; }
        
        const filteredDocs = disciplineId
          ? (docs || []).filter(d => d.discipline_id === disciplineId)
          : (docs || []);
    
        for (const d of filteredDocs) {
          const act  = latestActByParent.get(d.id);
          const meta = d.metadata || {};
    
          const disc = disciplinesById.get(d.discipline_id);
		  const discName = disc ? disc.name : '—';
    
          let revisionNo = '—';
          if (src.isCalc) {
            if (d.ifc_revision !== null && d.ifc_revision !== undefined) {
              revisionNo = String(d.ifc_revision);
            } else {
              const cycles = Array.isArray(d.ifa_cycles) ? d.ifa_cycles : (d.ifa_cycles ? JSON.parse(d.ifa_cycles) : []);
              revisionNo = cycles.length ? (cycles[cycles.length - 1].revision || '—') : '—';
            }
          } else {
            revisionNo = (d.revision_number ?? 0).toString();
          }
		  
          let dateReleased = '';
          if (!src.isCalc) {
            const stepMeta = workflowSteps.find(s => s.name === act.step_done && s.activity_type === src.activityType);
            if (stepMeta && stepMeta.is_issuance && act.created_at) {
              dateReleased = formatDateDMY(act.created_at.slice(0, 10));   // ← was: act.created_at.slice(0, 10)
            }
          }
    
          rows.push({
            docNo:       src.isCalc ? (d.doc_number || '—') : (d.drawing_number || '—'),
            title:       src.isCalc ? (d.doc_description || '—') : (d.title || '—'),
            discipline:  discName,
            type:        src.label,
            sheets:      meta.no_of_sheets    || '',
            revisionNo,
            shopDia:     meta.shop_dia_inch   || '',
            fieldDia:    meta.field_dia_inch  || '',
            surfaceArea: meta.surface_area_m2 || '',
            weight:      meta.weight_kg       || '',
			dateReleased,
            revType:     src.isCalc ? '—' : (act.revision_reason_id ? (revisionReasonsById.get(act.revision_reason_id)?.description || '—') : '—'),
            revDesc:     src.isCalc ? '—' : (act.revision_description || '—'),
            etdNo:       src.isCalc ? '—' : (act.etd_no || '—'),
          });
        }
      }
    
      // Sort by Document No.
      rows.sort((a, b) => (a.docNo || '').localeCompare(b.docNo || ''));
    
      if (!rows.length) {
        tbody.innerHTML = `<tr><td colspan="13" style="text-align:center;padding:30px;color:var(--text-4);">No matching documents for these filters.</td></tr>`;
        return;
      }
    
      tbody.innerHTML = rows.map((r, i) => `
        <tr>
          <td style="text-align:center;">${i + 1}</td>
          <td style="font-weight:600;color:var(--accent-light);">${esc(r.docNo)}</td>
          <td>${esc(r.title)}</td>
          <td style="text-align:center;">${esc(String(r.sheets || '—'))}</td>
          <td style="text-align:center;">${esc(r.revisionNo)}</td>
          <td style="text-align:center;">${esc(String(r.shopDia || '—'))}</td>
          <td style="text-align:center;">${esc(String(r.fieldDia || '—'))}</td>
          <td style="text-align:center;">${esc(String(r.surfaceArea || '—'))}</td>
          <td style="text-align:center;">${esc(String(r.weight || '—'))}</td>
		  <td style="text-align:center;">${esc(r.dateReleased || '—')}</td>
          <td>${esc(r.revType)}</td>
          <td>${esc(r.revDesc)}</td>
          <td style="text-align:center;">${esc(r.etdNo)}</td>
        </tr>
      `).join('');
    
      window._drawingListRows = rows; // for export
    }

    // ── Print helpers ──────────────────────────────────────────────────────────
    // We need to temporarily move #pdf-preview to the top of <body> before
    // printing, because it is deeply nested inside display:none ancestors,
    // which prevents the browser from printing it even with !important overrides.

    let _printClone = null;
    let _printOverlay = null;

    function printWeeklyReport() {
      const preview = document.getElementById('pdf-preview');
      if (!preview || !preview.querySelector('.pdf-page')) {
        toast('Please generate the report first before printing.', 'error');
        return;
      }

      // Clone pdf-preview and append directly to body so it is always visible
      _printClone = preview.cloneNode(true);
      _printClone.id = 'pdf-preview-print';
      _printClone.style.cssText = 'position:fixed;top:0;left:0;width:100%;z-index:99999;background:#fff;';
      document.body.appendChild(_printClone);

      // Overlay to hide the rest of the page during print
      _printOverlay = document.createElement('div');
      _printOverlay.id = 'print-overlay';
      _printOverlay.style.cssText = 'position:fixed;top:0;left:0;width:100%;height:100%;background:#fff;z-index:99998;';
      document.body.appendChild(_printOverlay);

      // Give browser a frame to paint, then print
      requestAnimationFrame(() => {
        requestAnimationFrame(() => {
          window.print();
        });
      });
    }

    // Clean up clone after print dialog closes
    window.addEventListener('afterprint', () => {
      if (_printClone)   { _printClone.remove();   _printClone = null; }
      if (_printOverlay) { _printOverlay.remove();  _printOverlay = null; }
    });

    async function generateWeeklyReport() {
      const range = recalcWeekRange();
      const from = range.from, to = range.to;
      if (!from || !to) { toast('Please select an as-of date.', 'error'); return; }

      const preview = document.getElementById('pdf-preview');
      preview.innerHTML = `<p style="text-align:center;padding:40px;color:var(--text-4);">Generating report…</p>`;

      // Fetch all data
      const proj = projectsData.find(p => p.id === activeProject);

      // 1. All drawings for this project — query each discipline table separately 
      const drawFetches = DRAW_SOURCES.map(src =>
        db.from(src.table)
          .select(`id, drawing_number, title, area, discipline_id, status, ${src.acts}(step_done, created_at, manhours)`)
          .eq('project_id', activeProject)
          .then(r => (r.data || []).map(d => ({
            ...d,
            drawing_activities: d[src.acts] || [],  // normalize to common key name
          })))
      );
      const drawArrays = await Promise.all(drawFetches);
      const drawings = drawArrays.flat();
      
      // 2. Activities — cumulative up to (and including) the report's week-end date,
      //    not scoped to the week itself. This report shows current/cumulative
      //    progress, not just "what happened this week".
      // Fetch all users once, build a lookup map (id -> full_name).
      // We do this manually because these _activities tables have no FK
      // relationship to `users` that PostgREST's embed feature can use.
      const { data: usersData } = await db.from('users').select('id, full_name');
      const usersById = new Map((usersData || []).map(u => [u.id, u]));
      
      const actFetches = DRAW_SOURCES.map(src =>
        db.from(src.acts)
          .select(`*, ${src.table}(drawing_number, title, area, discipline_id, disciplines(name))`)
          .eq('project_id', activeProject)
          .lte('created_at', to + 'T23:59:59')
          .order('created_at', { ascending: false })
          .then(r => (r.data || []).map(a => ({
            ...a,
            drawings: a[src.table] || null,       // normalize to common key name
            users: usersById.get(a.user_id) || null,  // manual join replacing the broken embed
          })))
      );
      const actArrays = await Promise.all(actFetches);
      const activities = actArrays.flat().sort((a, b) => new Date(b.created_at) - new Date(a.created_at));

      // 3. Progress engine — per-area x per-discipline % complete, built the same
      //    way as the Dashboard's computeActualProgress (ROC-weighted, reached-step
      //    credit), just re-scoped down to each structure_item/area.
      const progress = await computeProgressEngine(proj);

      // 4. Purchase Requisition Status, Engineering Calculations, Technical Queries —
      //    these key off the project's short code (not its UUID), Issues & Concerns
      //    keys off project_id like the drawing tables.
      const projCode = proj?.code || null;
      const [prRes, calcRes, tqRes, issuesRes] = await Promise.all([
        projCode ? db.from('material_status').select('*').eq('project_code', projCode) : Promise.resolve({ data: [] }),
        projCode ? db.from('eng_calculations').select('*').eq('project_code', projCode) : Promise.resolve({ data: [] }),
        projCode ? db.from('technical_queries').select('*').eq('project_code', projCode) : Promise.resolve({ data: [] }),
        db.from('issues_concerns').select('*, disciplines(name)').eq('project_id', activeProject),
      ]);
      const prStatus   = prRes.data    || [];
      const calcs      = calcRes.data  || [];
      const tqs        = tqRes.data    || [];
      const issues     = issuesRes.data|| [];

      // Build report HTML
      const html = buildWeeklyReportHTML(proj, drawings || [], activities || [], progress, from, to, prStatus, calcs, tqs, issues);
      preview.innerHTML = html;
    }

    // ── PROGRESS ENGINE ─────────────────────────────────────────
    // Reuses the exact ROC-weighted / reached-step logic from Dashboard's
    // computeActualProgress, re-scoped per structure_item (area) using
    // target_kpi_areas, instead of just the project-wide estimated_output.
    async function computeProgressEngine(proj) {
      const empty = { structureItems: [], disciplines: [], areaDisciplinePct: {}, disciplineOverallPct: {}, docCodesByDiscipline: {}, rocByDisc: {} };
      if (!activeProject) return empty;
      const projId   = activeProject;
      const projCode = proj?.code || null;

      const [siRes, kpiRes, rocRes, rocDiscRes] = await Promise.all([
        projCode ? db.from('structure_items').select('*').eq('project_code', projCode).order('priority_shipment', { ascending: true, nullsFirst: false }) : Promise.resolve({ data: [] }),
        db.from('target_kpi').select('id, discipline_id, doc_code_id, step_id, estimated_output, document_codes(id, code, type, activity_type), workflow_steps(id, name, sort_order, activity_type)').eq('project_id', projId),
        db.from('roc_items').select('discipline_id, doc_code_id, weight, roc_step_items(step_name, weight)').eq('project_id', projId),
        db.from('project_discipline_roc').select('discipline_id, roc').eq('project_id', projId),
      ]);

      const structureItems = siRes.data || [];
      const kpiRows        = kpiRes.data || [];
      if (!kpiRows.length) return { ...empty, structureItems };

      const kpiIds = kpiRows.map(k => k.id);
      const { data: kpiAreaRows } = await db.from('target_kpi_areas').select('kpi_id, structure_item_id, estimated_output').in('kpi_id', kpiIds);
      const areasByKpi = {};
      (kpiAreaRows || []).forEach(a => {
        if (!areasByKpi[a.kpi_id]) areasByKpi[a.kpi_id] = {};
        areasByKpi[a.kpi_id][a.structure_item_id] = parseFloat(a.estimated_output) || 0;
      });

      const rocMap = {};
      (rocRes.data || []).forEach(r => {
        const key = r.discipline_id + '|' + r.doc_code_id;
        rocMap[key] = { weight: parseFloat(r.weight) || 0, steps: {} };
        (r.roc_step_items || []).forEach(s => { rocMap[key].steps[s.step_name] = parseFloat(s.weight) || 0; });
      });

      const rocByDisc = {};
      (rocDiscRes.data || []).forEach(r => { rocByDisc[r.discipline_id] = parseFloat(r.roc) || 0; });

      // step sort-order per activity_type — "reached this step or later" credit, matching Dashboard
      const stepOrderByType = {};
      workflowSteps.forEach(s => {
        const t = s.activity_type || 'drawing';
        stepOrderByType[t] = stepOrderByType[t] || {};
        stepOrderByType[t][s.name] = parseFloat(s.sort_order) || 0;
      });
      function reachedStep(currentStatus, stepName, activityType) {
        const orderMap = stepOrderByType[activityType];
        if (!orderMap || orderMap[currentStatus] == null || orderMap[stepName] == null) return currentStatus === stepName;
        return orderMap[currentStatus] >= orderMap[stepName];
      }

      // ── raw actual-data sources (same tables/shape as Dashboard's computeActualProgress) ──
      const hasDrawingKpi = kpiRows.some(k => k.document_codes?.activity_type === 'drawing');
      const drawingRowsByTable = {};
      if (hasDrawingKpi) {
        for (const table of ['erection_drawings', 'fabrication_drawings', 'support_drawings', 'weld_map_drawings']) {
          const { data } = await db.from(table).select('status, discipline_id, drawing_number, area').eq('project_id', projId);
          drawingRowsByTable[table] = data || [];
        }
      }
      const hasTestPkgKpi = kpiRows.some(k => k.document_codes?.activity_type === 'test_package');
      let testPkgRows = [];
      if (hasTestPkgKpi) {
        const { data } = await db.from('test_package_drawings').select('status, discipline_id, area').eq('project_id', projId);
        testPkgRows = data || [];
      }
      const hasCalcKpi = kpiRows.some(k => k.document_codes?.activity_type === 'calculations');
      let calcRows = [];
      if (hasCalcKpi && projCode) {
        const { data } = await db.from('eng_calculations').select('status, discipline_id').eq('project_code', projCode);
        calcRows = data || [];
      }
      const hasMaterialsKpi = kpiRows.some(k => k.document_codes?.activity_type === 'materials');
      let materialRows = [];
      const disciplineCodeById = {};
      if (hasMaterialsKpi) {
        disciplinesData.forEach(d => { disciplineCodeById[d.id] = d.code; });
        const { data } = await db.from('material_status').select('status, discipline_code, area_system').eq('project_code', projCode || '__no_match__');
        materialRows = data || [];
      }

      // Count actual items for a kpi row, optionally scoped to one structure_item (area).
      function countActual(kpi, area) {
        const docCode = kpi.document_codes, step = kpi.workflow_steps;
        if (!docCode || !step) return 0;
        const areaMatches = (rowArea) => !area || (rowArea || '').trim().toLowerCase() === (area.area_system_module || '').trim().toLowerCase();
        let n = 0;
        if (docCode.activity_type === 'drawing') {
          const prefix = (docCode.code || '').toUpperCase();
          Object.values(drawingRowsByTable).forEach(rows => rows.forEach(r => {
            if (r.discipline_id !== kpi.discipline_id || !areaMatches(r.area)) return;
            const code = (r.drawing_number || '').toUpperCase();
            if (prefix && !code.startsWith(prefix)) return;
            if (reachedStep(r.status, step.name, 'drawing')) n++;
          }));
        } else if (docCode.activity_type === 'test_package') {
          testPkgRows.forEach(r => {
            if (r.discipline_id !== kpi.discipline_id || !areaMatches(r.area)) return;
            if (reachedStep(r.status, step.name, 'test_package')) n++;
          });
        } else if (docCode.activity_type === 'calculations') {
          if (area) return 0; // eng_calculations has no area attribution
          calcRows.forEach(r => {
            if (r.discipline_id !== kpi.discipline_id) return;
            if (reachedStep(r.status, step.name, 'calculations')) n++;
          });
        } else if (docCode.activity_type === 'materials') {
          const discCode = disciplineCodeById[kpi.discipline_id];
          materialRows.forEach(r => {
            if (discCode && r.discipline_code !== discCode) return;
            if (!areaMatches(r.area_system)) return;
            if (reachedStep(r.status, step.name, 'materials')) n++;
          });
        }
        return n;
      }

      const disciplinesWithKpi = [...new Set(kpiRows.map(k => k.discipline_id))];

      // ── Discipline-level Overall % (whole project) — identical math to Dashboard ──
      const disciplineOverallPct = {};
      disciplinesWithKpi.forEach(discId => {
        let total = 0;
        kpiRows.filter(k => k.discipline_id === discId).forEach(kpi => {
          const roc = rocMap[discId + '|' + kpi.doc_code_id];
          if (!roc) return;
          const docWeight  = (roc.weight || 0) / 100;
          const stepWeight = (roc.steps[kpi.workflow_steps?.name] || 0) / 100;
          const estOutput  = parseFloat(kpi.estimated_output) || 0;
          if (!docWeight || !stepWeight || !estOutput) return;
          const stepPct = Math.min(1, countActual(kpi, null) / estOutput);
          total += docWeight * stepWeight * stepPct * 100;
        });
        disciplineOverallPct[discId] = Math.min(100, total);
      });

      // ── Per-area x per-discipline % (Highlights rows + per-discipline detail pages) ──
      const areaDisciplinePct   = {};
      const docCodesByDiscipline = {};
      disciplinesWithKpi.forEach(discId => {
        areaDisciplinePct[discId] = {};
        const discKpis = kpiRows.filter(k => k.discipline_id === discId);

        const seen = new Set();
        docCodesByDiscipline[discId] = [];
        discKpis.forEach(k => {
          if (k.document_codes && !seen.has(k.doc_code_id)) { seen.add(k.doc_code_id); docCodesByDiscipline[discId].push(k.document_codes); }
        });

        structureItems.forEach(si => {
          const byDocCode = {}, byDocCodeDetail = {};
          let overallTotal = 0;

          docCodesByDiscipline[discId].forEach(dc => {
            const docKpis = discKpis.filter(k => k.doc_code_id === dc.id);
            const inScope = docKpis.some(k => (areasByKpi[k.id] || {})[si.id]);
            if (!inScope) return;

            let docTotal = 0;
            docKpis.forEach(kpi => {
              const roc = rocMap[discId + '|' + kpi.doc_code_id];
              if (!roc) return;
              const stepWeight = (roc.steps[kpi.workflow_steps?.name] || 0) / 100;
              const areaEst = (areasByKpi[kpi.id] || {})[si.id];
              if (!stepWeight || !areaEst) return;
              docTotal += stepWeight * Math.min(1, countActual(kpi, si) / areaEst) * 100;
            });
            docTotal = Math.min(100, docTotal);
            byDocCode[dc.id] = docTotal;

            // "Req/Done" reference figures = the doc-code's furthest-along step
            const lastKpi = docKpis.reduce((best, k) => (!best || (k.workflow_steps?.sort_order || 0) > (best.workflow_steps?.sort_order || 0)) ? k : best, null);
            const req  = lastKpi ? ((areasByKpi[lastKpi.id] || {})[si.id] || 0) : 0;
            const done = lastKpi ? countActual(lastKpi, si) : 0;
            byDocCodeDetail[dc.id] = { req, done };

            const roc = rocMap[discId + '|' + dc.id];
            overallTotal += ((roc?.weight || 0) / 100) * docTotal;
          });

          areaDisciplinePct[discId][si.id] = Object.keys(byDocCode).length
            ? { overall: Math.min(100, overallTotal), byDocCode, byDocCodeDetail }
            : null;
        });
      });

      const disciplines = disciplinesData.filter(d => disciplinesWithKpi.includes(d.id));
      return { structureItems, disciplines, areaDisciplinePct, disciplineOverallPct, docCodesByDiscipline, rocByDisc };
    }

    function buildWeeklyReportHTML(proj, drawings, activities, progress, from, to, prStatus, calcs, tqs, issues) {
      const fromDate = new Date(from);
      const toDate   = new Date(to);
      const fmtDate  = (d) => d.toLocaleDateString('en-US', { day:'numeric', month:'short', year:'numeric' });
      const weekStr  = `${fmtDate(fromDate)} - ${fmtDate(toDate)}`;

      const dash = (val) => val != null && val !== '' ? val : '<span class="dash">-</span>';
      const pctStr = (v) => v == null ? '<span class="dash">-</span>' : Math.round(v) + '%';

      // ── PAGE HEADER ──
      const pageHeader = (title) => `
        <div class="pdf-header" data-project="${esc(proj?.name || '—')}" data-date-range="${esc(weekStr)}" data-prepared-by="${esc(preparedByLabel())}">
          <div class="pdf-logo-cell">
            <div class="pdf-logo-box">LOGO</div>
          </div>
          <div class="pdf-title-cell">${title}</div>
          <div class="pdf-meta-cell">
            <div><span class="pdf-meta-label">Project</span><span>: ${proj?.name || '—'}</span></div>
            <div><span class="pdf-meta-label">Week</span><span>: ${weekStr}</span></div>
            <div><span class="pdf-meta-label">Prepared By</span><span>: ${esc(preparedByLabel())}</span></div>
          </div>
        </div>
      `;

      // Small "Status | Quantity" summary box shown under a sub-section bar
      // (Lifting Plan / Temporary Structure / TQ / TD / MAR pages), matching the sample WPR.
      // `counts` = { Open: 3, Closed: 10, ... }; `total` defaults to the sum of values.
      const statusBox = (counts, total) => {
        const rows = Object.entries(counts).map(([k, v]) => `<tr><td>${esc(k)}</td><td>${v}</td></tr>`).join('');
        const tot  = total != null ? total : Object.values(counts).reduce((a, b) => a + (b || 0), 0);
        return `
          <table class="pdf-status-box">
            <thead><tr><th>Status</th><th>Quantity</th></tr></thead>
            <tbody>
              ${rows}
              <tr><td>Total</td><td>${tot}</td></tr>
            </tbody>
          </table>
        `;
      };

      let pages = '';
      const { structureItems, disciplines, areaDisciplinePct, docCodesByDiscipline, rocByDisc } = progress;

      // Blend a structure_item's per-discipline % into one Over-All figure,
      // weighted by project_discipline_roc among the disciplines actually
      // in scope for that area.
      function areaOverallPct(si) {
        let totalW = 0, sum = 0;
        disciplines.forEach(d => {
          const cell = areaDisciplinePct[d.id]?.[si.id];
          if (!cell) return;
          const w = rocByDisc[d.id] || 0;
          totalW += w; sum += w * cell.overall;
        });
        return totalW > 0 ? sum / totalW : null;
      }

      // ── HIGHLIGHTS — one table per page: overview page, then one page per discipline ──
      if (!structureItems.length || !disciplines.length) {
        pages += `
          <div class="pdf-page">
            ${pageHeader('WEEKLY PROGRESS REPORT')}
            <div class="pdf-section-header">Highlights</div>
            <p style="padding:16px;color:#666;">No targets/structure items configured for this project yet — set these up in Targets and Structure first.</p>
          </div>
        `;
      } else {
        // Page 1: overview table (all disciplines' overall % side by side)
        pages += `
          <div class="pdf-page">
            ${pageHeader('WEEKLY PROGRESS REPORT')}
            <div class="pdf-section-header">Highlights</div>
            <div class="pdf-subsection-header">CONSTRUCTION ENGINEERING PROGRESS</div>
            <table class="pdf-table">
              <thead>
                <tr>
                  <th rowspan="2" class="id-col" style="min-width:110px;">Area / Tank No.</th>
                  <th class="group-header">Over-All</th>
                  ${disciplines.map(d => `<th class="group-header">${esc(d.name)}</th>`).join('')}
                  <th rowspan="2">Remarks</th>
                </tr>
                <tr>
                  <th>Progress (%)</th>
                  ${disciplines.map(() => `<th>Progress (%)</th>`).join('')}
                </tr>
              </thead>
              <tbody>
                ${structureItems.map(si => `
                  <tr>
                    <td class="area-col id-col">${esc(si.area_system_module)}</td>
                    <td>${pctStr(areaOverallPct(si))}</td>
                    ${disciplines.map(d => `<td>${pctStr(areaDisciplinePct[d.id]?.[si.id]?.overall ?? null)}</td>`).join('')}
                    <td class="area-col">${esc(si.remarks || '')}</td>
                  </tr>
                `).join('')}
              </tbody>
            </table>
          </div>
        `;

        // One page per discipline (e.g. "STRUCTURAL PROGRESS"), columns = that
        // discipline's document codes, all %.
        disciplines.forEach(d => {
          const docCodes = docCodesByDiscipline[d.id] || [];
          if (!docCodes.length) return;
          pages += `
            <div class="pdf-page">
              ${pageHeader('WEEKLY PROGRESS REPORT')}
              <div class="pdf-section-header">Highlights</div>
              <div class="pdf-subsection-header">${esc(d.name).toUpperCase()} PROGRESS</div>
              <table class="pdf-table">
                <thead>
                  <tr>
                    <th rowspan="2" class="id-col" style="min-width:110px;">Area / Tank No.</th>
                    <th class="group-header">${esc(d.name)} Over-All</th>
                    ${docCodes.map(dc => `<th class="group-header">${esc(dc.type)}</th>`).join('')}
                    <th rowspan="2">Remarks</th>
                  </tr>
                  <tr>
                    <th>Progress (%)</th>
                    ${docCodes.map(() => `<th>Progress (%)</th>`).join('')}
                  </tr>
                </thead>
                <tbody>
                  ${structureItems.map(si => {
                    const cell = areaDisciplinePct[d.id]?.[si.id];
                    if (!cell) return '';
                    return `
                      <tr>
                        <td class="area-col id-col">${esc(si.area_system_module)}</td>
                        <td>${pctStr(cell.overall)}</td>
                        ${docCodes.map(dc => `<td>${pctStr(cell.byDocCode[dc.id] ?? null)}</td>`).join('')}
                        <td></td>
                      </tr>
                    `;
                  }).join('')}
                </tbody>
              </table>
            </div>
          `;
        });
      }

      // ── ENGINEERING DELIVERABLES — one landscape page per discipline, with quantities ──
      disciplines.forEach(d => {
        const docCodes = docCodesByDiscipline[d.id] || [];
        if (!docCodes.length) return;

        // Alternate each doc-code group between the orange and green bands (band-a / band-b).
        const bandOf = (idx) => idx % 2 === 0 ? 'band-a' : 'band-b';

        const rows = structureItems.map(si => {
          const cell = areaDisciplinePct[d.id]?.[si.id];
          if (!cell) return '';
          const docCells = docCodes.map((dc, idx) => {
            const band = bandOf(idx);
            const detail = cell.byDocCodeDetail[dc.id];
            if (!detail) return `<td class="${band}">${dash(null)}</td><td class="${band}">${dash(null)}</td><td class="${band}">${dash(null)}</td>`;
            return `
              <td class="${band}">${dash(detail.req || null)}</td>
              <td class="${band}">${dash(detail.done || null)}</td>
              <td class="${band}">${pctStr(cell.byDocCode[dc.id] ?? null)}</td>
            `;
          }).join('');
          return `
            <tr>
              <td class="area-col id-col-blue">${esc(si.area_system_module)}</td>
              <td class="id-col-blue">${pctStr(cell.overall)}</td>
              ${docCells}
              <td></td>
            </tr>
          `;
        }).join('');

        pages += `
          <div class="pdf-page landscape">
            ${pageHeader('WEEKLY PROGRESS REPORT')}
            <div class="pdf-section-header">Engineering Deliverables</div>
            <div class="pdf-subsection-header">${esc(d.name).toUpperCase()} DRAWINGS</div>
            <table class="pdf-table">
              <thead>
                <tr>
                  <th rowspan="2" class="area-col id-col-blue" style="min-width:120px;">Area / Tank No.</th>
                  <th rowspan="2" class="id-col-blue">${esc(d.name)}<br>Over-All</th>
                  ${docCodes.map((dc, idx) => `<th colspan="3" class="group-header ${bandOf(idx)}">${esc(dc.type)}</th>`).join('')}
                  <th rowspan="2">Remarks</th>
                </tr>
                <tr>
                  ${docCodes.map((dc, idx) => `<th class="${bandOf(idx)}">Req</th><th class="${bandOf(idx)}">Done</th><th class="${bandOf(idx)}">%</th>`).join('')}
                </tr>
              </thead>
              <tbody>
                ${rows || `<tr><td colspan="${2 + docCodes.length * 3 + 1}" style="text-align:center;padding:10px;color:#999;">No areas in scope.</td></tr>`}
              </tbody>
            </table>
          </div>
        `;
      });

      // ── PURCHASE REQUISITION STATUS ──
      const prSorted = [...prStatus].sort((a, b) => {
        const dc = (a.discipline_code || '').localeCompare(b.discipline_code || '');
        if (dc !== 0) return dc;
        return (a.mto_number || '').localeCompare(b.mto_number || '');
      });
      const prCounts = {};
      prStatus.forEach(p => { const k = p.pr_status || 'Draft'; prCounts[k] = (prCounts[k] || 0) + 1; });

      const prRows = prSorted.map((p, i) => {
        const poNos = (p.pos || []).map(po => esc(po.po_no)).filter(Boolean);
        return `
          <tr>
            <td>${i + 1}</td>
            <td>${dash(p.discipline_code)}</td>
            <td style="font-weight:700;">${dash(p.mto_number)}${p.mto_revision ? ' (' + esc(p.mto_revision) + ')' : ''}</td>
            <td class="area-col">${esc(p.mto_description || p.pr_description || '')}</td>
            <td>${dash(p.pr_no)}</td>
            <td>${p.date_created  ? formatDate(p.date_created)  : '<span class="dash">-</span>'}</td>
            <td>${p.date_approved ? formatDate(p.date_approved) : '<span class="dash">-</span>'}</td>
            <td>${poNos.length ? poNos.join('<br>') : '<span class="dash">-</span>'}</td>
            <td>${dash(p.pr_status)}</td>
            <td class="area-col">${esc(p.remarks || '')}</td>
          </tr>
        `;
      }).join('');

      pages += `
        <div class="pdf-page">
          ${pageHeader('WEEKLY PROGRESS REPORT')}
          <div class="pdf-section-header">Material Status</div>
          <div class="pdf-subsection-header">PURCHASE REQUISITION STATUS</div>
          <table class="pdf-table">
            <thead>
              <tr>
                <th>Seq</th>
                <th>Discipline</th>
                <th>MTO Number</th>
                <th style="text-align:left;">Description</th>
                <th>PR No.</th>
                <th>Date Created</th>
                <th>Date Approved</th>
                <th>PO No.</th>
                <th>PR Status</th>
                <th style="text-align:left;">Remarks</th>
              </tr>
            </thead>
            <tbody>
              ${prRows || `<tr><td colspan="10" style="text-align:center;padding:10px;color:#999;">No purchase requisitions recorded.</td></tr>`}
            </tbody>
          </table>
        </div>
      `;

      // ── ENGINEERING CALCULATIONS (one page per calculation type) ──
      const CALC_TYPE_LABELS = {
        'Lifting Plan':        'Lifting Plan Calculation',
        'Temporary Structure': 'Temporary Structure Design',
        'Connection Design':   'Connection Design Calculation',
      };
      const calcsByType = {};
      calcs.forEach(c => {
        const t = c.calc_type || 'Other';
        if (!calcsByType[t]) calcsByType[t] = [];
        calcsByType[t].push(c);
      });
      const latestCycle = (arr) => Array.isArray(arr) && arr.length ? arr[arr.length - 1] : null;

      Object.entries(calcsByType).forEach(([type, list]) => {
        const statusCounts = {};
        list.forEach(c => { const k = c.status || 'Not Started'; statusCounts[k] = (statusCounts[k] || 0) + 1; });

        const rows = list.map((c, i) => {
          const cyc = latestCycle(c.ifa_cycles);
          return `
            <tr>
              <td>${i + 1}</td>
              <td style="font-weight:700;">${dash(c.doc_number)}</td>
              <td class="area-col">${esc(c.doc_description || '')}</td>
              <td>${dash(c.status)}</td>
              <td>${c.date_requested ? formatDate(c.date_requested) : '<span class="dash">-</span>'}</td>
              <td>${cyc?.date_ifa     ? formatDate(cyc.date_ifa)     : '<span class="dash">-</span>'}</td>
              <td>${cyc?.date_respond ? formatDate(cyc.date_respond) : '<span class="dash">-</span>'}</td>
              <td>${dash(cyc?.revision)}</td>
              <td>${c.date_ifc ? formatDate(c.date_ifc) : '<span class="dash">-</span>'}</td>
              <td class="area-col">${esc(c.remarks || '')}</td>
            </tr>
          `;
        }).join('');

        pages += `
          <div class="pdf-page">
            ${pageHeader('WEEKLY PROGRESS REPORT')}
            <div class="pdf-section-header">Engineering Calculations</div>
            <div class="pdf-subsection-header">${esc((CALC_TYPE_LABELS[type] || type)).toUpperCase()} STATUS</div>
            ${statusBox(statusCounts, list.length)}
            <table class="pdf-table">
              <thead>
                <tr>
                  <th>SN</th>
                  <th>Doc Number</th>
                  <th style="text-align:left;">Description</th>
                  <th>Status</th>
                  <th>Date Requested</th>
                  <th>Date IFA</th>
                  <th>Date Respond</th>
                  <th>Rev</th>
                  <th>Date IFC</th>
                  <th style="text-align:left;">Remarks</th>
                </tr>
              </thead>
              <tbody>${rows}</tbody>
            </table>
          </div>
        `;
      });

      // ── TECHNICAL QUERIES — TQ, then TD, then MAR nested in the same section ──
      const TQ_TYPE_ORDER  = ['Technical Query', 'Technical Deviation', 'Material Approval'];
      const TQ_TYPE_LABELS = {
        'Technical Query':     'Technical Query (TQ) Status',
        'Technical Deviation': 'Technical Deviation (TD) Status',
        'Material Approval':   'Material Approval Request (MAR) Status',
      };
      const TQ_SECTION_LABELS = {
        'Technical Query':     'Technical Query',
        'Technical Deviation': 'Technical Deviation',
        'Material Approval':   'Material Approval Request',
      };
      const tqsByType = {};
      tqs.forEach(t => {
        const k = t.query_type || 'Technical Query';
        if (!tqsByType[k]) tqsByType[k] = [];
        tqsByType[k].push(t);
      });

      TQ_TYPE_ORDER.filter(t => tqsByType[t]).forEach(type => {
        const list = tqsByType[type];
        const statusCounts = { Open: 0, Closed: 0, Cancelled: 0 };
        list.forEach(t => { const k = t.status || 'Open'; statusCounts[k] = (statusCounts[k] || 0) + 1; });

        const rows = list.map((t, i) => {
          const cyc = latestCycle(t.tq_cycles);
          return `
            <tr>
              <td>${i + 1}</td>
              <td>${dash(t.discipline)}</td>
              <td style="font-weight:700;">${dash(t.doc_number)}</td>
              <td class="area-col">${esc(t.doc_description || '')}</td>
              <td>${cyc?.date_submitted ? formatDate(cyc.date_submitted) : '<span class="dash">-</span>'}</td>
              <td>${cyc?.date_response  ? formatDate(cyc.date_response)  : '<span class="dash">-</span>'}</td>
              <td>${dash(t.status)}</td>
              <td class="area-col">${esc(t.remarks || '')}</td>
            </tr>
          `;
        }).join('');

        pages += `
          <div class="pdf-page">
            ${pageHeader('WEEKLY PROGRESS REPORT')}
            <div class="pdf-section-header">${esc(TQ_SECTION_LABELS[type] || type)}</div>
            <div class="pdf-subsection-header">${esc(TQ_TYPE_LABELS[type] || type).toUpperCase()}</div>
            ${statusBox(statusCounts, list.length)}
            <table class="pdf-table">
              <thead>
                <tr>
                  <th>SN</th>
                  <th>Discipline</th>
                  <th>Doc Number</th>
                  <th style="text-align:left;">Description</th>
                  <th>Date Submitted</th>
                  <th>Date Replied</th>
                  <th>Status</th>
                  <th style="text-align:left;">Remarks</th>
                </tr>
              </thead>
              <tbody>${rows || `<tr><td colspan="8" style="text-align:center;padding:10px;color:#999;">No records.</td></tr>`}</tbody>
            </table>
          </div>
        `;
      });

      // ── ISSUES AND CONCERNS (grouped by discipline) ──
      const issuesByDisc = {};
      issues.forEach(iss => {
        const k = iss.disciplines?.name || 'General';
        if (!issuesByDisc[k]) issuesByDisc[k] = [];
        issuesByDisc[k].push(iss);
      });

      const issueRows = Object.entries(issuesByDisc).sort((a, b) => a[0].localeCompare(b[0])).map(([discName, list]) =>
        list.map((iss, i) => `
          <tr>
            ${i === 0 ? `<td class="area-col" rowspan="${list.length}" style="vertical-align:top;font-weight:700;">${esc(discName)}</td>` : ''}
            <td class="area-col" style="text-align:left;">
              ${esc(iss.concern || '')}
              ${iss.action ? `<div style="color:#888;font-style:italic;margin-top:2px;">Action: ${esc(iss.action)}</div>` : ''}
            </td>
            <td>${dash(iss.status)}</td>
            <td>${iss.date_raised ? formatDate(iss.date_raised) : '<span class="dash">-</span>'}</td>
          </tr>
        `).join('')
      ).join('');

      pages += `
        <div class="pdf-page">
          ${pageHeader('WEEKLY PROGRESS REPORT')}
          <div class="pdf-section-header">Issues and Concerns</div>
          <table class="pdf-table">
            <thead>
              <tr>
                <th style="text-align:left;">Discipline</th>
                <th style="text-align:left;">Concerns</th>
                <th>Status</th>
                <th>Date Raised</th>
              </tr>
            </thead>
            <tbody>
              ${issueRows || `<tr><td colspan="4" style="text-align:center;padding:10px;color:#999;">No open issues or concerns.</td></tr>`}
            </tbody>
          </table>
        </div>
      `;

      return pages;
    }

    initLayout('Reports');
  </script>
</body>
</html>
