<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Targets — EngPro App</title>
  <link rel="stylesheet" href="../css/main.css" />
  <script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
  <style>
    /* ── Histogram grid ───────────────────────────────────── */
    .histo-toolbar {
      display:flex;align-items:center;gap:10px;margin-bottom:14px;flex-wrap:wrap;
    }
    .histo-outer {
      overflow-x:auto;overflow-y:auto;
      max-height:calc(100vh - 310px);
      border:1px solid var(--border);border-radius:var(--radius);
    }
    .histo-table {
      border-collapse:collapse;font-size:12px;white-space:nowrap;
      min-width:100%;
    }
    .histo-table th, .histo-table td {
      border:1px solid var(--border);padding:0;
    }
    /* sticky cols */
    .histo-table .col-pos  { position:sticky;left:0;z-index:3;background:var(--bg-3);min-width:170px;max-width:200px;padding:6px 10px; }
    .histo-table .col-disc { position:sticky;left:170px;z-index:3;background:var(--bg-3);min-width:80px;padding:6px 8px;text-align:center; }
    .histo-table .col-allot{ position:sticky;left:250px;z-index:3;background:var(--bg-3);min-width:80px;padding:6px 8px;text-align:right; }
    .histo-table .col-total{ position:sticky;left:330px;z-index:3;background:var(--bg-3);min-width:80px;padding:6px 8px;text-align:right; }
    /* header row */
    .histo-table thead th  { background:var(--bg-3);font-weight:600;color:var(--text-3);font-size:11px;text-align:center;padding:7px 6px;position:sticky;top:0;z-index:2; }
    .histo-table thead th.col-pos  { z-index:4; }
    .histo-table thead th.col-disc { z-index:4; }
    .histo-table thead th.col-allot{ z-index:4; }
    .histo-table thead th.col-total{ z-index:4; }
    /* sub-header MP/MH */
    .histo-table .sub-hdr  { background:var(--bg-4);font-size:10px;font-weight:700;color:var(--text-4);text-align:center;padding:3px 6px; }
    .histo-table .sub-hdr.col-pos  { text-align:left; }
    /* data cells */
    .histo-table .row-mp td { background:var(--bg-2); }
    .histo-table .row-mh td { background:var(--bg-1); }
    .histo-table .cell-input {
      width:54px;border:none;background:transparent;
      text-align:right;padding:5px 6px;color:var(--text);font-size:12px;
      font-family:var(--font-mono,monospace);
      outline:none;
    }
    .histo-table .cell-input:focus { background:var(--accent-dim);color:var(--accent); }
    .histo-table .cell-input:hover { background:var(--bg-4); }
	
	.cell-input {
      width:54px;border:none;background:transparent;
      text-align:right;padding:5px 6px;color:var(--text);font-size:12px;
      font-family:var(--font-mono,monospace);
      outline:none;
    }
    .cell-input:focus { background:var(--accent-dim);color:var(--accent); }
    .cell-input:hover { background:var(--bg-4); }

	.histo-table input[data-field="headcount"] { color: var(--accent); }
	.histo-table input[data-field="headcount"]:focus { color: var(--accent); }
	.histo-table .row-mp td,
	.histo-table .row-mh td { height: 28px; max-height: 28px; }
	
    /* total col coloring */
    .total-ok   { color:var(--green,#22c55e);font-weight:700; }
    .total-over { color:var(--red,#ef4444);font-weight:700; }
    .total-zero { color:var(--text-4); }
    /* position label */
    .pos-label  { font-weight:600;color:var(--text);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:160px; }
    .disc-badge { font-size:10px; }
    /* save indicator */
    .save-dot {
      width:6px;height:6px;border-radius:50%;background:var(--accent);
      display:inline-block;margin-left:5px;opacity:0;transition:opacity .3s;
    }
    .save-dot.dirty { opacity:1; }
    /* import drop zone */
    .import-drop {
      border:2px dashed var(--border);border-radius:var(--radius);
      padding:32px;text-align:center;color:var(--text-3);font-size:13px;cursor:pointer;
      transition:border-color .2s,background .2s;
    }
    .import-drop:hover,.import-drop.drag-over {
      border-color:var(--accent);background:var(--accent-dim);color:var(--text);
    }
    .import-preview { overflow-x:auto;max-height:320px;margin-top:14px; }
    .import-preview table { font-size:11px;border-collapse:collapse;width:100%; }
    .import-preview th { background:var(--bg-3);padding:5px 8px;border:1px solid var(--border);font-weight:600;text-align:center; }
    .import-preview td { padding:4px 8px;border:1px solid var(--border);text-align:right; }
    .import-preview td:first-child { text-align:left;font-weight:500; }
    .import-preview tr:nth-child(even) td { background:var(--bg-2); }
  </style>
</head>
<body>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="../js/supabase.js"></script>
  <script src="../js/utils.js"></script>
  <script src="../js/layout.js"></script>
  <script src="../js/messaging.js"></script>

  <script>
    const SVG_SM = (p) => `<svg xmlns="http://www.w3.org/2000/svg" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">${p}</svg>`;
    const IC = {
      edit:   SVG_SM('<path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"/><path d="M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z"/>'),
      trash:  SVG_SM('<polyline points="3 6 5 6 21 6"/><path d="M19 6l-1 14a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2L5 6"/><path d="M10 11v6"/><path d="M14 11v6"/><path d="M9 6V4a1 1 0 0 1 1-1h4a1 1 0 0 1 1 1v2"/>'),
      plus:   SVG_SM('<line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/>'),
      save:   SVG_SM('<path d="M19 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11l5 5v11a2 2 0 0 1-2 2z"/><polyline points="17 21 17 13 7 13 7 21"/><polyline points="7 3 7 8 15 8"/>'),
      target: SVG_SM('<circle cx="12" cy="12" r="10"/><circle cx="12" cy="12" r="6"/><circle cx="12" cy="12" r="2"/>'),
      upload: SVG_SM('<path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="17 8 12 3 7 8"/><line x1="12" y1="3" x2="12" y2="15"/>'),
      download: SVG_SM('<path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/>'),
    };

    let targetsData     = [];
    let rolesData       = [];
    let disciplinesData = [];
    let projectsData    = [];
	
	let rocProjectId     = null;
	let rocDiscs         = [];       // disciplines for selected project
	let rocDocCodes      = [];       // all doc codes from admin
	let rocWorkflowSteps = {};       // { activity_type: [step names] }
	let rocItems         = {};       // { disc_id: { doc_code_id: { weight, id, steps: { step_name: { weight, id } } } } }
	let rocDirty         = false;

    // ── histogram state
    let histoProjectId  = null;
    let histoProject    = null;
    let histoMonths     = [];   // array of Date (first of month)
    let histoSchedule   = {};   // { target_id: { 'YYYY-MM': { manhours, headcount } } }
    let histoDirty      = {};   // { target_id: { 'YYYY-MM': true } }
    let histoSaving     = false;
    let histoAutoSave   = null;

    // ─── MODALS ───────────────────────────────────────────────────────────────
    function injectModals() {
      document.body.insertAdjacentHTML('beforeend', `
        <!-- Target Modal -->
        <div class="modal" id="target-modal">
          <div class="modal-backdrop" onclick="closeModal('target-modal')"></div>
          <div class="modal-box modal-sm">
            <div class="modal-header">
              <h3 id="target-modal-title" style="display:flex;align-items:center;gap:8px;">${IC.target} Add Position</h3>
              <button class="modal-close" onclick="closeModal('target-modal')">✕</button>
            </div>
            <div class="modal-body">
              <input type="hidden" id="t-id" />
              <div class="form-group">
                <label class="required">Project</label>
                <select id="t-project"><option value="">— Select —</option></select>
              </div>
              <div class="form-row">
                <div class="form-group">
                  <label class="required">Role</label>
                  <select id="t-role" onchange="updatePositionLabel()"><option value="">— Select —</option></select>
                </div>
                <div class="form-group">
                  <label class="required">Discipline</label>
                  <select id="t-discipline" onchange="updatePositionLabel()"><option value="">— Select —</option></select>
                </div>
              </div>
              <div class="form-group">
                <label>Position</label>
                <input type="text" id="t-position" placeholder="Auto-generated or customize" />
                <div style="font-size:11px;color:var(--text-4);margin-top:4px;">Auto-fills from Role + Discipline. You can override it.</div>
              </div>
              <div class="form-group">
                <label class="required">Allotted Manhours</label>
                <input type="number" id="t-manhours" min="0" step="0.5" placeholder="e.g. 500" />
              </div>
            </div>
            <div class="modal-footer">
              <button class="btn btn-ghost" onclick="closeModal('target-modal')">Cancel</button>
              <button class="btn btn-primary" id="target-save-btn" onclick="saveTarget()" style="display:flex;align-items:center;gap:5px;">${IC.save} Save</button>
            </div>
          </div>
        </div>
		
		<!-- Position Import Modal -->
        <div class="modal" id="pos-import-modal">
          <div class="modal-backdrop" onclick="closeModal('pos-import-modal')"></div>
          <div class="modal-box" style="max-width:720px;">
            <div class="modal-header">
              <h3 style="display:flex;align-items:center;gap:8px;">${IC.upload} Import Position from Excel</h3>
              <button class="modal-close" onclick="closeModal('pos-import-modal')">✕</button>
            </div>
            <div class="modal-body">
              <div class="import-drop" id="pos-import-drop" onclick="document.getElementById('pos-import-file').click()"
                ondragover="event.preventDefault();this.classList.add('drag-over')"
                ondragleave="this.classList.remove('drag-over')"
                ondrop="handlePosImportDrop(event)"
                style="border:2px dashed var(--border);border-radius:var(--radius);padding:60px 32px;text-align:center;cursor:pointer;transition:border-color .2s,background .2s;">
                <svg xmlns="http://www.w3.org/2000/svg" width="36" height="36" viewBox="0 0 24 24" fill="none" stroke="var(--accent)" stroke-width="1.75" style="margin-bottom:14px;"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="17 8 12 3 7 8"/><line x1="12" y1="3" x2="12" y2="15"/></svg>
                <div style="font-size:14px;font-weight:600;color:var(--text);margin-bottom:6px;">Drop Excel file here or click to browse</div>
                <div style="font-size:12px;color:var(--text-4);">.xlsx / .xls files supported</div>
              </div>
              <input type="file" id="pos-import-file" accept=".xlsx,.xls" style="display:none" onchange="handlePosImportFile(this)" />
              <div id="pos-import-preview-wrap"></div>
			  <div style="font-size:12px;color:var(--text-3);margin-top:12px;background:var(--bg-4);border:1px solid var(--border);border-radius:var(--radius);padding:10px 12px;">
                <strong>Expected columns headers:</strong>
                Position, Project Code, Role Name, Discipline Name and Allotted Manhours.<br>
                Role Name, Discipline Name and Project Code must match existing app coding.
              </div>
            </div>
            <div class="modal-footer">
              <button class="btn btn-ghost" onclick="closeModal('pos-import-modal')">Cancel</button>
              <button class="btn btn-primary" id="pos-import-confirm-btn" onclick="confirmPosImport()" style="display:none;align-items:center;gap:5px;">${IC.save} Import</button>
            </div>
          </div>
        </div>

        <!-- Histogram Import Modal -->
        <div class="modal" id="import-modal">
          <div class="modal-backdrop" onclick="closeModal('import-modal')"></div>
          <div class="modal-box" style="max-width:720px;">
            <div class="modal-header">
              <h3 style="display:flex;align-items:center;gap:8px;">${IC.upload} Import Histogram from Excel</h3>
              <button class="modal-close" onclick="closeModal('import-modal')">✕</button>
            </div>
            <div class="modal-body">
              <div class="import-drop" id="import-drop" onclick="document.getElementById('import-file').click()"
                ondragover="event.preventDefault();this.classList.add('drag-over')"
                ondragleave="this.classList.remove('drag-over')"
                ondrop="handleImportDrop(event)"
				style="border:2px dashed var(--border);border-radius:var(--radius);padding:60px 32px;text-align:center;cursor:pointer;transition:border-color .2s,background .2s;">
                <svg xmlns="http://www.w3.org/2000/svg" width="36" height="36" viewBox="0 0 24 24" fill="none" stroke="var(--accent)" stroke-width="1.75" style="margin-bottom:14px;"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="17 8 12 3 7 8"/><line x1="12" y1="3" x2="12" y2="15"/></svg>
                <div style="font-size:14px;font-weight:600;color:var(--text);margin-bottom:6px;">Drop Excel file here or click to browse</div>
                <div style="font-size:12px;color:var(--text-4);">.xlsx / .xls files supported</div>
              </div>
              <input type="file" id="import-file" accept=".xlsx,.xls" style="display:none" onchange="handleImportFile(this)" />
              <div id="import-preview-wrap"></div>
              <div style="font-size:12px;color:var(--text-3);margin-top:12px;background:var(--bg-4);border:1px solid var(--border);border-radius:var(--radius);padding:10px 12px;">
                <strong>Expected format:</strong> Standard histogram Excel with position names in column A,
                discipline codes in column B, and alternating MP / MH rows per position across month columns.
                Month headers in the format <code>Mon-YY</code> (e.g. <code>May-26</code>).
              </div>			  
            </div>
            <div class="modal-footer">
              <button class="btn btn-ghost" onclick="closeModal('import-modal')">Cancel</button>
              <button class="btn btn-primary" id="import-confirm-btn" onclick="confirmImport()" style="display:none;align-items:center;gap:5px;">${IC.save} Import Data</button>
            </div>
          </div>
        </div>
		
		<!-- Progress Import Modal -->
        <div class="modal" id="prog-import-modal">
          <div class="modal-backdrop" onclick="closeModal('prog-import-modal')"></div>
          <div class="modal-box" style="max-width:600px;">
            <div class="modal-header">
              <h3 style="display:flex;align-items:center;gap:8px;">${IC.upload} Import Planned Progress</h3>
              <button class="modal-close" onclick="closeModal('prog-import-modal')">✕</button>
            </div>
            <div class="modal-body">
              <div class="import-drop" id="prog-import-drop" onclick="document.getElementById('prog-import-file').click()"
                ondragover="event.preventDefault();this.classList.add('drag-over')"
                ondragleave="this.classList.remove('drag-over')"
                ondrop="handleProgImportDrop(event)"
                style="border:2px dashed var(--border);border-radius:var(--radius);padding:60px 32px;text-align:center;cursor:pointer;transition:border-color .2s,background .2s;">
                <svg xmlns="http://www.w3.org/2000/svg" width="36" height="36" viewBox="0 0 24 24" fill="none" stroke="var(--accent)" stroke-width="1.75" style="margin-bottom:14px;"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="17 8 12 3 7 8"/><line x1="12" y1="3" x2="12" y2="15"/></svg>
                <div style="font-size:14px;font-weight:600;color:var(--text);margin-bottom:6px;">Drop Excel file here or click to browse</div>
                <div style="font-size:12px;color:var(--text-4);">.xlsx / .xls files supported</div>
              </div>
              <input type="file" id="prog-import-file" accept=".xlsx,.xls" style="display:none" onchange="handleProgImportFile(this)" />
              <div id="prog-import-preview-wrap"></div>
              <div style="font-size:12px;color:var(--text-3);margin-top:12px;background:var(--bg-4);border:1px solid var(--border);border-radius:var(--radius);padding:10px 12px;">
                <strong>Expected columns (row 1 = headers):</strong>
				<code>Discipline</code>, <code>Week Start</code> (any date format), <code>Planned %</code> (0–100).
				Each row = one discipline's planned progress for one week.
              </div>
            </div>
            <div class="modal-footer">
              <button class="btn btn-ghost" onclick="closeModal('prog-import-modal')">Cancel</button>
              <button class="btn btn-primary" id="prog-import-confirm-btn" onclick="confirmProgImport()" style="display:none;align-items:center;gap:5px;">${IC.save} Import</button>
            </div>
          </div>
        </div>
		
		<!-- KPI Modal -->
        <div class="modal" id="kpi-modal">
          <div class="modal-backdrop" onclick="closeModal('kpi-modal')"></div>
          <div class="modal-box" style="max-width:480px;">
            <div class="modal-header">
              <h3 id="kpi-modal-title" style="display:flex;align-items:center;gap:8px;">
                ${IC.plus} Add Target KPI
              </h3>
              <button class="modal-close" onclick="closeModal('kpi-modal')">✕</button>
            </div>
            <div class="modal-body" style="display:flex;flex-direction:column;gap:16px;padding:0;">

              <!-- Block 1: Details -->
              <div style="padding:16px 20px;border-bottom:1px solid var(--border);">
                <div style="font-size:11px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--accent);margin-bottom:12px;">Details</div>
                <input type="hidden" id="kpi-id" />
                <div class="form-group">
                  <label>Project</label>
                  <input type="text" id="kpi-project-display" disabled style="opacity:0.6;cursor:not-allowed;" />
                </div>
                <div class="form-group">
                  <label class="required">Discipline</label>
                  <select id="kpi-discipline"></select>
                </div>
                <div class="form-group">
                  <label>Activity Type</label>
                  <select id="kpi-activity-type" onchange="onKpiActivityChange()">
                    <option value="model">3D Model</option>
                    <option value="drawing" selected>Drawings</option>
                    <option value="test_package">Test Package</option>
                    <option value="materials">Materials</option>
                    <option value="calculations">Calculations</option>
                  </select>
                </div>
                <div class="form-group">
                  <label class="required">Doc Code</label>
                  <select id="kpi-doc-code"></select>
                </div>
                <div class="form-group">
                  <label class="required">Workflow Step</label>
                  <select id="kpi-step"></select>
                </div>
                <div class="form-group" style="margin-bottom:0;">
                  <label id="kpi-value-label">Target Value</label>
                  <input type="number" id="kpi-value" min="0" step="0.01" placeholder="0.00" />
                </div>
              </div>

              <!-- Block 2: Area Breakdown -->
              <div style="padding:16px 20px;">
                <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:12px;">
				  <div style="font-size:11px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--accent);">Estimated Output by Area</div>
                  <span style="font-size:11px;color:var(--text-4);">Total: <strong id="kpi-area-total" style="color:var(--accent);">0</strong></span>
                </div>
                <div id="kpi-area-breakdown" style="overflow:hidden;max-height:240px;overflow-y:auto;">
                  <div style="text-align:center;padding:20px;color:var(--text-4);font-size:12px;">Loading areas…</div>
                </div>
                <input type="hidden" id="kpi-estimated-output" />
                <div style="font-size:11px;color:var(--text-4);margin-top:6px;">Auto-summed from area inputs. Can be filled in later.</div>
              </div>

            </div>
            <div class="modal-footer">
              <button class="btn btn-ghost" onclick="closeModal('kpi-modal')">Cancel</button>
              <button class="btn btn-primary" id="kpi-save-btn" onclick="saveKpi()" style="display:flex;align-items:center;gap:5px;">${IC.save} Save</button>
            </div>
          </div>
        </div>

        <!-- KPI Import Modal -->
        <div class="modal" id="kpi-import-modal">
          <div class="modal-backdrop" onclick="closeModal('kpi-import-modal')"></div>
          <div class="modal-box" style="max-width:720px;">
            <div class="modal-header">
              <h3 style="display:flex;align-items:center;gap:8px;">${IC.upload} Import Target KPI from Excel</h3>
              <button class="modal-close" onclick="closeModal('kpi-import-modal')">✕</button>
            </div>
            <div class="modal-body">
              <div class="import-drop" id="kpi-import-drop" onclick="document.getElementById('kpi-import-file').click()"
                ondragover="event.preventDefault();this.classList.add('drag-over')"
                ondragleave="this.classList.remove('drag-over')"
                ondrop="handleKpiImportDrop(event)"
                style="border:2px dashed var(--border);border-radius:var(--radius);padding:60px 32px;text-align:center;cursor:pointer;transition:border-color .2s,background .2s;">
                <svg xmlns="http://www.w3.org/2000/svg" width="36" height="36" viewBox="0 0 24 24" fill="none" stroke="var(--accent)" stroke-width="1.75" style="margin-bottom:14px;"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="17 8 12 3 7 8"/><line x1="12" y1="3" x2="12" y2="15"/></svg>
                <div style="font-size:14px;font-weight:600;color:var(--text);margin-bottom:6px;">Drop Excel file here or click to browse</div>
                <div style="font-size:12px;color:var(--text-4);">.xlsx / .xls files supported</div>
              </div>
              <input type="file" id="kpi-import-file" accept=".xlsx,.xls" style="display:none" onchange="handleKpiImportFile(this)" />
              <div id="kpi-import-preview-wrap"></div>
              <div style="font-size:12px;color:var(--text-3);margin-top:12px;background:var(--bg-4);border:1px solid var(--border);border-radius:var(--radius);padding:10px 12px;">
                <strong>Expected column headers:</strong>
                Discipline, Doc Code, Workflow Step, Target Value, Estimated Output.<br>
                Discipline, Doc Code and Workflow Step must match existing app coding. Activity Type and Doc Type are derived automatically from the Doc Code.<br>
                Optional: add one column per area name (matching the Area Breakdown table) to import per-area estimated output — these override the Estimated Output column when present.
              </div>
            </div>
            <div class="modal-footer">
              <button class="btn btn-ghost" onclick="closeModal('kpi-import-modal')">Cancel</button>

    // ─── LOAD LOOKUPS ─────────────────────────────────────────────────────────
    async function loadRolesAndDiscs() {
      const [{ data: roles }, { data: discs }, { data: projects }] = await Promise.all([
        db.from('roles').select('*').order('name'),
        db.from('disciplines').select('*').order('name'),
        db.from('projects').select('id,name,code,start_date,end_date').order('name'),
      ]);
      rolesData       = roles || [];
      disciplinesData = discs || [];
      projectsData    = projects || [];

      // Position modal
      document.getElementById('t-role').innerHTML = `<option value="">— Select —</option>` + rolesData.map(r => `<option value="${r.key}">${r.name}</option>`).join('');
      document.getElementById('t-discipline').innerHTML = `<option value="">— Select —</option>` + disciplinesData.map(d => `<option value="${d.id}">${d.name}</option>`).join('');
      document.getElementById('t-project').innerHTML = `<option value="">— Select —</option>` + projectsData.map(p => `<option value="${p.id}">${p.code} — ${p.name}</option>`).join('');

      // Filters
	  const posProjSel = document.getElementById('target-proj-select');
      if (posProjSel) {
        posProjSel.innerHTML = `<option value="">— Select a project —</option>` +
          projectsData.map(p => `<option value="${p.id}">${p.code} — ${p.name}</option>`).join('');
      }

      // Histogram project select
      document.getElementById('histo-proj-select').innerHTML = `<option value="">— Select a project —</option>` +
        projectsData.map(p => {
          const hasDate = p.start_date && p.end_date;
          return `<option value="${p.id}" ${!hasDate ? 'style="color:var(--text-4)"' : ''}>${p.code} — ${p.name}${!hasDate ? ' (no dates set)' : ''}</option>`;
        }).join('');
		
	  const kpiSel = document.getElementById('kpi-proj-select');
         if (kpiSel) {
           projectsData.forEach(p => {
             kpiSel.innerHTML += `<option value="${p.id}">${p.code ? p.code + ' — ' : ''}${p.name}</option>`;
           });
         }
        
      // Progress project select
      populateProgProjectSelect();

      // ROC project select
      const rocSel = document.getElementById('roc-proj-select');
      if (rocSel) {
        rocSel.innerHTML = `<option value="">— Select a project —</option>` +
          projectsData.map(p => `<option value="${p.id}">${p.code ? p.code + ' — ' : ''}${p.name}</option>`).join('');
      }
    }

    async function loadTargets() {
      const tbody = document.getElementById('target-tbody');
      if (tbody) tbody.innerHTML = `<tr><td colspan="6" style="text-align:center;padding:30px;color:var(--text-4);">Loading…</td></tr>`;
      const { data, error } = await db.from('targets')
        .select('*, disciplines(name), projects(name, code)')
        .order('position');
      if (error) {
        if (tbody) tbody.innerHTML = `<tr><td colspan="6" style="text-align:center;padding:30px;color:var(--red);">Error loading targets.</td></tr>`;
        return;
      }
      targetsData = (data || []).map(t => ({ ...t, roles: rolesData.find(r => r.key === t.role_key) || null }));
      if (posProjectId) {
        filterTargets(document.getElementById('target-search')?.value || '');
      }
    }

    function renderTargets(list) {
      const tbody = document.getElementById('target-tbody');
      if (!list.length) { tbody.innerHTML = `<tr><td colspan="6" style="text-align:center;padding:40px;color:var(--text-4);">No positions yet. Click "+ Add Position" to get started.</td></tr>`; return; }
      tbody.innerHTML = list.map((t, i) => {
        const roleColor = t.roles?.badge_color || '#546E7A';
        return `<tr>
          <td style="font-weight:600;color:var(--text);">${t.position || '—'}</td>
          <td style="text-align:center;">${t.projects ? `<span class="badge badge-gray" style="font-family:monospace;">${t.projects.code}</span>` : '<span style="color:var(--text-4);">—</span>'}</td>
          <td style="text-align:center;">${t.roles ? `<span class="badge" style="background-color:${roleColor}22;color:${roleColor};border-color:${roleColor}55;">${t.roles.name}</span>` : '<span style="color:var(--text-4);">—</span>'}</td>
          <td style="text-align:center;">${t.disciplines ? `<span class="badge badge-gray">${t.disciplines.name}</span>` : '<span style="color:var(--text-4);">—</span>'}</td>
          <td style="text-align:center;font-weight:600;color:var(--accent);font-variant-numeric:tabular-nums;">${Number(t.allotted_manhours || 0).toLocaleString()} hrs</td>
          <td style="text-align:center;">
			<div class="table-actions" style="justify-content:center;">
              <button class="btn btn-icon edit"   onclick="openEditTarget(${i})" title="Edit">${IC.edit}</button>
              <button class="btn btn-icon delete" onclick="deleteTarget('${t.id}')" title="Delete">${IC.trash}</button>
            </div>
          </td>
        </tr>`;
      }).join('');
      // Update total
      const total = list.reduce((s, t) => s + (t.allotted_manhours || 0), 0);
      const totalEl = document.getElementById('target-total-mh');
      if (totalEl) totalEl.textContent = total > 0 ? Number(total).toLocaleString() + ' hrs' : '—';
    }

    function filterTargets(search) {
      const roleFilter = document.getElementById('target-role-filter')?.value || '';
      const discFilter = document.getElementById('target-disc-filter')?.value || '';
      const q = (search || '').toLowerCase();
      renderTargets(targetsData.filter(t => {
        const matchProj   = t.project_id === posProjectId;   // always filter by selected project
        const matchSearch = !q || t.position?.toLowerCase().includes(q) || t.roles?.name?.toLowerCase().includes(q) || t.disciplines?.name?.toLowerCase().includes(q);
        const matchRole   = !roleFilter || t.role_key === roleFilter;
        const matchDisc   = !discFilter || t.discipline_id === discFilter;
        return matchProj && matchSearch && matchRole && matchDisc;
      }));
    }

    function updatePositionLabel() {
      const roleKey  = document.getElementById('t-role').value;
      const discId   = document.getElementById('t-discipline').value;
      const roleName = rolesData.find(r => r.key === roleKey)?.name || '';
      const discName = disciplinesData.find(d => d.id === discId)?.name || '';
      const posField = document.getElementById('t-position');
      if (roleName && discName) {
        posField.placeholder = `${roleName} - ${discName}`;
        if (!posField.dataset.customized) posField.value = `${roleName} - ${discName}`;
      }
    }

    function openAddTarget() {
      document.getElementById('t-id').value = '';
      document.getElementById('t-project').value = localStorage.getItem('activeProjectId') || '';
      document.getElementById('t-role').value = '';
      document.getElementById('t-discipline').value = '';
      document.getElementById('t-position').value = '';
      document.getElementById('t-position').dataset.customized = '';
      document.getElementById('t-manhours').value = '';
      document.getElementById('target-modal-title').innerHTML = `${IC.target} Add Position`;
      openModal('target-modal');
      setTimeout(() => document.getElementById('t-role').focus(), 100);
    }

    function openEditTarget(index) {
      const t = targetsData[index];
      if (!t) return;
      document.getElementById('t-id').value         = t.id;
      document.getElementById('t-project').value    = t.project_id || '';
      document.getElementById('t-role').value       = t.role_key || '';
      document.getElementById('t-discipline').value = t.discipline_id || '';
      document.getElementById('t-position').value   = t.position || '';
      document.getElementById('t-position').dataset.customized = 'yes';
      document.getElementById('t-manhours').value   = t.allotted_manhours || '';
      document.getElementById('target-modal-title').innerHTML = `${IC.target} Edit Position`;
      openModal('target-modal');
      setTimeout(() => document.getElementById('t-position').focus(), 100);
    }

    async function saveTarget() {
      const btn = document.getElementById('target-save-btn');
      const id  = document.getElementById('t-id').value;
      const project_id     = document.getElementById('t-project').value || null;
      const role_key       = document.getElementById('t-role').value;
      const discipline_id  = document.getElementById('t-discipline').value || null;
      const position       = document.getElementById('t-position').value.trim();
      const allotted_manhours = parseFloat(document.getElementById('t-manhours').value);
      if (!role_key)             { toast('Role is required.', 'error'); return; }
      if (!position)             { toast('Position is required.', 'error'); document.getElementById('t-position').focus(); return; }
      if (isNaN(allotted_manhours) || allotted_manhours < 0) { toast('Enter a valid manhour value.', 'error'); return; }
      btn.disabled = true; btn.textContent = 'Saving…';
      const { error } = id
        ? await db.from('targets').update({ project_id, role_key, discipline_id, position, allotted_manhours }).eq('id', id)
        : await db.from('targets').insert({ project_id, role_key, discipline_id, position, allotted_manhours });
      btn.disabled = false; btn.innerHTML = `${IC.save} Save`;
      if (error) { toast('Error: ' + error.message, 'error'); return; }
      toast(id ? 'Position updated.' : 'Position added.', 'success');
      closeModal('target-modal');
      await loadTargets();
    }

    async function deleteTarget(id) {
      confirmDialog('Delete this position target?', async () => {
        const { error } = await db.from('targets').delete().eq('id', id);
        if (error) { toast('Error: ' + error.message, 'error'); return; }
        toast('Position deleted.', 'success');
        await loadTargets();
      });
    }
	
	async function deleteAllTargets() {
      if (!targetsData.length) { toast('No positions to delete.', 'info'); return; }
      confirmDialog(`Delete all ${targetsData.length} position(s)? This cannot be undone.`, async () => {
        const ids = targetsData.map(t => t.id);
        const { error } = await db.from('targets').delete().in('id', ids);
        if (error) { toast('Error: ' + error.message, 'error'); return; }
        toast('All positions deleted.', 'success');
        await loadTargets();
      });
    }

    // ─── HISTOGRAM TAB ────────────────────────────────────────────────────────
    async function onHistoProjectChange(projId) {
      histoProjectId = projId || null;
      histoProject   = projectsData.find(p => p.id === projId) || null;
      histoSchedule  = {};
      histoDirty     = {};
      markDirty(false);

      if (!projId || !histoProject) {
        document.getElementById('histo-content').innerHTML = `<div style="text-align:center;padding:60px;color:var(--text-4);font-size:13px;">Select a project above to view and edit its manhour histogram.</div>`;
        document.getElementById('histo-proj-info').textContent = '';
        return;
      }

      if (!histoProject.start_date || !histoProject.end_date) {
        document.getElementById('histo-content').innerHTML = `
          <div style="text-align:center;padding:60px;color:var(--text-4);font-size:13px;">
            This project has no start/end dates set.<br/>
            <a href="admin.html" style="color:var(--accent);text-decoration:none;">Go to Admin → Projects</a> to set the dates.
          </div>`;
        document.getElementById('histo-proj-info').textContent = '';
        return;
      }

      // Build months array
      histoMonths = buildMonths(histoProject.start_date, histoProject.end_date);
      document.getElementById('histo-proj-info').textContent =
        `${fmtMonth(histoMonths[0])} → ${fmtMonth(histoMonths[histoMonths.length - 1])} · ${histoMonths.length} months`;

      document.getElementById('histo-content').innerHTML = `<div style="text-align:center;padding:40px;color:var(--text-4);"><div class="spinner"></div></div>`;

      // Load positions for this project
      const projectTargets = targetsData.filter(t => t.project_id === projId);
      if (!projectTargets.length) {
        document.getElementById('histo-content').innerHTML = `
          <div style="text-align:center;padding:60px;color:var(--text-4);font-size:13px;">
            No positions defined for this project.<br/>
            <span style="cursor:pointer;color:var(--accent);" onclick="switchTab('positions',document.querySelectorAll('.tab-btn')[0])">Go to Positions tab</span> to add them first.
          </div>`;
        return;
      }

      // Load existing schedule data
      const targetIds = projectTargets.map(t => t.id);
      const { data: schedRows } = await db.from('target_schedule')
        .select('*')
        .in('target_id', targetIds);

      histoSchedule = {};
      projectTargets.forEach(t => { histoSchedule[t.id] = {}; });
      (schedRows || []).forEach(r => {
        const key = r.period.substring(0, 7); // YYYY-MM
        if (!histoSchedule[r.target_id]) histoSchedule[r.target_id] = {};
        histoSchedule[r.target_id][key] = { manhours: r.manhours || 0, headcount: r.headcount || 0, db_id: r.id };
      });

      renderHistoGrid(projectTargets);
    }

    function buildMonths(startStr, endStr) {
      const months = [];
      const start  = new Date(startStr);
      const end    = new Date(endStr);
      start.setDate(1); end.setDate(1);
      const cur = new Date(start);
      while (cur <= end) {
        months.push(new Date(cur));
        cur.setMonth(cur.getMonth() + 1);
      }
      return months;
    }

    function fmtMonth(d) {
      return d.toLocaleDateString('en-US', { month: 'short', year: '2-digit' });
    }

    function periodKey(d) {
      return d.toISOString().substring(0, 7); // YYYY-MM
    }

    function onCellChange(input) {
      const tid    = input.dataset.tid;
      const period = input.dataset.period;
      const field  = input.dataset.field;
      const val    = parseFloat(input.value) || 0;

      if (!histoSchedule[tid]) histoSchedule[tid] = {};
      if (!histoSchedule[tid][period]) histoSchedule[tid][period] = { manhours: 0, headcount: 0 };
      histoSchedule[tid][period][field] = val;

      if (!histoDirty[tid]) histoDirty[tid] = {};
      histoDirty[tid][period] = true;
      markDirty(true);

      // Recalc row total for this target
      const projectTargets = targetsData.filter(t => t.project_id === histoProjectId);
      const t = projectTargets.find(x => x.id === tid);
      if (t) recalcRowTotal(t);
      recalcColTotals(period);

      // Auto-save debounce
      clearTimeout(histoAutoSave);
      histoAutoSave = setTimeout(saveHistogram, 3000);
    }
	
	function clearRow(tid, field) {
      confirmDialog(`Clear all ${field === 'headcount' ? 'MP' : 'MH'} values for this position?`, () => {
        histoMonths.forEach(m => {
          const key = periodKey(m);
          if (!histoSchedule[tid]) histoSchedule[tid] = {};
          if (!histoSchedule[tid][key]) histoSchedule[tid][key] = { manhours: 0, headcount: 0 };
          histoSchedule[tid][key][field] = 0;
          if (!histoDirty[tid]) histoDirty[tid] = {};
          histoDirty[tid][key] = true;
    
          // Update input in DOM
          const input = document.querySelector(
            `input[data-tid="${tid}"][data-period="${key}"][data-field="${field}"]`
          );
          if (input) input.value = '';
        });
    
        markDirty(true);
        const projectTargets = targetsData.filter(t => t.project_id === histoProjectId);
        const t = projectTargets.find(x => x.id === tid);
        if (t) recalcRowTotal(t);
        histoMonths.forEach(m => recalcColTotals(periodKey(m)));
    
        clearTimeout(histoAutoSave);
        histoAutoSave = setTimeout(saveHistogram, 3000);
      });
    }

    function recalcAllTotals(projectTargets) {
      projectTargets.forEach(t => recalcRowTotal(t));
      histoMonths.forEach(m => recalcColTotals(periodKey(m)));
    }

    function recalcRowTotal(t) {
      const sched    = histoSchedule[t.id] || {};
      const totalMH = histoMonths.reduce((s, m) => {
        const entry = sched[periodKey(m)] || {};
        return s + ((entry.headcount || 0) * (entry.manhours || 0) * 26);
      }, 0);
      const allotted = t.allotted_manhours || 0;
      const el = document.getElementById(`total-mh-${t.id}`);
      if (!el) return;
      const pct = allotted > 0 ? Math.round(totalMH / allotted * 100) : 0;
      let cls = totalMH === 0 ? 'total-zero' : totalMH > allotted ? 'total-over' : 'total-ok';
      el.innerHTML = `<span class="${cls}" style="font-variant-numeric:tabular-nums;">${Number(totalMH).toLocaleString()}</span>
        <div style="font-size:10px;color:var(--text-4);">${pct}%</div>`;
    }

    function recalcColTotals(period) {
      const projectTargets = targetsData.filter(t => t.project_id === histoProjectId);
      let totalMP = 0, totalMH = 0;
      projectTargets.forEach(t => {
        const sched = histoSchedule[t.id] || {};
        totalMP += sched[period]?.headcount || 0;
        totalMH += ((sched[period]?.headcount || 0) * (sched[period]?.manhours || 0) * 26);
      });
      const mpEl = document.getElementById(`foot-mp-${period}`);
      const mhEl = document.getElementById(`foot-mh-${period}`);
      if (mpEl) mpEl.textContent = totalMP || '';
      if (mhEl) mhEl.textContent = totalMH ? Number(totalMH).toLocaleString() : '';
    
      // Peak MP — highest monthly total across all months
      const allMpTotals = histoMonths.map(m => {
        const el = document.getElementById('foot-mp-' + periodKey(m));
        return el ? (parseFloat(el.textContent) || 0) : 0;
      });
      const peak = Math.max(...allMpTotals);
      const peakEl = document.getElementById('foot-peak');
      if (peakEl) peakEl.textContent = peak > 0 ? peak : '—';
    
      // Grand Total MH — sum of all monthly MH totals
      const allMhTotals = histoMonths.map(m => {
        const el = document.getElementById('foot-mh-' + periodKey(m));
        return el ? (parseFloat(el.textContent.replace(/,/g, '')) || 0) : 0;
      });
      const grandTotal = allMhTotals.reduce((s, v) => s + v, 0);
      const totalEl = document.getElementById('foot-total-mh');
      if (totalEl) totalEl.textContent = grandTotal > 0 ? Number(grandTotal).toLocaleString() : '—';
    }

    function markDirty(isDirty) {
      const dot = document.getElementById('histo-dirty-dot');
      if (dot) dot.classList.toggle('dirty', isDirty);
    }
	
	async function clearAllHistogram() {
      if (!histoProjectId) { toast('No project selected.', 'info'); return; }
      const projectTargets = targetsData.filter(t => t.project_id === histoProjectId);
      if (!projectTargets.length) { toast('No positions in this project.', 'info'); return; }
    
      confirmDialog('Clear all histogram data for this project? This cannot be undone.', async () => {
        const ids = projectTargets.map(t => t.id);
        const { error } = await db.from('target_schedule').delete().in('target_id', ids);
        if (error) { toast('Error: ' + error.message, 'error'); return; }
    
        // Reset local state
        histoSchedule = {};
        histoDirty    = {};
        markDirty(false);
    
        toast('Histogram cleared.', 'success');
        await onHistoProjectChange(histoProjectId);
      });
    }

    async function saveHistogram(isManual = false) {
      if (histoSaving) return;
      const dirtyTargets = Object.keys(histoDirty);
      if (!dirtyTargets.length) return;
      histoSaving = true;
      const btn = document.getElementById('histo-save-btn');
      if (btn) { btn.textContent = 'Saving…'; btn.disabled = true; }
    
      const upserts = [];
      dirtyTargets.forEach(tid => {
        Object.keys(histoDirty[tid]).forEach(period => {
          const entry = histoSchedule[tid]?.[period] || {};
          upserts.push({
            target_id: tid,
            period:    period + '-01',
            manhours:  entry.manhours  || 0,
            headcount: entry.headcount || 0,
          });
        });
      });
    
      const { error } = await db.from('target_schedule')
        .upsert(upserts, { onConflict: 'target_id,period' });
    
      histoSaving = false;
      if (btn) { btn.innerHTML = `${IC.save} Save`; btn.disabled = false; }
      if (error) { toast('Error saving: ' + error.message, 'error'); return; }
    
      histoDirty = {};
      markDirty(false);
      toast(isManual ? 'Histogram saved.' : 'Histogram auto-saved.', 'success');
    }

    // ─── EXCEL IMPORT ─────────────────────────────────────────────────────────
    let importParsedData = null;

    function openImportModal() {
      if (!histoProjectId) { toast('Select a project first.', 'error'); return; }
      document.getElementById('import-preview-wrap').innerHTML = '';
      document.getElementById('import-confirm-btn').style.display = 'none';
      document.getElementById('import-file').value = '';
      importParsedData = null;
      openModal('import-modal');
    }

    function handleImportDrop(e) {
      e.preventDefault();
      document.getElementById('import-drop').classList.remove('drag-over');
      const file = e.dataTransfer?.files?.[0];
      if (file) processImportFile(file);
    }

    function handleImportFile(input) {
      const file = input.files?.[0];
      if (file) processImportFile(file);
    }

    function processImportFile(file) {
      if (!file.name.match(/\.xlsx?$/i)) { toast('Please upload an .xlsx or .xls file.', 'error'); return; }
      const reader = new FileReader();
      reader.onload = (e) => {
        try {
          const wb   = XLSX.read(e.target.result, { type: 'array' });
          const ws   = wb.Sheets[wb.SheetNames[0]];
          const rows = XLSX.utils.sheet_to_json(ws, { header: 1, defval: '' });
          parseHistogramExcel(rows);
        } catch (err) {
          toast('Failed to read file: ' + err.message, 'error');
        }
      };
      reader.readAsArrayBuffer(file);
    }

function parseHistogramExcel(rows) {
  if (!rows.length) { toast('No data found in file.', 'error'); return; }

  // Row 0 is the header — find month columns from date values
  const headerRow = rows[0];
  const monthCols = [];

  headerRow.forEach((cell, ci) => {
    if (ci < 2) return; // skip Position and Discipline columns
    let date = null;

    if (cell instanceof Date) {
      date = cell;
    } else if (typeof cell === 'number') {
      // Excel serial date
      date = new Date(Math.round((cell - 25569) * 86400 * 1000));
    } else if (typeof cell === 'string') {
      // Try "Jun-26" or "2026-06" or "06 01 2026"
      const monthNames = { jan:0,feb:1,mar:2,apr:3,may:4,jun:5,jul:6,aug:7,sep:8,oct:9,nov:10,dec:11 };
      const m1 = cell.trim().match(/^([A-Za-z]{3})-(\d{2})$/);
      const m2 = cell.trim().match(/^(\d{4})-(\d{2})$/);
      const m3 = cell.trim().match(/^(\d{2})\s(\d{2})\s(\d{4})$/);
      if (m1) date = new Date(2000 + parseInt(m1[2]), monthNames[m1[1].toLowerCase()], 1);
      else if (m2) date = new Date(parseInt(m2[1]), parseInt(m2[2]) - 1, 1);
      else if (m3) date = new Date(parseInt(m3[3]), parseInt(m3[1]) - 1, 1);
    }

    if (date && !isNaN(date)) {
      const y = date.getFullYear();
      const mo = String(date.getMonth() + 1).padStart(2, '0');
      const key = `${y}-${mo}`;
      const label = date.toLocaleString('en', { month: 'short' }) + '-' + String(y).slice(2);
      monthCols.push({ colIdx: ci, date, key, label });
    }
  });

  if (!monthCols.length) {
    toast('Could not find month columns in header row.', 'error');
    return;
  }

  // Parse paired MP/MH rows starting from row 1
  const parsed = [];
  let i = 1;
  while (i < rows.length) {
    const rowA = rows[i];
    const rowB = rows[i + 1];
    if (!rowA) { i++; continue; }

    const posName  = String(rowA[0] || '').trim();
    const discCode = String(rowA[1] || '').trim();

    if (!posName) { i++; continue; }

    const mpVals = {}, mhVals = {};
    monthCols.forEach(mc => {
      const mpV = parseFloat(rowA[mc.colIdx]) || 0;
      const mhV = rowB ? parseFloat(rowB[mc.colIdx]) || 0 : 0;
      if (mpV) mpVals[mc.key] = mpV;
      if (mhV) mhVals[mc.key] = mhV;
    });

    const hasData = Object.keys(mpVals).length > 0 || Object.keys(mhVals).length > 0;
    if (hasData) {
      parsed.push({ position: posName, discCode, mp: mpVals, mh: mhVals });
    }
    i += 2; // always skip 2 rows (MP + MH pair)
  }

  if (!parsed.length) {
    toast('No data rows found in the file.', 'error');
    return;
  }

  importParsedData = { parsed, monthCols };
  renderImportPreview(parsed, monthCols);
}

    function parseMonthLabel(label) {
      // "May-26" → Date(2026, 4, 1)
      const months = { jan:0, feb:1, mar:2, apr:3, may:4, jun:5, jul:6, aug:7, sep:8, oct:9, nov:10, dec:11 };
      const [mon, yr] = label.split('-');
      const m = months[mon.toLowerCase()];
      if (m === undefined) return null;
      const y = parseInt(yr) + 2000;
      return new Date(y, m, 1);
    }

	// ─── POSITION IMPORT ─────────────────────────────────────────────────────
    let posImportParsed = null;
    
    function openPositionImportModal() {
      document.getElementById('pos-import-preview-wrap').innerHTML = '';
      document.getElementById('pos-import-confirm-btn').style.display = 'none';
      document.getElementById('pos-import-file').value = '';
      posImportParsed = null;
      openModal('pos-import-modal');
    }
    
    function handlePosImportDrop(e) {
      e.preventDefault();
      document.getElementById('pos-import-drop').classList.remove('drag-over');
      const file = e.dataTransfer?.files?.[0];
      if (file) processPosImportFile(file);
    }
    
    function handlePosImportFile(input) {
      const file = input.files?.[0];
      if (file) processPosImportFile(file);
    }
    
    function processPosImportFile(file) {
      if (!file.name.match(/\.xlsx?$/i)) { toast('Please upload an .xlsx or .xls file.', 'error'); return; }
      const reader = new FileReader();
      reader.onload = (e) => {
        try {
          const wb   = XLSX.read(e.target.result, { type: 'array' });
          const ws   = wb.Sheets[wb.SheetNames[0]];
          const rows = XLSX.utils.sheet_to_json(ws, { defval: '' });
          parsePosImportRows(rows);
        } catch (err) {
          toast('Failed to read file: ' + err.message, 'error');
        }
      };
      reader.readAsArrayBuffer(file);
    }
    
    function parsePosImportRows(rows) {
      if (!rows.length) { toast('No data found in file.', 'error'); return; }
	  
	 // Normalize keys — strip whitespace and BOM from all header keys
       rows = rows.map(row => {
         const clean = {};
         Object.keys(row).forEach(k => { clean[k.trim().replace(/^\uFEFF/, '')] = row[k]; });
         return clean;
       });
    
      const parsed = [];
      const errors = [];
    
      rows.forEach((row, i) => {
        const position  = String(row['Position'] || '').trim();
        const roleRaw   = String(row['Role'] || '').trim();
        const discRaw   = String(row['Discipline'] || '').trim();
        const projRaw   = String(row['Project'] || '').trim();
        const manhours  = parseFloat(row['Allotted Manhours']) || 0;
    
        if (!position) { errors.push(`Row ${i+2}: missing Position`); return; }
        if (!roleRaw)  { errors.push(`Row ${i+2}: missing Role`); return; }
    
        // Match role by name or key
        const role = rolesData.find(r =>
          r.name.toLowerCase() === roleRaw.toLowerCase() ||
          r.key.toLowerCase()  === roleRaw.toLowerCase()
        );
        if (!role) { errors.push(`Row ${i+2}: unknown role "${roleRaw}"`); return; }
    
        // Match discipline (optional)
        const disc = discRaw ? disciplinesData.find(d =>
          d.name.toLowerCase() === discRaw.toLowerCase()
        ) : null;
    
        // Match project (optional) by name or code
        const proj = projRaw ? projectsData.find(p =>
          p.name.toLowerCase() === projRaw.toLowerCase() ||
          p.code.toLowerCase() === projRaw.toLowerCase()
        ) : null;
    
        parsed.push({ position, role_key: role.key, roleName: role.name, discipline_id: disc?.id || null, discName: disc?.name || '—', project_id: proj?.id || null, projCode: proj?.code || '—', allotted_manhours: manhours });
      });
    
      if (errors.length) {
        toast(errors.slice(0, 3).join(' | ') + (errors.length > 3 ? ` (+${errors.length-3} more)` : ''), 'error');
        if (!parsed.length) return;
      }
    
      posImportParsed = parsed;
    
      // Render preview
      let html = `
        <div style="margin:14px 0 8px;font-size:12px;color:var(--text-3);">
          <strong style="color:var(--text);">${parsed.length} positions</strong> ready to import.
          ${errors.length ? `<span style="color:var(--red);margin-left:8px;">${errors.length} rows skipped.</span>` : ''}
        </div>

let progProjectId  = null;
let progProject    = null;   // full project object (has week_start_day)
let progWeeks      = [];     // sorted array of week_start date strings 'YYYY-MM-DD'
let progDiscs      = [];     // disciplines with positions in project [{id,name}]
let progRoc        = {};     // { discipline_id: roc_pct }

// ── Helpers ───────────────────────────────────────────────────────
function getWeekStart(date, weekStartDay) {
  // weekStartDay: 0=Sun,1=Mon,2=Tue,3=Wed,4=Thu,5=Fri,6=Sat
  const d = new Date(date);
  const day = d.getDay();
  const diff = (day - weekStartDay + 7) % 7;
  d.setDate(d.getDate() - diff);
  return d.toISOString().substring(0, 10);
}

function generateWeeks(startDate, endDate, weekStartDay) {
  const weeks = [];
  let cur = new Date(getWeekStart(startDate, weekStartDay));
  const end = new Date(endDate);
  while (cur <= end) {
    weeks.push(cur.toISOString().substring(0, 10));
    cur.setDate(cur.getDate() + 7);
  }
  return weeks;
}

function fmtWeekRange(weekStart) {
  const s = new Date(weekStart + 'T00:00:00');
  const e = new Date(s); e.setDate(e.getDate() + 6);
  const fmt = d => d.toLocaleDateString('en-US', { month: 'short', day: 'numeric' });
  return `${fmt(s)} – ${fmt(e)}`;
}

function fmtWeekYear(weekStart) {
  const s = new Date(weekStart + 'T00:00:00');
  return String(s.getFullYear()).slice(2);
}

// ── Project selector ──────────────────────────────────────────────
function populateProgProjectSelect() {
  const sel = document.getElementById('prog-proj-select');
  if (!sel) return;
  const cur = sel.value;
  sel.innerHTML = '<option value="">— Select a project —</option>';
  projectsData.forEach(p => {
    const o = document.createElement('option');
    o.value = p.id;
    o.textContent = `${p.code} — ${p.name}`;
    sel.appendChild(o);
  });
  if (cur) sel.value = cur;
}

async function onProgProjectChange(pid) {
  progProjectId = pid;
  progProject   = projectsData.find(p => p.id === pid) || null;
  progWeeks     = [];
  progDiscs     = [];
  progRoc       = {};
  progSchedule  = {};
  progDirty     = {};
  progRocDirty  = {};
  markProgDirty(false);

  const info    = document.getElementById('prog-proj-info');
  const content = document.getElementById('prog-content');

  if (!pid) {
    content.innerHTML = `<div style="text-align:center;padding:60px;color:var(--text-4);font-size:13px;">Select a project above to view and edit its planned progress.</div>`;
    if (info) info.textContent = '';
    return;
  }

  content.innerHTML = `<div style="text-align:center;padding:40px;color:var(--text-4);">Loading…</div>`;

  const weekStartDay = progProject?.week_start_day ?? 1;

  // Get project date range from project record, fallback to target_schedule
  let startDate = progProject?.start_date;
  let endDate   = progProject?.end_date;

  if (!startDate || !endDate) {
    const { data: schedRows } = await db
      .from('target_schedule')
      .select('period, targets!inner(project_id)')
      .eq('targets.project_id', pid)
      .order('period', { ascending: true });

    if (!schedRows?.length) {
      content.innerHTML = `<div style="text-align:center;padding:60px;color:var(--text-4);font-size:13px;">No histogram data found. Please fill the Histogram tab first.</div>`;
      return;
    }
    const periods = schedRows.map(r => r.period).sort();
    startDate = periods[0];
    endDate   = periods[periods.length - 1];
  }

  progWeeks = generateWeeks(startDate, endDate, weekStartDay);

  if (info) {
    info.textContent = `${fmtWeekRange(progWeeks[0])} → ${fmtWeekRange(progWeeks[progWeeks.length-1])} · ${progWeeks.length} weeks`;
  }

  // Get disciplines that have positions in this project
  const { data: targRows } = await db
    .from('targets')
    .select('discipline_id, disciplines(id,name)')
    .eq('project_id', pid)
    .not('discipline_id', 'is', null);

  const discMap = {};
  (targRows || []).forEach(r => {
    if (r.disciplines) discMap[r.disciplines.id] = r.disciplines.name;
  });
  progDiscs = Object.entries(discMap)
    .map(([id, name]) => ({ id, name }))
    .sort((a, b) => a.name.localeCompare(b.name));

  if (!progDiscs.length) {
    content.innerHTML = `<div style="text-align:center;padding:60px;color:var(--text-4);font-size:13px;">No disciplines found. Assign disciplines to positions in the Positions tab first.</div>`;
    return;
  }

  // Load ROC
  const { data: rocRows } = await db
    .from('project_discipline_roc')
    .select('*')
    .eq('project_id', pid);
  (rocRows || []).forEach(r => { progRoc[r.discipline_id] = parseFloat(r.roc) || 0; });

  // Load existing planned progress
  const { data: progRows } = await db
    .from('planned_progress')
    .select('*')
    .eq('project_id', pid);
  (progRows || []).forEach(r => {
    if (!progSchedule[r.discipline_id]) progSchedule[r.discipline_id] = {};
    progSchedule[r.discipline_id][r.week_start] = parseFloat(r.planned_pct);
  });

  renderProgGrid();
}

// ── Render grid ───────────────────────────────────────────────────
function renderProgGrid() {
  const content = document.getElementById('prog-content');
  if (!progWeeks.length || !progDiscs.length) return;

  // Group weeks by month (week belongs to month of its start date)
  const monthGroups = [];
  let curMonth = null, curCount = 0;
  progWeeks.forEach(w => {
    const d = new Date(w + 'T00:00:00');
    const key = `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}`;
    const label = d.toLocaleString('en', { month: 'short' }).toUpperCase() + ' ' + String(d.getFullYear()).slice(2);
    if (key !== curMonth) {
      if (curMonth) monthGroups.push({ label: monthGroups[monthGroups.length]?.label || label, count: curCount });
      // store label with the key
      curMonth = key;
      curCount = 1;
      monthGroups.push({ label, count: 0, key }); // placeholder, count filled at end
    } else {
      curCount++;
    }
  });
  // Fix: build properly
  const monthGroupsFinal = [];
  let lastKey = null;
  progWeeks.forEach(w => {
    const d = new Date(w + 'T00:00:00');
    const key = `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}`;
    const label = d.toLocaleString('en', { month: 'short' }).toUpperCase() + ' \'' + String(d.getFullYear()).slice(2);
    if (key !== lastKey) { monthGroupsFinal.push({ label, count: 1 }); lastKey = key; }
    else monthGroupsFinal[monthGroupsFinal.length-1].count++;
  });

  let html = `
  <div style="overflow-x:auto;">
  <table class="histo-table" style="border-collapse:collapse;">
    <thead>
      <tr>
        <th class="col-pos" style="min-width:120px;text-align:left;position:sticky;left:0;z-index:4;background:var(--bg-4);">DISCIPLINE</th>
        ${monthGroupsFinal.map(g => `<th colspan="${g.count}" style="text-align:center;border-left:2px solid var(--border-2);white-space:nowrap;">${g.label}</th>`).join('')}
      </tr>
      <tr>
        <th class="col-pos" style="position:sticky;left:0;z-index:4;background:var(--bg-4);font-size:10px;color:var(--text-4);">Week of</th>
        ${progWeeks.map(w => `<th style="min-width:90px;text-align:center;font-size:10px;white-space:nowrap;border-left:1px solid var(--border);">${fmtWeekRange(w)}</th>`).join('')}
      </tr>
    </thead>
    <tbody>
      ${progDiscs.map(d => {
        const sched = progSchedule[d.id] || {};
        const roc   = progRoc[d.id] || 0;
        return `<tr data-disc-id="${d.id}">
          <td class="col-pos" style="position:sticky;left:0;z-index:3;background:var(--bg-3);font-weight:600;font-size:12px;">${d.name}</td>
          ${progWeeks.map(w => {
            const val = sched[w];
            return `<td style="padding:3px 4px;text-align:center;border-left:1px solid var(--border);">
              <div style="position:relative;display:inline-flex;align-items:center;">
                <input type="number" class="cell-input" min="0" max="100" step="0.01"
                  data-prog-disc="${d.id}" data-prog-week="${w}"
                  value="${val != null ? val : ''}"
                  placeholder="—"
                  onchange="onProgCellChange(this)"
                  style="text-align:center;width:64px;" />
                <span style="position:absolute;right:4px;font-size:9px;color:var(--text-4);">%</span>
              </div>
            </td>`;
          }).join('')}
        </tr>`;
      }).join('')}
    </tbody>
    <tfoot>
      <tr style="border-top:2px solid var(--border-2);">
        <td class="col-pos" style="position:sticky;left:0;z-index:3;background:var(--bg-4);font-weight:700;font-size:11px;color:var(--text);text-transform:uppercase;letter-spacing:.05em;">Overall %</td>
        ${progWeeks.map(w => {
          const overall = progDiscs.reduce((s, d) => {
            const pct = (progSchedule[d.id] || {})[w];
            const roc = progRoc[d.id] || 0;
            return s + (pct != null ? (pct * roc / 100) : 0);
          }, 0);
          return `<td id="prog-overall-${w}" style="text-align:center;font-weight:700;color:var(--accent);font-size:12px;border-left:1px solid var(--border);">${overall > 0 ? overall.toFixed(1) + '%' : '—'}</td>`;
        }).join('')}
      </tr>
    </tfoot>
  </table>
  </div>`;

  content.innerHTML = html;
}

function recalcProgOverall(week) {
  const cell = document.getElementById(`prog-overall-${week}`);
  if (!cell) return;
  const overall = progDiscs.reduce((s, d) => {
    const pct = (progSchedule[d.id] || {})[week];
    const roc = progRoc[d.id] || 0;
    return s + (pct != null ? (pct * roc / 100) : 0);
  }, 0);
  cell.textContent = overall > 0 ? overall.toFixed(1) + '%' : '—';
}

// ── Cell changes ──────────────────────────────────────────────────
function onProgCellChange(input) {
  const discId = input.dataset.progDisc;
  const week   = input.dataset.progWeek;
  const val    = parseFloat(input.value);
  if (!progSchedule[discId]) progSchedule[discId] = {};
  progSchedule[discId][week] = isNaN(val) ? null : Math.min(100, Math.max(0, val));
  if (!progDirty[discId]) progDirty[discId] = {};
  progDirty[discId][week] = true;
  markProgDirty(true);
  recalcProgOverall(week);
  clearTimeout(progAutoSave);
  progAutoSave = setTimeout(saveProgress, 3000);
}

function markProgDirty(dirty) {
  const dot = document.getElementById('prog-dirty-dot');
  const btn = document.getElementById('prog-save-btn');
  if (dot) dot.style.display = dirty ? 'inline-block' : 'none';
  if (btn) btn.style.opacity = dirty ? '1' : '0.6';
}

async function onRocProjectChange(projId) {
  rocProjectId = projId || null;

  rocWorkflowSteps = {};
  rocItems     = {};
  rocDirty     = false;

    .eq('project_id', projId)
    .not('discipline_id', 'is', null);

  });
  rocDiscs = Object.entries(discMap).map(([id,name]) => ({ id, name })).sort((a,b) => a.name.localeCompare(b.name));

  const { data: codes } = await db.from('document_codes').select('id, type, code, activity_type').order('type');

  // Load workflow steps per activity type
  const { data: steps } = await db.from('workflow_steps').select('name, activity_type, sort_order').order('sort_order');

  (steps || []).forEach(s => {
    const t = s.activity_type || 'drawing';

    rocWorkflowSteps[t].push(s.name);

  // Load existing ROC items for this project

    .select('id, discipline_id, doc_code_id, weight, roc_step_items(id, step_name, weight)')
    .eq('project_id', projId);

  rocItems = {};

      id:     item.id,
      weight: parseFloat(item.weight) || 0,
      steps:  {}

        weight: parseFloat(s.weight) || 0

  // Load existing discipline-level ROC (project_discipline_roc)
  const { data: discRoc } = await db.from('project_discipline_roc')
    .select('discipline_id, roc')
    .eq('project_id', projId);
  rocDiscs = rocDiscs.map(d => ({
    ...d,
    roc: parseFloat((discRoc || []).find(r => r.discipline_id === d.id)?.roc || 0)
  }));

  renderRocGrid();
}
