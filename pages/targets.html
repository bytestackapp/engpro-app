function processRocImportFile(file) {
  if (!file.name.match(/\.xlsx?$/i)) { toast('Please upload an .xlsx or .xls file.', 'error'); return; }
  const reader = new FileReader();
  reader.onload = (e) => {
    try {
      const wb = XLSX.read(e.target.result, { type: 'array' });
      const discSheet = wb.Sheets['Disciplines'];
      const codeSheet = wb.Sheets['Doc Codes'];
      const stepSheet = wb.Sheets['Steps'];
      if (!discSheet || !codeSheet || !stepSheet) {
        toast('File must contain "Disciplines", "Doc Codes" and "Steps" sheets — use Export Excel first to get the correct template.', 'error');
        return;
      }
      const discRows = XLSX.utils.sheet_to_json(discSheet, { defval: '' });
      const codeRows = XLSX.utils.sheet_to_json(codeSheet, { defval: '' });
      const stepRows = XLSX.utils.sheet_to_json(stepSheet, { defval: '' });
      parseRocImportRows(discRows, codeRows, stepRows);
    } catch (err) {
      toast('Failed to read file: ' + err.message, 'error');
    }
  };
  reader.readAsArrayBuffer(file);
}

function parseRocImportRows(discRows, codeRows, stepRows) {
  if (!rocProjectId) { toast('Select a project first.', 'error'); return; }
  const currentProj = projectsData.find(p => p.id === rocProjectId);
  const discByName = {};
  rocDiscs.forEach(d => { discByName[d.name.toLowerCase()] = d; });
  const codeByCode = {};
  rocDocCodes.forEach(c => { codeByCode[c.code.toLowerCase()] = c; });

  const projMismatch = (row) => {
    const projCode = String(row['Project Code'] || '').trim();
    return projCode && currentProj && projCode.toLowerCase() !== currentProj.code.toLowerCase();
  };

  // Numeric, non-negative, rounded to 2 decimals. Blank cell = 0 (explicitly allowed).
  const parseWeight = (raw) => {
    if (raw === '' || raw === null || raw === undefined) return { ok: true, value: 0 };
    const w = parseFloat(raw);
    if (isNaN(w) || w < 0) return { ok: false, value: null };
    return { ok: true, value: Math.round(w * 100) / 100 };
  };

  let discSkipped = 0, codeSkipped = 0, stepSkipped = 0;
  const discReasons = new Set(), codeReasons = new Set(), stepReasons = new Set();

  const newDiscWeights = {};
  discRows.forEach((row, i) => {
    if (projMismatch(row)) { discSkipped++; discReasons.add('Project Code mismatch'); return; }
    const name = String(row['Discipline'] || '').trim();
    const d = discByName[name.toLowerCase()];
    if (!d) { discSkipped++; discReasons.add('Unknown Discipline'); return; }
    const { ok, value } = parseWeight(row['Weight %']);
    if (!ok) { discSkipped++; discReasons.add('Invalid Weight %'); return; }
    newDiscWeights[d.id] = value;
  });

  const newItems = {};
  let importedCodeCount = 0;
  codeRows.forEach((row, i) => {
    if (projMismatch(row)) { codeSkipped++; codeReasons.add('Project Code mismatch'); return; }
    const discName = String(row['Discipline'] || '').trim();
    const codeStr  = String(row['Doc Code'] || '').trim();
    const d = discByName[discName.toLowerCase()];
    const c = codeByCode[codeStr.toLowerCase()];
    if (!d) { codeSkipped++; codeReasons.add('Unknown Discipline'); return; }
    if (!c) { codeSkipped++; codeReasons.add('Unknown Doc Code'); return; }
    const { ok, value } = parseWeight(row['Weight %']);
    if (!ok) { codeSkipped++; codeReasons.add('Invalid Weight %'); return; }
    if (!newItems[d.id]) newItems[d.id] = {};
    newItems[d.id][c.id] = { weight: value, steps: {} };
    importedCodeCount++;
  });

  let importedStepCount = 0;
  stepRows.forEach((row, i) => {
    if (projMismatch(row)) { stepSkipped++; stepReasons.add('Project Code mismatch'); return; }
    const discName = String(row['Discipline'] || '').trim();
    const codeStr  = String(row['Doc Code'] || '').trim();
    const stepName = String(row['Step Name'] || '').trim();
    const d = discByName[discName.toLowerCase()];
    const c = codeByCode[codeStr.toLowerCase()];
    if (!d || !c) { stepSkipped++; stepReasons.add('Unknown Discipline/Doc Code'); return; }
    const actType = c.activity_type || 'drawing';
    const validSteps = rocWorkflowSteps[actType] || [];
    const matchedStep = validSteps.find(sn => sn.toLowerCase() === stepName.toLowerCase());
    if (!matchedStep) { stepSkipped++; stepReasons.add('Unknown Step'); return; }
    const { ok, value } = parseWeight(row['Weight %']);
    if (!ok) { stepSkipped++; stepReasons.add('Invalid Weight %'); return; }
    if (!newItems[d.id]) newItems[d.id] = {};
    if (!newItems[d.id][c.id]) newItems[d.id][c.id] = { weight: 0, steps: {} };
    newItems[d.id][c.id].steps[matchedStep] = { weight: value };
    importedStepCount++;
  });

  const totalSkipped = discSkipped + codeSkipped + stepSkipped;
  const totalRows = discRows.length + codeRows.length + stepRows.length;
  if (totalSkipped && totalSkipped === totalRows) {
    const allReasons = new Set([...discReasons, ...codeReasons, ...stepReasons]);
    toast(`No items imported. ${[...allReasons].join(', ') || 'Check the file and try again.'}`, 'error');
    return;
  }

  rocImportParsed = { discWeights: newDiscWeights, items: newItems };

  const skippedParts = [];
  if (discSkipped) skippedParts.push(`${discSkipped} disciplines`);
  if (codeSkipped) skippedParts.push(`${codeSkipped} document codes`);
  if (stepSkipped) skippedParts.push(`${stepSkipped} workflow steps`);
  const skippedReasons = [...new Set([...discReasons, ...codeReasons, ...stepReasons])].join(', ');

  document.getElementById('roc-import-preview-wrap').innerHTML = `
    <div style="margin:14px 0 8px;font-size:12px;color:var(--text-3);">
      <div style="color:var(--text);">Ready to import: <strong>${Object.keys(newDiscWeights).length} disciplines, ${importedCodeCount} document codes, ${importedStepCount} workflow steps</strong>.</div>
      ${totalSkipped ? `<div style="color:var(--red);margin-top:4px;">Skipped: ${skippedParts.join(', ')} (${skippedReasons}).</div>` : ''}
      <div style="margin-top:6px;color:var(--accent);">Imported data will overwrite all existing Rules of Credit weights for this project.</div>
    </div>`;
  document.getElementById('roc-import-confirm-btn').style.display = 'flex';
  document.getElementById('roc-import-back-btn').style.display = 'flex';
  document.getElementById('roc-import-drop').style.display = 'none';
}

async function confirmRocImport() {
  if (!rocImportParsed) return;
  const btn = document.getElementById('roc-import-confirm-btn');
  btn.textContent = 'Importing…'; btn.disabled = true;

  rocDiscs.forEach(d => { d.roc = rocImportParsed.discWeights[d.id] ?? 0; });
  rocItems = rocImportParsed.items;
  rocDirty = true;

  await saveRoc();   // reuses your existing, already-tested save logic

  btn.innerHTML = `${IC.save} Import`; btn.disabled = false;
  rocImportParsed = null;
  closeModal('roc-import-modal');
}

// A group is only flagged if it has real (non-zero) entries that don't sum to exactly 100%.
// An untouched, all-zero group is left alone — that's "not configured yet", not an error.
function rocStepGroupHasIssue(discId, codeId) {
  const c = rocDocCodes.find(x => x.id === codeId);
  if (!c) return false;
  const actType = c.activity_type || 'drawing';
  const steps = rocWorkflowSteps[actType] || [];
  if (!steps.length) return false;
  const stepData = rocItems[discId]?.[codeId]?.steps || {};
  const total = steps.reduce((s, n) => s + (stepData[n]?.weight || 0), 0);
  return total > 0 && Math.abs(total - 100) >= 0.01;
}

function rocCodeGroupHasIssue(discId) {
  const discCodes = rocItems[discId] || {};
  const total = rocDocCodes.reduce((s, c) => s + (discCodes[c.id]?.weight || 0), 0);
  return total > 0 && Math.abs(total - 100) >= 0.01;
}

// Bubbles up: a discipline is flagged if its own doc-code group is off, OR any
// doc code nested inside it has a step group that's off.
function rocDiscHasDescendantIssue(discId) {
  if (rocCodeGroupHasIssue(discId)) return true;
  return rocDocCodes.some(c => rocStepGroupHasIssue(discId, c.id));
}

function rocDiscLevelHasIssue() {
  const total = rocDiscs.reduce((s, d) => s + (d.roc || 0), 0);
  return total > 0 && Math.abs(total - 100) >= 0.01;
}

function rocHasAnyIssue() {
  return rocDiscLevelHasIssue() || rocDiscs.some(d => rocDiscHasDescendantIssue(d.id));
}

function renderRocTreeBody() {
  const body = document.getElementById('roc-tree-body');
  if (!body) return;

  const discTotal = rocDiscs.reduce((s, d) => s + (d.roc || 0), 0);
  const discOk    = Math.abs(discTotal - 100) < 0.01;

  let rows = '';

  rocDiscs.forEach(d => {
    const isOpen   = rocExpandedDiscs.has(d.id);
    const discFlag = rocDiscHasDescendantIssue(d.id);
    rows += `
      <tr style="border-bottom:1px solid var(--border);cursor:pointer;" onclick="toggleRocDisc('${d.id}')">
        <td style="padding:9px 12px;font-weight:700;">
          <span style="display:inline-block;width:14px;color:var(--text-4);">${isOpen ? '▾' : '▸'}</span>
          ${d.name}
        </td>
        <td style="padding:9px 12px;text-align:center;">
          <div style="display:inline-flex;align-items:center;gap:4px;" onclick="event.stopPropagation()">
            <input type="number" min="0" max="100" step="5"
              data-disc-roc="${d.id}" value="${d.roc || ''}" placeholder="0"
              onchange="onDiscRocChange(this)"
              style="width:60px;text-align:center;background:var(--bg-4);border:1px solid var(--border-2);border-radius:var(--radius);padding:4px 6px;color:var(--text);font-size:12px;outline:none;font-weight:700;" />
            <span style="font-size:11px;color:var(--text-4);">%</span>
			<span title="${discFlag ? "Sub-items don't sum to 100%" : ''}" style="display:inline-block;width:7px;height:7px;border-radius:50%;background:${discFlag ? 'var(--red,#ef4444)' : 'transparent'};flex-shrink:0;margin-left:3px;"></span>
          </div>
        </td>
      </tr>`;

    if (isOpen) {
      const discCodes = rocItems[d.id] || {};
      const codeTotal = rocDocCodes.reduce((s, c) => s + (discCodes[c.id]?.weight || 0), 0);
      const codeOk    = Math.abs(codeTotal - 100) < 0.01;

      rocDocCodes.forEach(c => {
        const codeKey   = d.id + '|' + c.id;
        const codeOpen  = rocExpandedCodes.has(codeKey);
        const val       = discCodes[c.id]?.weight || 0;
        const codeFlag  = rocStepGroupHasIssue(d.id, c.id);

        rows += `
          <tr style="border-bottom:1px solid var(--border);cursor:pointer;background:var(--bg-2);" onclick="toggleRocCode('${d.id}','${c.id}')">
            <td style="padding:8px 12px 8px 36px;">
              <span style="display:inline-block;width:14px;color:var(--text-4);">${codeOpen ? '▾' : '▸'}</span>
              <span class="badge badge-gray" style="font-family:monospace;margin-right:6px;">${c.code}</span>
              <span style="color:var(--text-2);">${c.type}</span>
            </td>
            <td style="padding:8px 12px;text-align:center;">
              <div style="display:inline-flex;align-items:center;gap:4px;" onclick="event.stopPropagation()">
                <input type="number" min="0" max="100" step="5"
                  data-code-roc="${c.id}" data-disc="${d.id}" value="${val || ''}" placeholder="0"
                  onchange="onDocCodeRocChange(this)"
                  style="width:60px;text-align:center;background:var(--bg-4);border:1px solid var(--border-2);border-radius:var(--radius);padding:4px 6px;color:var(--text);font-size:12px;outline:none;" />
                <span style="font-size:11px;color:var(--text-4);">%</span>
                <span title="${codeFlag ? "Steps don't sum to 100%" : ''}" style="display:inline-block;width:7px;height:7px;border-radius:50%;background:${codeFlag ? 'var(--red,#ef4444)' : 'transparent'};flex-shrink:0;margin-left:3px;"></span>
              </div>
            </td>
          </tr>`;

        if (codeOpen) {
          const actType  = c.activity_type || 'drawing';
          const steps    = rocWorkflowSteps[actType] || [];
          const stepData = rocItems[d.id]?.[c.id]?.steps || {};

          if (!steps.length) {
            rows += `
              <tr style="border-bottom:1px solid var(--border);">
                <td colspan="2" style="padding:8px 12px 8px 60px;color:var(--text-4);font-size:12px;">No workflow steps configured for activity type "${actType}". Add them in Admin → Workflow Steps.</td>
              </tr>`;
          } else {
            steps.forEach(name => {
              const sVal = stepData[name]?.weight || 0;
              rows += `
                <tr style="border-bottom:1px solid var(--border);">
                  <td style="padding:7px 12px 7px 60px;color:var(--text-3);">${name}</td>
                  <td style="padding:7px 12px;text-align:center;">
                    <div style="display:inline-flex;align-items:center;gap:4px;">
                      <input type="number" min="0" max="100" step="5"
                        data-step-roc="${name}" data-disc="${d.id}" data-code="${c.id}" value="${sVal || ''}" placeholder="0"
                        onchange="onStepRocChange(this)"
                        style="width:60px;text-align:center;background:var(--bg-4);border:1px solid var(--border-2);border-radius:var(--radius);padding:4px 6px;color:var(--text);font-size:12px;outline:none;" />
                      <span style="font-size:11px;color:var(--text-4);">%</span>
                    </div>
                  </td>
                </tr>`;
            });

           const stepTotal = steps.reduce((s, n) => s + (stepData[n]?.weight || 0), 0);
            const stepOk    = Math.abs(stepTotal - 100) < 0.01;
            rows += `
              <tr style="border-bottom:1px solid var(--border-2);background:var(--bg-3);">
                <td style="padding:6px 12px 6px 60px;font-size:11px;font-weight:700;color:var(--text-4);">Total</td>
                <td style="padding:6px 12px;text-align:center;">
                  <span style="font-size:12px;font-weight:700;color:${stepOk ? 'var(--green,#22c55e)' : '#38bdf8'};">${stepTotal.toFixed(1)}%</span>
                </td>

          }
        }
      });

      rows += `
        <tr style="border-bottom:1px solid var(--border-2);background:var(--bg-3);">
          <td style="padding:6px 12px 6px 36px;font-size:11px;font-weight:700;color:var(--text-4);">Subtotal</td>
          <td style="padding:6px 12px;text-align:center;">
            <span style="font-size:12px;font-weight:700;color:${codeOk ? 'var(--green,#22c55e)' : 'var(--accent,#f59e0b)'};">${codeTotal.toFixed(1)}%</span>
          </td>
        </tr>`;
    }
  });

  rows += `
    <tr style="border-top:2px solid var(--border-2);background:var(--bg-3);">
      <td style="padding:10px 12px;font-size:12px;font-weight:700;color:var(--text-3);">OVERALL TOTAL</td>

  body.innerHTML = rows;
  updateRocSaveBtnState();

function toggleRocDisc(discId) {
  if (rocExpandedDiscs.has(discId)) rocExpandedDiscs.delete(discId);
  else rocExpandedDiscs.add(discId);
  renderRocTreeBody();
}

function toggleRocCode(discId, codeId) {
  const key = discId + '|' + codeId;
  if (rocExpandedCodes.has(key)) rocExpandedCodes.delete(key);
  else rocExpandedCodes.add(key);
  renderRocTreeBody();
}

function collapseAllRoc() {
  rocExpandedDiscs = new Set();
  rocExpandedCodes = new Set();
  renderRocTreeBody();
  toast('Data Refreshed.', 'success');
}

function onDiscRocChange(input) {
  const discId = input.dataset.discRoc;
  const val    = Math.min(100, Math.max(0, parseFloat(input.value) || 0));
  const disc   = rocDiscs.find(d => d.id === discId);
  if (disc) disc.roc = val;
  rocDirty = true;
  markRocDirty(true);
  renderRocTreeBody();
}

function onDocCodeRocChange(input) {
  const docCodeId = input.dataset.codeRoc;
  const discId    = input.dataset.disc;
  const val       = Math.min(100, Math.max(0, parseFloat(input.value) || 0));
  if (!rocItems[discId]) rocItems[discId] = {};
  if (!rocItems[discId][docCodeId]) rocItems[discId][docCodeId] = { weight: 0, steps: {} };
  rocItems[discId][docCodeId].weight = val;
  rocDirty = true;
  markRocDirty(true);
  renderRocTreeBody();
}

function onStepRocChange(input) {
  const stepName  = input.dataset.stepRoc;
  const discId    = input.dataset.disc;
  const docCodeId = input.dataset.code;
  const val       = Math.min(100, Math.max(0, parseFloat(input.value) || 0));
  if (!rocItems[discId]) rocItems[discId] = {};
  if (!rocItems[discId][docCodeId]) rocItems[discId][docCodeId] = { weight: 0, steps: {} };
  if (!rocItems[discId][docCodeId].steps[stepName]) rocItems[discId][docCodeId].steps[stepName] = { weight: 0 };
  rocItems[discId][docCodeId].steps[stepName].weight = val;
  rocDirty = true;
  markRocDirty(true);
  renderRocTreeBody();
}

async function saveRoc() {
  if (!rocProjectId) { toast('No project selected.', 'info'); return; }
  if (rocHasAnyIssue()) { toast('Save failed. Fix the flagged weight inconsistencies before saving.', 'error'); return; }
  if (!rocDirty) { toast('No data to save for this project.', 'info'); return; }
  const btn = document.getElementById('roc-save-btn');
  if (btn) { btn.disabled = true; }

  const discUpserts = rocDiscs.map(d => ({
    project_id:    rocProjectId,
    discipline_id: d.id,
    roc:           d.roc || 0
  }));
  if (discUpserts.length) {
    const { error } = await db.from('project_discipline_roc')
      .upsert(discUpserts, { onConflict: 'project_id,discipline_id' });
    if (error) { toast('Error saving discipline ROC: ' + error.message, 'error'); if (btn) { btn.disabled = false; } return; }
  }

  for (const [discId, codes] of Object.entries(rocItems)) {
  for (const [docCodeId, codeData] of Object.entries(codes)) {
    const itemPayload = { project_id: rocProjectId, discipline_id: discId, doc_code_id: docCodeId, weight: codeData.weight || 0 };
    const { data: upserted, error: iErr } = await db.from('roc_items')
      .upsert(itemPayload, { onConflict: 'project_id,discipline_id,doc_code_id', ignoreDuplicates: false })
      .select('id').single();
    if (iErr) { toast('Error saving ROC item: ' + iErr.message, 'error'); continue; }

    let rocItemId = upserted?.id || codeData.id;
    if (!rocItemId) {
      const { data: existing } = await db.from('roc_items')
        .select('id')
        .eq('project_id', rocProjectId)
        .eq('discipline_id', discId)
        .eq('doc_code_id', docCodeId)
        .single();
      rocItemId = existing?.id;
    }
    if (!rocItemId) { toast('Error: could not resolve roc_item id', 'error'); continue; }

    const stepUpserts = Object.entries(codeData.steps || {}).map(([stepName, stepData]) => ({
      roc_item_id: rocItemId,
      step_name:   stepName,
      weight:      stepData.weight || 0
    }));
    if (stepUpserts.length) {
      const { error: sErr } = await db.from('roc_step_items')
        .upsert(stepUpserts, { onConflict: 'roc_item_id,step_name' });
      if (sErr) { toast('Error saving step weights: ' + sErr.message, 'error'); }
    }
  }
}

  if (btn) { btn.disabled = false; }
  rocDirty = false;
  markRocDirty(false);
  await onRocProjectChange(rocProjectId);
  toast('Rules of Credit saved.', 'success');
}

async function clearAllRoc() {
  if (!rocProjectId) { toast('No project selected.', 'info'); return; }
  if (!rocDiscs.length) { toast('No data to delete for this project.', 'info'); return; }

  openTypeConfirm(
    'This will permanently clear all Rules of Credit weights (disciplines, doc codes, and steps) for this project. This cannot be undone.',
    'Clear',
    'Clear All Data',
    async () => {
      const { error: e1 } = await db.from('project_discipline_roc').delete().eq('project_id', rocProjectId);
      if (e1) { toast('Error: ' + e1.message, 'error'); return; }

      const { data: items } = await db.from('roc_items').select('id').eq('project_id', rocProjectId);
      const itemIds = (items || []).map(i => i.id);
      if (itemIds.length) {
        const { error: e2 } = await db.from('roc_step_items').delete().in('roc_item_id', itemIds);
        if (e2) { toast('Error: ' + e2.message, 'error'); return; }
      }
      const { error: e3 } = await db.from('roc_items').delete().eq('project_id', rocProjectId);
      if (e3) { toast('Error: ' + e3.message, 'error'); return; }

      rocDiscs.forEach(d => { d.roc = 0; });
      rocItems = {};
      rocExpandedDiscs = new Set();
      rocExpandedCodes = new Set();
      rocDirty = false;
      markRocDirty(false);

      toast('Rules of Credit cleared.', 'success');
      await onRocProjectChange(rocProjectId);
    }
  );
}

function markRocDirty(dirty) {
  rocDirty = dirty;
  updateRocSaveBtnState();
}

// Grey = nothing to save. Yellow (accent) = unsaved changes, safe to save.
// Red = unsaved changes, but blocked by a weight mismatch somewhere.
function updateRocSaveBtnState() {
  const btn = document.getElementById('roc-save-btn');
  if (!btn) return;
  btn.classList.remove('btn-ghost', 'btn-primary', 'btn-danger');
  if (rocHasAnyIssue())   btn.classList.add('btn-danger');
  else if (rocDirty)      btn.classList.add('btn-primary');
  else                    btn.classList.add('btn-ghost');
}

function handleProgImportDrop(e) {
  e.preventDefault();
  document.getElementById('prog-import-drop').classList.remove('drag-over');
  const file = e.dataTransfer?.files?.[0];
  if (file) processProgImportFile(file);
}

function handleProgImportFile(input) {
  const file = input.files?.[0];
  if (file) processProgImportFile(file);
}

function processProgImportFile(file) {
  if (!file.name.match(/\.xlsx?$/i)) { toast('Please upload an .xlsx or .xls file.', 'error'); return; }
  const reader = new FileReader();
  reader.onload = (e) => {
    try {
      const wb   = XLSX.read(e.target.result, { type: 'array' });
      const ws   = wb.Sheets[wb.SheetNames[0]];
      const rows = XLSX.utils.sheet_to_json(ws, { defval: '' });
      parseProgImportRows(rows);
    } catch (err) {
      toast('Failed to read file: ' + err.message, 'error');
    }
  };
  reader.readAsArrayBuffer(file);
}

function parseProgImportRows(rows) {
  if (!progProjectId) { toast('Please select a project first.', 'error'); return; }
  if (!rows.length) { toast('No data found in file.', 'error'); return; }

  const currentProj = projectsData.find(p => p.id === progProjectId);
  const parsed = [];
  const errors = [];
  const errorReasons = new Set();

  rows.forEach((row, i) => {
    const discRaw   = String(row['Discipline'] || '').trim();
    const projCode  = String(row['Project Code'] || '').trim();
    const rawPeriod = String(row['Week Start'] || row['Period'] || '').trim();
    const pct       = parseFloat(row['Planned %'] ?? row['Planned'] ?? '');

    if (projCode && currentProj && projCode.toLowerCase() !== currentProj.code.toLowerCase()) {
      errors.push(`Row ${i+2}: project code "${projCode}" mismatch "${currentProj.code}"`);
      errorReasons.add('Project Code mismatch');
      return;
    }

    const disc = progDiscs.find(d => d.name.toLowerCase() === discRaw.toLowerCase());
    if (!disc) { errors.push(`Row ${i+2}: discipline "${discRaw}" not found`); errorReasons.add('Discipline mismatch'); return; }

    let week = '';
    const d1 = new Date(rawPeriod);
    if (!isNaN(d1)) {
      week = getWeekStart(d1, progProject?.week_start_day ?? 1);
    } else if (rawPeriod.match(/^\d{4}-\d{2}-\d{2}$/)) {
      week = getWeekStart(rawPeriod, progProject?.week_start_day ?? 1);
    }

    if (!week) { errors.push(`Row ${i+2}: invalid date "${rawPeriod}"`); errorReasons.add('Invalid Week Start'); return; }
    if (isNaN(pct)) { errors.push(`Row ${i+2}: invalid Planned %`); errorReasons.add('Invalid Planned %'); return; }

    parsed.push({ discId: disc.id, discName: disc.name, week, pct: Math.min(100, Math.max(0, pct)) });
  });

  if (!parsed.length) {
    toast(`No items imported. ${[...errorReasons].join(', ') || 'Check the file and try again.'}`, 'error');
    return;
  }

  progImportData = parsed;

  // Render preview
  let html = `
    <div style="margin:14px 0 8px;font-size:12px;color:var(--text-3);">
      <strong style="color:var(--text);">${parsed.length} rows</strong> ready to import.
      ${errors.length ? `<span style="color:var(--red);margin-left:8px;">${errors.length} rows skipped. ${[...errorReasons].join(', ')}.</span>` : ''}
    </div>
    <div class="import-preview"><table>
      <thead><tr><th>Discipline</th><th>Week</th><th>Planned %</th></tr></thead>
      <tbody>
        ${parsed.map(p => `<tr>
          <td>${p.discName}</td>
          <td>${fmtWeekRange(p.week)}</td>
          <td style="color:var(--accent);">${p.pct}%</td>
        </tr>`).join('')}
      </tbody>
    </table></div>`;

  document.getElementById('prog-import-preview-wrap').innerHTML = html;
  document.getElementById('prog-import-confirm-btn').style.display = 'flex';
  document.getElementById('prog-import-back-btn').style.display = 'flex';
  document.getElementById('prog-import-drop').style.display = 'none';
}

function exportProgExcel() {
  if (!progProjectId) { toast('No project selected.', 'info'); return; }
  if (!progDiscs.length) { toast('No data to export for this project.', 'info'); return; }

  const rows = [];
  const proj = projectsData.find(p => p.id === progProjectId);

  // Header row
  rows.push(['Discipline', 'Project Code', 'Week Start', 'Week Range', 'Planned %']);

  // Data rows — one row per discipline per week
  progDiscs.forEach(d => {
    progWeeks.forEach(w => {
      const val = (progSchedule[d.id] || {})[w];
      rows.push([
        d.name,
        proj?.code || '',
        w,
        fmtWeekRange(w),
        val != null ? val : '',
      ]);
    });
  });

  const ws = XLSX.utils.aoa_to_sheet(rows);

  // Column widths
  ws['!cols'] = [
    { wch: 20 },  // Discipline
    { wch: 14 },  // Project Code
    { wch: 12 },  // Week Start
    { wch: 22 },  // Week Range
    { wch: 12 },  // Planned %
  ];

  const wb = XLSX.utils.book_new();
  XLSX.utils.book_append_sheet(wb, ws, 'Planned Progress');

  const fileName = `Progress_${proj?.code || 'export'}_${new Date().toISOString().substring(0,10)}.xlsx`;
  XLSX.writeFile(wb, fileName);
  toast('Exported successfully.', 'success');
}

function exportRocExcel() {
  if (!rocProjectId) { toast('No project selected.', 'info'); return; }
  if (!rocDiscs.length) { toast('No data to export for this project.', 'info'); return; }
  const proj = projectsData.find(p => p.id === rocProjectId);

  const discRows = [['Discipline', 'Project Code', 'Weight %']];
  rocDiscs.forEach(d => discRows.push([d.name, proj?.code || '', d.roc || 0]));

  const codeRows = [['Discipline', 'Doc Code', 'Doc Type', 'Project Code', 'Weight %']];
  const stepRows = [['Discipline', 'Doc Code', 'Step Name', 'Project Code', 'Weight %']];
  rocDiscs.forEach(d => {
    const discCodes = rocItems[d.id] || {};
    rocDocCodes.forEach(c => {
      const item = discCodes[c.id];
      codeRows.push([d.name, c.code, c.type, proj?.code || '', item?.weight || 0]);

      const actType = c.activity_type || 'drawing';
      const relevantSteps = rocWorkflowSteps[actType] || [];
      relevantSteps.forEach(stepName => {
        const sData = item?.steps?.[stepName];
        stepRows.push([d.name, c.code, stepName, proj?.code || '', sData?.weight || 0]);
      });
    });
  });

  const wb = XLSX.utils.book_new();
  XLSX.utils.book_append_sheet(wb, XLSX.utils.aoa_to_sheet(discRows), 'Disciplines');
  XLSX.utils.book_append_sheet(wb, XLSX.utils.aoa_to_sheet(codeRows), 'Doc Codes');
  XLSX.utils.book_append_sheet(wb, XLSX.utils.aoa_to_sheet(stepRows), 'Steps');

  const fileName = `RulesOfCredit_${proj?.code || 'export'}_${new Date().toISOString().substring(0,10)}.xlsx`;
  XLSX.writeFile(wb, fileName);
  toast('Exported successfully.', 'success');
}

async function confirmProgImport() {
  if (!progImportData?.length) return;
  const btn = document.getElementById('prog-import-confirm-btn');
  btn.textContent = 'Importing…'; btn.disabled = true;

  const upserts = progImportData.map(p => ({
    project_id:    progProjectId,
    discipline_id: p.discId,
    week_start:    p.week,
    planned_pct:   p.pct,

  const { error } = await db.from('planned_progress')
    .upsert(upserts, { onConflict: 'project_id,discipline_id,week_start' });

  btn.innerHTML = `${IC.save} Import`; btn.disabled = false;

// TARGET KPI TAB
// ═══════════════════════════════════════════════════════════════════
let kpiData       = [];
let kpiFiltered   = [];
let stepsData     = [];
let docCodesData  = [];
let kpiProjectId  = null;
let kpiAreaItems  = [];
let kpiImportParsed = null;

const KPI_ACT_LABELS = {
  model:        '3D Model',
  drawing:      'Drawings',
  test_package: 'Test Package',
  materials:    'Materials',
  calculations: 'Calculations',
};

function recalcKpiAreaTotal() {
  const inputs = document.querySelectorAll('.kpi-area-input');
  const total  = Array.from(inputs).reduce((s, inp) => s + (parseFloat(inp.value) || 0), 0);
  const totalEl = document.getElementById('kpi-area-total');
  if (totalEl) {
    totalEl.textContent = total.toLocaleString();
    totalEl.style.color = 'var(--accent)';
  }
  const hidden = document.getElementById('kpi-estimated-output');
  if (hidden) hidden.value = total;
  const hintEl = document.getElementById('kpi-area-hint');
  if (hintEl) hintEl.textContent = 'Auto-summed from area inputs. Can be filled in later.';
}

const KPI_UNITS = {
  model:        'MH / TON',
  drawing:      'MH / SHT',
  test_package: 'MH / PKG',
  materials:    'MH / MTO',
  calculations: 'MH / CAL',
};

function onKpiProjectChange(projId) {
  kpiProjectId = projId || null;
  if (!kpiProjectId) {
    document.getElementById('kpi-content').innerHTML = '';
    return;
  }
  loadKpi();
}

async function loadKpi() {
  const container = document.getElementById('kpi-content');
  if (!container) return;
  if (!kpiProjectId) return;

  // ── 1. Load areas FIRST so the table header renders correctly ──
  const proj = projectsData.find(p => p.id === kpiProjectId);
  if (proj) {
    const { data: structData } = await db
      .from('structure_items')
      .select('id, area_system_module, priority_shipment')
      .eq('project_code', proj.code)
      .order('priority_shipment');
    kpiAreaItems = (structData || []).sort((a, b) => {
      const pDiff = (a.priority_shipment ?? 0) - (b.priority_shipment ?? 0);
      if (pDiff !== 0) return pDiff;
      return (a.area_system_module || '').localeCompare(b.area_system_module || '', undefined, { numeric: true, sensitivity: 'base' });
    });
  } else {
    kpiAreaItems = [];
  }

  // ── 2. Now render the shell (header uses kpiAreaItems) ──
  container.innerHTML = `
    <div class="toolbar">
      <div class="search-box" style="flex:0 1 320px;">
        <input type="text" id="kpi-search" placeholder="Search by discipline, doc code, or step…" oninput="filterKpi(this.value)" />
      </div>
      <select class="filter-select" id="kpi-disc-filter" onchange="filterKpi(document.getElementById('kpi-search').value)" style="min-width:160px;">
        <option value="">All Disciplines</option>
        ${disciplinesData.map(d => `<option value="${d.id}">${d.name}</option>`).join('')}
      </select>
      <select class="filter-select" id="kpi-doccode-filter" onchange="filterKpi(document.getElementById('kpi-search').value)" style="min-width:160px;">
        <option value="">All Doc Codes</option>
        ${[...docCodesData].sort((a, b) => a.code.localeCompare(b.code)).map(c => `<option value="${c.id}">${c.code} — ${c.type}</option>`).join('')}
      </select>
      <button class="btn btn-ghost btn-sm" style="margin-left:auto;" onclick="clearKpiFilters()">Clear Filter</button>
    </div>
    <div class="table-wrapper">
      <table>
        <thead>
          <tr>
            <th style="text-align:center;">Project</th>
            <th style="text-align:left;">Discipline</th>
            <th style="text-align:left;">Doc Code</th>
            <th style="text-align:center;">Activity</th>
            <th style="text-align:left;">Workflow Step</th>
            <th style="text-align:center;">Target Value</th>
            <th style="text-align:center;">Estimated Output</th>
            <th style="text-align:center;">Unit</th>
            ${kpiAreaItems.map(a => `<th style="text-align:center;min-width:90px;white-space:normal;max-width:120px;">${a.area_system_module}</th>`).join('')}
            <th style="text-align:center;">Actions</th>
          </tr>
        </thead>
        <tbody id="kpi-tbody">
          <tr><td colspan="${9 + kpiAreaItems.length}" style="text-align:center;padding:30px;color:var(--text-4);">Loading…</td></tr>
        </tbody>
      </table>
    </div>`;

  // ── 3. Load positions (discipline catalog), KPI rows, steps, doc codes ──
  const [
    { data: targRows },
    { data: rocItemRows },
    { data: kpiRows },
    { data: steps },
    { data: docCodes },
  ] = await Promise.all([
    db.from('targets').select('discipline_id, disciplines(id,name)').eq('project_id', kpiProjectId).not('discipline_id', 'is', null),
    db.from('roc_items').select('discipline_id, doc_code_id, weight, roc_step_items(step_name, weight)').eq('project_id', kpiProjectId),
    db.from('target_kpi').select(`
      id, target_value, estimated_output, discipline_id, doc_code_id, step_id,
      projects(id, code, name),
      disciplines(id, name),
      document_codes(id, code, type, activity_type),
      workflow_steps(id, name, sort_order, activity_type)
    `).eq('project_id', kpiProjectId),
    db.from('workflow_steps').select('*').order('activity_type').order('sort_order'),
    db.from('document_codes').select('*').order('code'),
  ]);

  stepsData    = steps    || [];
  docCodesData = docCodes || [];

  // Doc Code filter options depend on docCodesData, which wasn't loaded yet
  // when the toolbar shell was rendered in step 2 — populate it now.
  const docCodeFilterEl = document.getElementById('kpi-doccode-filter');
  if (docCodeFilterEl) {
    const currentVal = docCodeFilterEl.value;
    docCodeFilterEl.innerHTML = `<option value="">All Doc Codes</option>` +
      [...docCodesData].sort((a, b) => a.code.localeCompare(b.code)).map(c => `<option value="${c.id}">${c.code} — ${c.type}</option>`).join('');
    docCodeFilterEl.value = currentVal;
  }

  // ── 4. Load area breakdowns for all KPIs ──
  const kpiIds = (kpiRows || []).map(k => k.id);
  let kpiAreaMap = {};
  if (kpiIds.length) {
    let allAreaRows = [];
    const PAGE_SIZE = 1000;
    let from = 0;
    while (true) {
      const { data: page, error: pageErr } = await db
        .from('target_kpi_areas')
        .select('kpi_id, structure_item_id, estimated_output')
        .in('kpi_id', kpiIds)
        .range(from, from + PAGE_SIZE - 1);
      if (pageErr || !page || page.length === 0) break;
      allAreaRows = allAreaRows.concat(page);
      if (page.length < PAGE_SIZE) break;
      from += PAGE_SIZE;
    }
    allAreaRows.forEach(r => {
      if (!kpiAreaMap[r.kpi_id]) kpiAreaMap[r.kpi_id] = {};
      kpiAreaMap[r.kpi_id][r.structure_item_id] = r.estimated_output;
    });
  }

  // ── 5. Build the full catalog — same source data ROC uses (Positions →
  // disciplines, Admin → Deliverables, Admin → Workflow Steps), so this list
  // always matches ROC with no separate "sync" step. Existing target_kpi rows
  // are layered on top; combinations with no saved row yet get id: null and
  // blank values, ready to be filled in via Edit.
  const discMap = {};
  (targRows || []).forEach(r => { if (r.disciplines) discMap[r.disciplines.id] = r.disciplines; });
  const catalogDiscs = Object.values(discMap).sort((a, b) => a.name.localeCompare(b.name));

  // ROC weights gate the catalog: a doc code with 0 weight for a discipline is
  // "not applicable" and produces no KPI rows; same for an individual step's
  // weight within an included doc code.
  const rocDocWeight  = {};   // "discId|codeId" -> weight
  const rocStepWeight = {};   // "discId|codeId|stepNameLower" -> weight
  (rocItemRows || []).forEach(item => {
    rocDocWeight[`${item.discipline_id}|${item.doc_code_id}`] = parseFloat(item.weight) || 0;
    (item.roc_step_items || []).forEach(s => {
      rocStepWeight[`${item.discipline_id}|${item.doc_code_id}|${(s.step_name || '').toLowerCase()}`] = parseFloat(s.weight) || 0;
    });
  });

  const existingByKey = {};
  (kpiRows || []).forEach(k => { existingByKey[`${k.discipline_id}|${k.doc_code_id}|${k.step_id}`] = k; });

  const catalog = [];
  catalogDiscs.forEach(disc => {
    docCodesData.forEach(code => {
      const rocApplicableDoc = (rocDocWeight[`${disc.id}|${code.id}`] || 0) > 0;

      const actType = code.activity_type || 'drawing';
      stepsData
        .filter(s => (s.activity_type || 'drawing') === actType && s.credit_required !== false)
        .forEach(step => {
          const key = `${disc.id}|${code.id}|${step.id}`;
          const existing = existingByKey[key];
          const rocApplicableStep = rocApplicableDoc &&
            (rocStepWeight[`${disc.id}|${code.id}|${step.name.toLowerCase()}`] || 0) > 0;

          // Always show a row that already has real saved data, even if ROC
          // currently says "not applicable" (weight is 0/unset) — ROC and
          // Target KPI are edited independently, and ROC changes shouldn't
          // hide previously-imported/entered targets. Only use the ROC gate
          // to decide whether to offer a *blank* row for entry.
          if (!existing && !rocApplicableStep) return;

          catalog.push(existing ? { ...existing, _areas: kpiAreaMap[existing.id] || {} } : {
            id: null, project_id: kpiProjectId,
            discipline_id: disc.id, doc_code_id: code.id, step_id: step.id,
            target_value: null, estimated_output: 0,
            projects: null, disciplines: disc, document_codes: code, workflow_steps: step,
            _areas: {},
          });
        });
    });
  });

  kpiData = catalog;
  filterKpi('');
}

function kpiRowKey(k) {
  return `${k.discipline_id}|${k.doc_code_id}|${k.step_id}`;
}

function filterKpi(search) {
  const disc    = document.getElementById('kpi-disc-filter')?.value    || '';
  const docCode = document.getElementById('kpi-doccode-filter')?.value || '';
  const q       = (search || '').toLowerCase();

  kpiFiltered = kpiData.filter(k => {
    if (disc    && k.disciplines?.id !== disc) return false;
    if (docCode && k.document_codes?.id !== docCode) return false;
    if (q) {
      const hay = [
        k.disciplines?.name,
        k.document_codes?.code,
        k.document_codes?.type,
        k.workflow_steps?.name,
      ].join(' ').toLowerCase();
      if (!hay.includes(q)) return false;
    }
    return true;
  });

  renderKpi();
}

function clearKpiFilters() {
  document.getElementById('kpi-search').value = '';
  document.getElementById('kpi-disc-filter').value = '';
  document.getElementById('kpi-doccode-filter').value = '';
  filterKpi('');
}

function kpiTargetValueCell(k) {
  if (k.id && k.target_value == null) {
    return '<span style="color:var(--text-4);font-style:italic;" title="Not tracked">NA</span>';
  }
  if (k.target_value != null) {
    return `<span style="color:var(--accent);">${Number(k.target_value).toLocaleString()}</span>`;
  }
  return '<span style="color:var(--text-4);">—</span>';
}

function renderKpi() {
  const tbody = document.getElementById('kpi-tbody');

  if (!kpiFiltered.length) {
    tbody.innerHTML = `<tr><td colspan="${9 + kpiAreaItems.length}" style="text-align:center;padding:40px;color:var(--text-4);">No matching rows. If this project has no rows at all, add positions with disciplines in the Positions tab first.</td></tr>`;
    return;
  }

  tbody.innerHTML = kpiFiltered.map(k => {
    const actType = k.document_codes?.activity_type || 'drawing';
    const unit    = KPI_UNITS[actType] || '—';
    const actBadge = actType === 'model'
      ? '<span class="badge badge-blue">3D Model</span>'
      : actType === 'test_package'
      ? '<span class="badge badge-orange">Test Package</span>'
      : actType === 'materials'
      ? '<span class="badge" style="background:rgba(168,85,247,0.15);color:#a855f7;">Materials</span>'
      : actType === 'calculations'
      ? '<span class="badge" style="background:rgba(236,72,153,0.15);color:#ec4899;">Calculations</span>'
      : '<span class="badge badge-green">Drawing</span>';

    return `<tr>
      <td style="text-align:center;"><span class="badge badge-gray" style="font-family:monospace;">${k.projects?.code || '—'}</span></td>
      <td style="font-weight:600;">${k.disciplines?.name || '—'}</td>
      <td>
        <span class="badge badge-gray" style="font-family:monospace;">${k.document_codes?.code || '—'}</span>
        <span style="margin-left:6px;font-size:11px;color:var(--text-3);">${k.document_codes?.type || ''}</span>
      </td>
      <td style="text-align:center;">${actBadge}</td>
      <td>${k.workflow_steps?.name || '—'}</td>
      <td style="text-align:center;font-weight:600;font-variant-numeric:tabular-nums;">${kpiTargetValueCell(k)}</td>
      <td style="text-align:center;font-weight:600;color:var(--text);font-variant-numeric:tabular-nums;">
        ${k.estimated_output != null && k.estimated_output > 0 ? Number(k.estimated_output).toLocaleString() : '—'}
      </td>
      <td style="text-align:center;font-size:11px;color:var(--text-3);">${unit}</td>
      ${kpiAreaItems.map(a => {
        const val = k._areas?.[a.id];
        return `<td style="text-align:center;font-variant-numeric:tabular-nums;font-size:12px;color:${val > 0 ? 'var(--text)' : 'var(--text-4)'};">
          ${val > 0 ? Number(val).toLocaleString() : '—'}
        </td>`;
      }).join('')}
      <td style="text-align:center;">
        <div class="table-actions" style="justify-content:center;">
          <button class="btn btn-icon edit" onclick="openEditKpi('${kpiRowKey(k)}')" title="${k.id ? 'Edit' : 'Enter values'}">${IC.edit}</button>
          ${k.id ? `<button class="btn btn-icon delete" onclick="clearKpiValue('${k.id}')" title="Clear values">${IC.trash}</button>` : ''}
        </div>
      </td>
    </tr>`;
  }).join('');
}

async function renderKpiAreaBreakdown(kpiId) {
  const wrap = document.getElementById('kpi-area-breakdown');
  const totalEl = document.getElementById('kpi-area-total');
  if (!wrap) return;

  wrap.innerHTML = `<div style="text-align:center;padding:20px;color:var(--text-4);font-size:12px;">Loading areas…</div>`;

  // Load structure items for this project
  const proj = projectsData.find(p => p.id === kpiProjectId);
  if (!proj) {
    wrap.innerHTML = `<div style="text-align:center;padding:20px;color:var(--text-4);font-size:12px;">No project selected.</div>`;
    return;
  }

  const { data: structItems } = await db
    .from('structure_items')
    .select('id, area_system_module, priority_shipment')
    .eq('project_code', proj.code)
    .order('priority_shipment');

  kpiAreaItems = (structItems || []).sort((a, b) => {
    const pDiff = (a.priority_shipment ?? 0) - (b.priority_shipment ?? 0);
    if (pDiff !== 0) return pDiff;
    return (a.area_system_module || '').localeCompare(b.area_system_module || '', undefined, { numeric: true, sensitivity: 'base' });
  });

  if (!kpiAreaItems.length) {
    wrap.innerHTML = `<div style="text-align:center;padding:20px;color:var(--text-4);font-size:12px;">No areas found for this project. Add them in the Structure page.</div>`;
    if (totalEl) totalEl.textContent = '0';
    return;
  }

  // Load existing area breakdown if editing
  let existingMap = {};
  if (kpiId) {
    const { data: areaRows } = await db
      .from('target_kpi_areas')
      .select('structure_item_id, estimated_output')
      .eq('kpi_id', kpiId);
    (areaRows || []).forEach(r => { existingMap[r.structure_item_id] = r.estimated_output; });

  wrap.innerHTML = kpiAreaItems.map(item => {

        <input type="number" class="kpi-area-input cell-input" min="0" step="0.01" placeholder="0"

          style="width:90px;text-align:center;border:1px solid var(--border);border-radius:var(--radius);padding:6px 8px;" />
      </div>`;
  }).join('');

  recalcKpiAreaTotal();
}

function exportKpiExcel() {
  if (!kpiProjectId) { toast('No project selected.', 'info'); return; }
  if (!kpiData.length) { toast('No data to export for this project.', 'info'); return; }

  const exportProj = projectsData.find(p => p.id === kpiProjectId);
  const header = [
    'Discipline', 'Doc Code', 'Doc Type', 'Activity Type', 'Workflow Step',
    'Project Code', 'Target Value', 'Estimated Output',
    ...kpiAreaItems.map(a => a.area_system_module),
  ];
  const rows = [header];

  kpiData.forEach(k => {
    const actType  = k.document_codes?.activity_type || 'drawing';
    const actLabel = KPI_ACT_LABELS[actType] || actType;
    const row = [
      k.disciplines?.name || '',
      k.document_codes?.code || '',
      k.document_codes?.type || '',
      actLabel,
      k.workflow_steps?.name || '',
      exportProj?.code || '',
      (k.id && k.target_value == null) ? 'N' : (k.target_value ?? ''),
      k.estimated_output ?? '',
    ];
    kpiAreaItems.forEach(a => row.push(k._areas?.[a.id] ?? ''));
    rows.push(row);
  });

  const ws = XLSX.utils.aoa_to_sheet(rows);
  ws['!cols'] = [
    { wch: 18 }, { wch: 14 }, { wch: 16 }, { wch: 14 }, { wch: 24 }, { wch: 14 }, { wch: 16 },
    ...kpiAreaItems.map(() => ({ wch: 14 })),
  ];

  const wb = XLSX.utils.book_new();
  XLSX.utils.book_append_sheet(wb, ws, 'Target KPI');

  const proj = projectsData.find(p => p.id === kpiProjectId);
  const fileName = `TargetKPI_${proj?.code || 'export'}_${new Date().toISOString().substring(0,10)}.xlsx`;
  XLSX.writeFile(wb, fileName);
  toast('Exported successfully.', 'success');
}

function handleKpiImportDrop(e) {
  e.preventDefault();
  document.getElementById('kpi-import-drop').classList.remove('drag-over');
  const file = e.dataTransfer?.files?.[0];
  if (file) processKpiImportFile(file);
}

function handleKpiImportFile(input) {
  const file = input.files?.[0];
  if (file) processKpiImportFile(file);
}

function processKpiImportFile(file) {
  if (!file.name.match(/\.xlsx?$/i)) { toast('Please upload an .xlsx or .xls file.', 'error'); return; }
  const reader = new FileReader();
  reader.onload = (e) => {
    try {
      const wb   = XLSX.read(e.target.result, { type: 'array' });
      const ws   = wb.Sheets[wb.SheetNames[0]];
      const rows = XLSX.utils.sheet_to_json(ws, { defval: '' });
      parseKpiImportRows(rows);
    } catch (err) {
      toast('Failed to read file: ' + err.message, 'error');
    }
  };
  reader.readAsArrayBuffer(file);
}

function parseKpiImportRows(rows) {
  if (!kpiProjectId) { toast('No project selected.', 'info'); return; }
  if (!rows.length) { toast('No data found in file.', 'error'); return; }

  // Normalize header keys — strip whitespace / BOM from all header keys
  rows = rows.map(row => {
    const clean = {};
    Object.keys(row).forEach(k => { clean[k.trim().replace(/^\uFEFF/, '')] = row[k]; });
    return clean;
  });

  const fixedCols = ['Discipline', 'Doc Code', 'Doc Type', 'Activity Type', 'Workflow Step', 'Target Value', 'Estimated Output'];
  const areaCols  = Object.keys(rows[0] || {}).filter(k => !fixedCols.includes(k));

  const parsed = [];
  const errors = [];
  const errorReasons = new Set();
  const currentProj = projectsData.find(p => p.id === kpiProjectId);

  rows.forEach((row, i) => {
    const discRaw = String(row['Discipline']    || '').trim();
    const codeRaw = String(row['Doc Code']      || '').trim();
    const stepRaw = String(row['Workflow Step'] || '').trim();
    const targetVRaw = String(row['Target Value'] ?? '').trim();
    let targetV;
    if (['N', 'NA', 'N/A'].includes(targetVRaw.toUpperCase())) {
      targetV = null; // explicit "not tracked"
    } else {
      targetV = parseFloat(targetVRaw);
    }
	const projCode = String(row['Project Code'] || '').trim();
    if (projCode && currentProj && projCode.toLowerCase() !== currentProj.code.toLowerCase()) {
      errors.push(`Row ${i+2}: project code "${projCode}" does not match "${currentProj.code}"`);
      errorReasons.add('Project Code does not match');
      return;
    }

    if (!discRaw)        { errors.push(`Row ${i+2}: missing Discipline`); errorReasons.add('Missing Discipline'); return; }
    if (!codeRaw)        { errors.push(`Row ${i+2}: missing Doc Code`); errorReasons.add('Missing Doc Code'); return; }
    if (!stepRaw)        { errors.push(`Row ${i+2}: missing Workflow Step`); errorReasons.add('Missing Workflow Step'); return; }
    if (targetV !== null && isNaN(targetV)) { errors.push(`Row ${i+2}: invalid Target Value (use a number or "N")`); errorReasons.add('Invalid Target Value'); return; }

    const disc = disciplinesData.find(d => d.name.toLowerCase() === discRaw.toLowerCase());
    if (!disc) { errors.push(`Row ${i+2}: discipline "${discRaw}" not found`); errorReasons.add('Discipline mismatch'); return; }

    const docCode = docCodesData.find(d => d.code.toLowerCase() === codeRaw.toLowerCase());
    if (!docCode) { errors.push(`Row ${i+2}: doc code "${codeRaw}" not found`); errorReasons.add('Doc Code mismatch'); return; }

    const actType = docCode.activity_type || 'drawing';
    const step = stepsData.find(s =>
      s.name.toLowerCase() === stepRaw.toLowerCase() &&
      (s.activity_type || 'drawing') === actType
    );
    if (!step) { errors.push(`Row ${i+2}: workflow step "${stepRaw}" not found for activity type "${KPI_ACT_LABELS[actType] || actType}"`); errorReasons.add('Workflow Step mismatch'); return; }

    // Area breakdown — match any extra column headers to area names
    const areas = {};
    let areaSum = 0;
    let hasAreaCols = false;
    areaCols.forEach(colName => {
      const area = kpiAreaItems.find(a => a.area_system_module.toLowerCase() === colName.toLowerCase());
      if (!area) return;
      hasAreaCols = true;
      const v = parseFloat(row[colName]);
      if (!isNaN(v) && v !== 0) { areas[area.id] = v; areaSum += v; }
    });

    const estimated_output = hasAreaCols ? areaSum : (parseFloat(row['Estimated Output']) || 0);

    const dupKey = `${disc.id}|${docCode.id}|${step.id}`;
    const dupIndex = parsed.findIndex(p => `${p.discipline_id}|${p.doc_code_id}|${p.step_id}` === dupKey);
    if (dupIndex !== -1) {
      errors.push(`Row ${i+2}: duplicate of row ${parsed[dupIndex]._rowNum} (same Discipline/Doc Code/Workflow Step: ${discRaw} / ${codeRaw} / ${stepRaw}) — skipped, only the first occurrence is kept`);
      errorReasons.add('Duplicate row within file');
      return;
    }

    const existing = kpiData.find(k => k.discipline_id === disc.id && k.doc_code_id === docCode.id && k.step_id === step.id);
    parsed.push({
      discipline_id: disc.id,    discName: disc.name,
      doc_code_id:   docCode.id, docCode:  docCode.code,
      step_id:       step.id,    stepName: step.name,
      activityType:  actType,
      target_value:  targetV,
      estimated_output,
      areas,
      existing_id: existing?.id || null,
      _rowNum: i + 2,
    });
  });

  if (errors.length && !parsed.length) {
    toast(`No items imported. ${[...errorReasons].join(', ') || 'Check the file and try again.'}`, 'error');
    return;
  }

  kpiImportParsed = parsed;

  let html = `
    <div style="margin:14px 0 8px;font-size:12px;color:var(--text-3);">
      <strong style="color:var(--text);">${parsed.length} rows</strong> ready to import.
      ${errors.length ? `<span style="color:var(--red);margin-left:8px;">${errors.length} rows skipped. ${[...errorReasons].join(', ')}.</span>` : ''}
    </div>
    <div class="import-preview"><table>
      <thead><tr>
        <th style="text-align:left;">Discipline</th><th>Doc Code</th><th>Activity</th><th>Step</th><th>Target Value</th><th>Est. Output</th>
      </tr></thead>
      <tbody>
        ${parsed.map(p => `<tr>
          <td style="text-align:left;">${p.discName}</td>
          <td style="font-family:monospace;">${p.docCode}</td>
          <td>${KPI_ACT_LABELS[p.activityType] || p.activityType}</td>
          <td>${p.stepName}</td>
          <td style="color:var(--accent);">${p.target_value != null ? Number(p.target_value).toLocaleString() : '<span style="color:var(--text-4);font-style:italic;">NA</span>'}</td>
          <td>${p.estimated_output ? Number(p.estimated_output).toLocaleString() : '—'}</td>
        </tr>`).join('')}
      </tbody>
    </table></div>`;

  document.getElementById('kpi-import-preview-wrap').innerHTML = html;
  document.getElementById('kpi-import-confirm-btn').style.display = 'flex';
  document.getElementById('kpi-import-back-btn').style.display = 'flex';
  document.getElementById('kpi-import-drop').style.display = 'none';
}

async function withRetry(fn, attempts = 3, delayMs = 400) {
  let lastError;
  for (let i = 0; i < attempts; i++) {
    const result = await fn();
    if (!result.error) return result;
    lastError = result.error;
    // Only retry on transient-looking errors (network/timeout), not constraint violations
    if (!/timeout|network|fetch|ECONN/i.test(lastError.message || '')) return result;
    await new Promise(r => setTimeout(r, delayMs * (i + 1)));
  }
  return { error: lastError };
}

async function confirmKpiImport() {
  if (!kpiImportParsed?.length) return;
  const btn = document.getElementById('kpi-import-confirm-btn');
  btn.textContent = 'Importing…'; btn.disabled = true;

  let success = 0;
  const errors = [];

  for (const p of kpiImportParsed) {
    const payload = {
      project_id:        kpiProjectId,
      discipline_id:     p.discipline_id,
      doc_code_id:        p.doc_code_id,
      step_id:            p.step_id,
      target_value:       p.target_value,
      estimated_output:   p.estimated_output,
    };

    let kpiId = p.existing_id;
    let error;

    if (kpiId) {
      ({ error } = await withRetry(() => db.from('target_kpi').update(payload).eq('id', kpiId)));
    } else {
      const insertResult = await withRetry(() => db.from('target_kpi').insert(payload).select('id').single());
      error = insertResult.error;
      if (!error) {
        kpiId = insertResult.data.id;
      } else {
        // Insert failed — a row for this project/discipline/doc-code/step already
        // exists (possibly more than one, left over from an earlier buggy import).
        // Fetch all matches instead of assuming exactly one, update the first, and
        // clean up any extras so duplicates don't linger.
        const { data: foundRows } = await db.from('target_kpi').select('id')
          .eq('project_id', kpiProjectId).eq('discipline_id', p.discipline_id)
          .eq('doc_code_id', p.doc_code_id).eq('step_id', p.step_id);
        if (foundRows && foundRows.length) {
          const keepId = foundRows[0].id;
          const upd = await db.from('target_kpi').update(payload).eq('id', keepId);
          error = upd.error;
          if (!error) {
            kpiId = keepId;
            const extraIds = foundRows.slice(1).map(r => r.id);
            if (extraIds.length) {
              await db.from('target_kpi_areas').delete().in('kpi_id', extraIds);
              await db.from('target_kpi').delete().in('id', extraIds);
            }
          }
        }
      }
    }

    if (error) { errors.push(error.message); continue; }
    success++;

    const areaEntries = Object.entries(p.areas || {});
    if (areaEntries.length) {
      const areaRows = areaEntries.map(([structure_item_id, val]) => ({
        kpi_id:            kpiId,
        structure_item_id,
        estimated_output:  val,
      }));
      await db.from('target_kpi_areas').delete().eq('kpi_id', kpiId);
      await db.from('target_kpi_areas').insert(areaRows);
    }
  }

  btn.innerHTML = `${IC.save} Import`; btn.disabled = false;

  if (errors.length) {
    toast(`${success} imported, ${errors.length} failed.${errors[0] ? ' ' + errors[0] : ''}`, errors.length === kpiImportParsed.length ? 'error' : 'warning');
  } else {
    toast(`${success} KPI row(s) imported.`, 'success');
  }

  kpiImportParsed = null;
  closeModal('kpi-import-modal');
  await loadKpi();
}

async function openAddKpi() {
  if (!kpiProjectId) { toast('No project selected.', 'info'); return; }
  const proj = projectsData.find(p => p.id === kpiProjectId);
  document.getElementById('kpi-id').value               = '';
  document.getElementById('kpi-value').value            = '';
  document.getElementById('kpi-estimated-output').value = '0';
  document.getElementById('kpi-project-display').value  = proj ? `${proj.code} — ${proj.name}` : '—';
  document.getElementById('kpi-discipline').innerHTML =
    disciplinesData.map(d => `<option value="${d.id}">${d.name}</option>`).join('');
  document.getElementById('kpi-activity-type').value = 'drawing';
  onKpiActivityChange();
  document.getElementById('kpi-modal-title').innerHTML = `${IC.plus} Add Target KPI`;
  await renderKpiAreaBreakdown(null);
  openModal('kpi-modal');
}

async function openEditKpi(key) {
  const k = kpiData.find(x => kpiRowKey(x) === key);
  if (!k) return;
  const actType = k.document_codes?.activity_type || 'drawing';
  const proj = projectsData.find(p => p.id === kpiProjectId);

  document.getElementById('kpi-id').value               = k.id || '';
  document.getElementById('kpi-value').value = (k.id && k.target_value == null) ? 'N' : (k.target_value ?? '');
  document.getElementById('kpi-estimated-output').value = k.estimated_output != null ? k.estimated_output : '0';
  document.getElementById('kpi-project-display').value  = proj ? `${proj.code} — ${proj.name}` : '—';

  // Discipline, doc code and step are fixed by the catalog (Positions / Admin →
  // Deliverables / Admin → Workflow Steps) — locked here, not choosable.
  document.getElementById('kpi-discipline').innerHTML = `<option value="${k.discipline_id}">${k.disciplines?.name}</option>`;
  document.getElementById('kpi-discipline').disabled = true;
  document.getElementById('kpi-activity-type').value = actType;
  document.getElementById('kpi-activity-type').disabled = true;
  document.getElementById('kpi-value-label').textContent = `Target Value (${KPI_UNITS[actType] || ''})`;
  document.getElementById('kpi-doc-code').innerHTML = `<option value="${k.doc_code_id}">${k.document_codes?.code} — ${k.document_codes?.type}</option>`;
  document.getElementById('kpi-doc-code').disabled = true;
  document.getElementById('kpi-step').innerHTML = `<option value="${k.step_id}">${k.workflow_steps?.name}</option>`;
  document.getElementById('kpi-step').disabled = true;

  document.getElementById('kpi-modal-title').innerHTML = `${IC.edit} ${k.disciplines?.name} — ${k.document_codes?.code} — ${k.workflow_steps?.name}`;
  await renderKpiAreaBreakdown(k.id);
  openModal('kpi-modal');
}

async function saveKpi() {
  const btn              = document.getElementById('kpi-save-btn');
  const id               = document.getElementById('kpi-id').value;
  const discipline_id    = document.getElementById('kpi-discipline').value;
  const doc_code_id      = document.getElementById('kpi-doc-code').value;
  const step_id          = document.getElementById('kpi-step').value;
  const rawValue         = document.getElementById('kpi-value').value.trim();
  const estimated_output = parseFloat(document.getElementById('kpi-estimated-output').value) || 0;

  if (!discipline_id)      { toast('Select a discipline.', 'error'); return; }
  if (!doc_code_id)        { toast('Select a doc code.', 'error'); return; }
  if (!step_id)            { toast('Select a workflow step.', 'error'); return; }
  
  let target_value;
  if (['N', 'NA', 'N/A'].includes(rawValue.toUpperCase())) {
    target_value = null;
  } else {
    target_value = parseFloat(rawValue);
    if (rawValue === '' || isNaN(target_value)) { toast('Enter a valid target value, or "N"/"NA" if not tracked.', 'error'); return; }
  }

  btn.disabled = true; btn.textContent = 'Saving…';

  // Save or update the KPI record
  const payload = { discipline_id, doc_code_id, step_id, target_value, estimated_output, project_id: kpiProjectId };
  let kpiId = id;
  if (id) {
    const { error } = await db.from('target_kpi').update(payload).eq('id', id);
    if (error) { btn.disabled = false; btn.innerHTML = `${IC.save} Save`; toast('Error: ' + error.message, 'error'); return; }
  } else {
    const { data, error } = await db.from('target_kpi').insert(payload).select('id').single();
    if (error) { btn.disabled = false; btn.innerHTML = `${IC.save} Save`; toast('Error: ' + error.message, 'error'); return; }
    kpiId = data.id;
  }

  // Save area breakdown — collect all inputs with a value
  const areaInputs = document.querySelectorAll('.kpi-area-input');
  if (areaInputs.length) {
    const areaRows = Array.from(areaInputs)
      .map(inp => ({
        kpi_id:            kpiId,
        structure_item_id: inp.dataset.structureId,
        estimated_output:  parseFloat(inp.value) || 0,
      }));

    // Delete existing then re-insert (simpler than upsert with compound key)
    await db.from('target_kpi_areas').delete().eq('kpi_id', kpiId);
    if (areaRows.length) {
      const { error: areaErr } = await db.from('target_kpi_areas').insert(areaRows);
      if (areaErr) { toast('KPI saved but area breakdown failed: ' + areaErr.message, 'warning'); }
    }
  }

  btn.disabled = false; btn.innerHTML = `${IC.save} Save`;
  toast(id ? 'KPI updated.' : 'KPI added.', 'success');
  closeModal('kpi-modal');
  await loadKpi();
}

async function deleteAllKpi() {
  if (!kpiProjectId) { toast('No project selected.', 'info'); return; }
  const ids = kpiData.map(k => k.id).filter(Boolean); // exclude unsaved catalog rows (id: null)
  if (!ids.length) { toast('No data to delete for this project.', 'info'); return; }

  openTypeConfirm(
    'This will permanently clear all Target KPI values for this project. This cannot be undone.',
    'Clear',
    'Clear All',
    async () => {
      await db.from('target_kpi_areas').delete().in('kpi_id', ids);
      const { error } = await db.from('target_kpi').delete().in('id', ids);
      if (error) { toast('Error: ' + error.message, 'error'); return; }
      toast('All KPI values cleared.', 'success');
      await loadKpi();
    }
  );
}

async function clearKpiValue(id) {
  confirmDialog('Clear this KPI\'s target value and area breakdown?', async () => {
    await db.from('target_kpi_areas').delete().eq('kpi_id', id);
    const { error } = await db.from('target_kpi').delete().eq('id', id);
    if (error) { toast('Error: ' + error.message, 'error'); return; }
    toast('Cleared.', 'success');
    await loadKpi();
  });
}
