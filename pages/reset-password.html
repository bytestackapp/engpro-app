<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>EngPro App — Reset Password</title>
  <link rel="stylesheet" href="css/main.css" />
  <link rel="icon" href="/favicon.png" type="image/png" />
</head>
<body class="login-page">

  <div class="login-card">
    <div class="login-logo">
      <div class="login-logo-icon">
        <img src="/icons/logo.png" alt="Logo">
      </div>
      <div>
        <div class="login-appname">EngPro App</div>
        <div class="login-tagline">Set a new password</div>
      </div>
    </div>

    <div id="state-checking" style="text-align:center;color:var(--text-3);font-size:13px;padding:20px 0;">
      Verifying your reset link…
    </div>

    <div id="state-invalid" style="display:none;">
      <p style="font-size:13px;color:var(--text-2);margin-bottom:16px;">
        This reset link is invalid or has expired. Please request a new one from the sign-in page.
      </p>
      <a href="index.html" class="btn btn-primary login-btn">Back to Sign In</a>
    </div>

    <div id="state-form" style="display:none;">
      <div class="form-group">
        <label for="new-password">New password</label>
        <input type="password" id="new-password" placeholder="At least 8 characters" autocomplete="new-password" />
      </div>
      <div class="form-group">
        <label for="confirm-password">Confirm new password</label>
        <input type="password" id="confirm-password" placeholder="Re-enter new password" autocomplete="new-password" />
      </div>
      <button class="btn btn-primary login-btn" id="save-btn" onclick="savePassword()">Save Password</button>
    </div>

    <p class="login-footer">Engineering Activity &amp; Manhour Monitoring System</p>
  </div>

  <div id="toast-container"></div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="js/supabase.js"></script>
  <script src="js/utils.js"></script>
  <script>
    let _shown = false;

    function showState(name) {
      ['checking', 'invalid', 'form'].forEach(s => {
        document.getElementById('state-' + s).style.display = (s === name) ? 'block' : 'none';
      });
    }

    function showForm() {
      if (_shown) return;
      _shown = true;
      showState('form');
      document.getElementById('new-password').focus();
    }

    // Supabase reads the recovery token from the link and creates a session.
    db.auth.onAuthStateChange((event, session) => {
      if (event === 'PASSWORD_RECOVERY' || (event === 'SIGNED_IN' && session)) showForm();
    });

    // Fallback if the event was missed or the link is not valid.
    setTimeout(async () => {
      if (_shown) return;
      const { data: { session } } = await db.auth.getSession();
      if (session) showForm(); else showState('invalid');
    }, 2500);

    document.getElementById('confirm-password').addEventListener('keydown', e => {
      if (e.key === 'Enter') savePassword();
    });

    async function savePassword() {
      const p1  = document.getElementById('new-password').value;
      const p2  = document.getElementById('confirm-password').value;
      const btn = document.getElementById('save-btn');

      if (p1.length < 8)  { toast('Password must be at least 8 characters.', 'error'); return; }
      if (p1 !== p2)      { toast('Passwords do not match.', 'error'); return; }

      btn.disabled = true;
      btn.textContent = 'Saving…';

      const { error } = await db.auth.updateUser({ password: p1 });
      if (error) {
        toast(error.message || 'Could not update password.', 'error');
        btn.disabled = false;
        btn.textContent = 'Save Password';
        return;
      }

      toast('Password updated. Please sign in with your new password.', 'success');
      await db.auth.signOut();
      setTimeout(() => { window.location.href = 'index.html'; }, 1500);
    }
  </script>
</body>
</html>
